<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

#home{
  min-height:100vh;
  background:#000;
  padding:18px;
  padding-bottom:95px;
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  grid-template-rows:155px 155px;
  gap:12px;
  max-width:520px;
  margin:0 auto;
}

.new-video{
  grid-column:1 / 3;
  height:72px;
  background:#18e58b;
  color:#000;
  border-radius:18px;
  font-size:21px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:2px;
}

.card{
  border-radius:18px;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:600;
}

.card svg{
  width:38px;
  height:38px;
  margin-bottom:10px;
}

.ai-card{
  grid-column:1;
  grid-row:1;
  margin-top:84px;
}

.photo-card{
  grid-column:2;
  grid-row:1 / 3;
  background:#18e58b;
  color:#000;
}

.space-card{
  grid-column:1;
  grid-row:2;
  margin-top:0;
}

.projects{
  max-width:520px;
  margin:24px auto 0;
}

.projects-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
}

.project-box{
  height:95px;
  background:#111;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:14px;
}

.home-bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#080808;
  border-top:1px solid #202020;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px;
}

.nav-item.active{
  color:#fff;
}

.nav-item svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* EDITOR */

#editor{
  display:none;
  min-height:100vh;
  background:#000;
}

.editor-top{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #171717;
}

.top-btn{
  background:none;
  color:#fff;
  font-size:25px;
  padding:5px;
}

.editor-title{
  font-size:15px;
  font-weight:700;
}

.export-btn{
  background:#18e58b;
  color:#000;
  border-radius:8px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700;
}

.preview-area{
  height:42vh;
  min-height:260px;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#video{
  max-width:100%;
  max-height:100%;
  display:block;
}

.video-placeholder{
  color:#555;
  font-size:14px;
}

.controls{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  border-top:1px solid #151515;
  border-bottom:1px solid #151515;
}

.control-btn{
  background:none;
  color:#fff;
  font-size:20px;
}

/* TIMELINE */

.timeline-area{
  background:#080808;
  padding:12px 16px 18px;
}

.timeline-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aaa;
  font-size:11px;
  margin-bottom:12px;
}

.new-timeline{
  width:100%;
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}

.new-timeline::-webkit-scrollbar{
  display:none;
}

/* MUTE + COVER */

.timeline-box{
  width:43px;
  height:58px;
  min-width:43px;
  background:#111;
  border:1px solid #292929;
  border-radius:6px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.timeline-box svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* THUMBNAILS */

.timeline-thumbs{
  height:58px;
  display:flex;
  flex:0 0 auto;
  overflow:hidden;
  border-radius:6px;
  background:#111;
}

.thumbnail{
  width:68px;
  height:58px;
  min-width:68px;
  object-fit:cover;
  display:block;
  border-right:1px solid #222;
}

/* WHITE PLUS BUTTONS */

.plus-box{
  width:50px;
  height:58px;
  min-width:50px;
  background:#fff;
  color:#000;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:300;
  padding:0;
}

/* LONG WHITE LINE */

.white-timeline-line{
  position:relative;
  width:100%;
  height:25px;
  margin-top:8px;
}

.white-timeline-line::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:11px;
  height:2px;
  background:#fff;
}

#whitePlayhead{
  position:absolute;
  left:0;
  top:3px;
  width:2px;
  height:18px;
  background:#fff;
  z-index:5;
}

/* BOTTOM EDITING TOOLBAR */

.editor-toolbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:#080808;
  border-top:1px solid #1b1b1b;
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  width:100%;
  min-width:0;
  gap:22px;
  padding:8px 16px;
  z-index:900;
  scrollbar-width:none;
  white-space:nowrap;
}

.editor-toolbar::-webkit-scrollbar{
  display:none;
}

.editor-tool{
  flex:0 0 auto;
  min-width:48px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:10px;
}

.editor-tool svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

input[type="file"]{
  display:none;
}

.message{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:2000;
}
</style>
</head>

<body>

<!-- HOME -->

<div id="home">

  <div class="home-grid">

    <button class="new-video" onclick="openVideoPicker()">
      <span style="font-size:28px;line-height:1;">＋</span>
      NEW VIDEO
    </button>

    <button class="card ai-card" onclick="showMessage('AI Generator')">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
        <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>
      </svg>
      AI Generator
    </button>

    <button class="card photo-card" onclick="openPhotoPicker()">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9" r="1.5"/>
        <path d="M3 17l5-5 4 4 3-3 6 5"/>
      </svg>
      Edit Photo
    </button>

    <button class="card space-card" onclick="showMessage('Space')">
      <svg viewBox="0 0 24 24">
        <path d="M4 15c3.5-1 6.5-4 7.5-7.5"/>
        <path d="M7 18c4.5-.5 8.5-4.5 9-9"/>
        <path d="M12 21c4.5-1 8-4.5 9-9"/>
      </svg>
      Space
    </button>

  </div>

  <div class="projects">
    <div class="projects-title">Projects</div>
    <div class="project-box">
      No projects yet
    </div>
  </div>

</div>


<!-- HOME BOTTOM NAV -->

<div class="home-bottom-nav" id="homeBottomNav">

  <button class="nav-item active">
    <svg viewBox="0 0 24 24">
      <path d="M4 11l8-7 8 7"/>
      <path d="M6 10v10h12V10"/>
    </svg>
    Edit
  </button>

  <button class="nav-item">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 8h10"/>
      <path d="M7 12h6"/>
      <path d="M7 16h8"/>
    </svg>
    Templates
  </button>

  <button class="nav-item">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/>
    </svg>
    Me
  </button>

</div>


<!-- EDITOR -->

<div id="editor">

  <div class="editor-top">

    <button class="top-btn" onclick="goHome()">×</button>

    <div class="editor-title">
      ObeSplit
    </div>

    <button class="export-btn" onclick="exportVideo()">
      Export
    </button>

  </div>


  <div class="preview-area">

    <video
      id="video"
      playsinline
      preload="metadata">
    </video>

    <div class="video-placeholder" id="videoPlaceholder">
      Select a video
    </div>

  </div>


  <div class="controls">

    <button class="control-btn" onclick="undo()">↶</button>

    <button class="control-btn" onclick="togglePlay()">
      ▶
    </button>

    <button class="control-btn" onclick="redo()">↷</button>

  </div>


  <div class="timeline-area">

    <div class="timeline-header">
      <span id="currentTime">00:00</span>
      <span id="duration">00:00</span>
    </div>


    <!-- MUTE FIRST, COVER SECOND -->

    <div class="timeline-actions">

      <button class="timeline-action" onclick="toggleMute()">

        <svg id="muteIcon" viewBox="0 0 24 24">
          <path d="M4 10v4h4l5 4V6l-5 4H4z"/>
          <path d="M17 9c1.5 1.5 1.5 4.5 0 6"/>
        </svg>

        <span id="muteText">Mute</span>

      </button>


      <button class="timeline-action" onclick="setCover()">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="9" r="1.5"/>
          <path d="M3 17l5-5 4 4 3-3 6 5"/>
        </svg>

        Cover

      </button>

    </div>


    <!-- THUMBNAILS -->

    <div class="timeline" id="timelineContainer">

      <div
        class="thumbnails"
        id="thumbnails">
      </div>

      <div
        class="playhead"
        id="playhead">
      </div>

    </div>

  </div>


  <!-- ALL EDITING TOOLS IN ONE SLIDING BAR -->

  <div class="editor-toolbar">


    <!-- EDIT -->

    <button class="editor-tool" onclick="showMessage('Edit')">
      <svg viewBox="0 0 24 24">
        <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/>
        <path d="M13 6l3 3"/>
      </svg>
      Edit
    </button>


    <!-- MUSIC -->

    <button class="editor-tool" onclick="showMessage('Music')">
      <svg viewBox="0 0 24 24">
        <path d="M9 18V5l10-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="16" cy="16" r="3"/>
      </svg>
      Music
    </button>


    <!-- TEXT -->

    <button class="editor-tool" onclick="showMessage('Text')">
      <svg viewBox="0 0 24 24">
        <path d="M5 5h14"/>
        <path d="M12 5v14"/>
      </svg>
      Text
    </button>


    <!-- STICKERS -->

    <button class="editor-tool" onclick="showMessage('Stickers')">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"/>
        <circle cx="9" cy="10" r="1"/>
        <circle cx="15" cy="10" r="1"/>
        <path d="M8 15c2 2 6 2 8 0"/>
      </svg>
      Stickers
    </button>


    <!-- EFFECTS -->

    <button class="editor-tool" onclick="showMessage('Effects')">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z"/>
      </svg>
      Effects
    </button>


    <!-- FILTERS -->

    <button class="editor-tool" onclick="showMessage('Filters')">
      <svg viewBox="0 0 24 24">
        <path d="M4 5h16"/>
        <path d="M7 12h10"/>
        <path d="M10 19h4"/>
      </svg>
      Filters
    </button>


    <!-- FORMAT -->

    <button class="editor-tool" onclick="showMessage('Format')">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="6" width="16" height="12" rx="2"/>
        <path d="M8 6V4M16 6V4M8 18v2M16 18v2"/>
      </svg>
      Format
    </button>


    <!-- SPLIT -->

    <button class="editor-tool" onclick="splitVideo()">
      <svg viewBox="0 0 24 24">
        <circle cx="6" cy="6" r="2"/>
        <circle cx="6" cy="18" r="2"/>
        <path d="M8 7l10 10"/>
        <path d="M8 17L18 7"/>
      </svg>
      Split
    </button>


    <!-- SPEED -->

    <button class="editor-tool" onclick="showMessage('Speed')">
      <svg viewBox="0 0 24 24">
        <path d="M4 14a8 8 0 0 1 16 0"/>
        <path d="M12 14l4-5"/>
        <path d="M7 18h10"/>
      </svg>
      Speed
    </button>


    <!-- VOLUME -->

    <button class="editor-tool" onclick="showMessage('Volume')">
      <svg viewBox="0 0 24 24">
        <path d="M4 10v4h4l5 4V6l-5 4H4z"/>
        <path d="M17 9c1.5 1.5 1.5 4.5 0 6"/>
      </svg>
      Volume
    </button>


    <!-- ANIMATION -->

    <button class="editor-tool" onclick="showMessage('Animation')">
      <svg viewBox="0 0 24 24">
        <path d="M5 12h14"/>
        <path d="M12 5l7 7-7 7"/>
      </svg>
      Animation
    </button>


    <!-- DELETE -->

    <button class="editor-tool" onclick="showMessage('Delete')">
      <svg viewBox="0 0 24 24">
        <path d="M5 7h14"/>
        <path d="M9 7V4h6v3"/>
        <path d="M7 7l1 13h8l1-13"/>
      </svg>
      Delete
    </button>


    <!-- ASPECT RATIO -->

    <button class="editor-tool" onclick="showMessage('Aspect Ratio')">
      <svg viewBox="0 0 24 24">
        <path d="M4 8V5h3"/>
        <path d="M17 5h3v3"/>
        <path d="M20 16v3h-3"/>
        <path d="M7 19H4v-3"/>
        <rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      Aspect Ratio
    </button>

  </div>

</div>


<!-- FILE INPUTS -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  onchange="loadVideo(event)">

<input
  type="file"
  id="photoInput"
  accept="image/*"
  onchange="loadPhoto(event)">


<div class="message" id="message"></div>


<script>

const video = document.getElementById("video");

let videoURL = null;
let isPickingFile = false;


/* OPEN VIDEO PICKER */

function openVideoPicker(){

  isPickingFile = true;

  document.getElementById("homeBottomNav").style.display = "none";

  document.getElementById("videoInput").click();

}


/* OPEN PHOTO PICKER */

function openPhotoPicker(){

  isPickingFile = true;

  document.getElementById("homeBottomNav").style.display = "none";

  document.getElementById("photoInput").click();

}


/* FILE PICKER FOCUS */

window.addEventListener("focus",function(){

  if(isPickingFile){

    setTimeout(function(){

      const editorDisplay =
        document.getElementById("editor").style.display;

      if(editorDisplay !== "block"){

        document.getElementById("homeBottomNav").style.display =
          "flex";

      }

      isPickingFile = false;

    },300);

  }

});


/* LOAD VIDEO */

function loadVideo(event){

  isPickingFile = false;

  const file = event.target.files[0];

  if(!file){

    document.getElementById("homeBottomNav").style.display =
      "flex";

    return;

  }

  if(videoURL){

    URL.revokeObjectURL(videoURL);

  }

  videoURL = URL.createObjectURL(file);

  video.src = videoURL;

  document.getElementById("home").style.display =
    "none";

  document.getElementById("homeBottomNav").style.display =
    "none";

  document.getElementById("editor").style.display =
    "block";

  document.getElementById("videoPlaceholder").style.display =
    "none";

  video.onloadedmetadata = function(){

    document.getElementById("duration").textContent =
      formatTime(video.duration);

    generateThumbnails();

  };

}


/* GENERATE THUMBNAILS */

async function generateThumbnails(){

  const container =
    document.getElementById("thumbnails");

  container.innerHTML = "";

  const duration = video.duration;

  if(!duration || isNaN(duration)) return;

  const count = 10;

  const tempVideo =
    document.createElement("video");

  tempVideo.src = videoURL;
  tempVideo.muted = true;
  tempVideo.playsInline = true;
  tempVideo.preload = "auto";

  await new Promise((resolve)=>{

    tempVideo.onloadedmetadata = resolve;

  });

  const canvas =
    document.createElement("canvas");

  canvas.width = 120;
  canvas.height = 80;

  const ctx =
    canvas.getContext("2d");

  for(let i=0;i<count;i++){

    const time =
      (duration / count) * i;

    tempVideo.currentTime =
      time;

    await new Promise((resolve)=>{

      tempVideo.onseeked = ()=>{

        setTimeout(resolve,60);

      };

    });

    ctx.drawImage(
      tempVideo,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const img =
      document.createElement("img");

    img.className =
      "thumbnail";

    img.src =
      canvas.toDataURL();

    container.appendChild(img);

  }

}


/* PLAY / PAUSE */

function togglePlay(){

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

}


/* MUTE */

function toggleMute(){

  video.muted =
    !video.muted;

  const text =
    document.getElementById("muteText");

  const icon =
    document.getElementById("muteIcon");

  if(video.muted){

    text.textContent =
      "Unmute";

    icon.innerHTML =
      '<path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M18 9l4 6M22 9l-4 6"/>';

  }else{

    text.textContent =
      "Mute";

    icon.innerHTML =
      '<path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9c1.5 1.5 1.5 4.5 0 6"/>';

  }

}


/* COVER */

function setCover(){

  if(!video.src){

    showMessage("Select a video first");

    return;

  }

  showMessage(
    "Cover set at " +
    formatTime(video.currentTime)
  );

}


/* TIME UPDATE */

video.addEventListener("timeupdate",function(){

  document.getElementById("currentTime").textContent =
    formatTime(video.currentTime);

  if(video.duration){

    const percentage =
      (video.currentTime / video.duration) * 100;

    document.getElementById("playhead").style.left =
      percentage + "%";

  }

});


/* SPLIT */

function splitVideo(){

  if(!video.src){

    showMessage("Select a video first");

    return;

  }

  showMessage(
    "Split point: " +
    formatTime(video.currentTime)
  );

}


/* FORMAT TIME */

function formatTime(seconds){

  if(!isFinite(seconds)){

    return "00:00";

  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return String(minutes).padStart(2,"0")
    + ":" +
    String(secs).padStart(2,"0");

}


/* GO HOME */

function goHome(){

  video.pause();

  document.getElementById("editor").style.display =
    "none";

  document.getElementById("home").style.display =
    "block";

  document.getElementById("homeBottomNav").style.display =
    "flex";

}


/* LOAD PHOTO */

function loadPhoto(event){

  isPickingFile = false;

  const file =
    event.target.files[0];

  if(!file){

    document.getElementById("homeBottomNav").style.display =
      "flex";

    return;

  }

  showMessage("Photo selected");

  document.getElementById("homeBottomNav").style.display =
    "flex";

}


/* UNDO */

function undo(){

  showMessage("Undo");

}


/* REDO */

function redo(){

  showMessage("Redo");

}


/* EXPORT */

function exportVideo(){

  if(!video.src){

    showMessage("Select a video first");

    return;

  }

  showMessage(
    "Export is ready to be connected"
  );

}


/* MESSAGE */

function showMessage(text){

  const message =
    document.getElementById("message");

  message.textContent =
    text;

  message.style.display =
    "block";

  clearTimeout(
    window.messageTimer
  );

  window.messageTimer =
    setTimeout(function(){

      message.style.display =
        "none";

    },1800);

}

</script>

</body>
      </html>
