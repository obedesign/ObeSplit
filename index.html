<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

body{
  margin:0;
  background:#0e0e0e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer
}

/* HOME */
#home{
  min-height:100vh;
  background:#000;
  padding:18px;
  padding-bottom:95px
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  grid-template-rows:155px 155px;
  gap:12px;
  max-width:520px;
  margin:0 auto
}

.new-video{
  grid-column:1 / 3;
  height:72px;
  background:#18e58b;
  color:#000;
  border-radius:18px;
  font-size:21px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.card{
  border-radius:18px;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:600
}

.card svg{
  width:38px;
  height:38px;
  margin-bottom:10px
}

.ai-card{
  grid-column:1;
  grid-row:1;
  margin-top:84px
}

.photo-card{
  grid-column:2;
  grid-row:1 / 3;
  background:#18e58b;
  color:#000
}

.space-card{
  grid-column:1;
  grid-row:2;
  margin-top:0
}

.projects{
  max-width:520px;
  margin:24px auto 0
}

.projects-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:14px
}

.project-box{
  height:95px;
  background:#111;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:14px
}

.home-bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#080808;
  border-top:1px solid #202020;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000
}

.nav-item{
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px
}

.nav-item.active{
  color:#fff
}

.nav-item svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* EDITOR */
#editor{
  display:none;
  min-height:100vh;
  background:#121212;
  padding-bottom:74px
}

.editor-top{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#121212
}

.top-btn{
  background:none;
  color:#fff;
  font-size:26px;
  padding:5px
}

.editor-title{
  display:none
}

.export-btn{
  background:#18e58b;
  color:#000;
  border-radius:8px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700
}

.preview-area{
  height:54vh;
  min-height:340px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative
}

#video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block
}

.video-placeholder{
  color:#555;
  font-size:14px;
  position:absolute;
  pointer-events:none
}

/* CONTROLS */
.controls{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:22px;
  padding:0 16px;
  background:#121212
}

.control-btn{
  background:none;
  color:#fff;
  font-size:19px;
  opacity:.9;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center
}

/* TIMELINE */
.timeline-area{
  background:#1c1c1c;
  padding:8px 0 6px;
  position:relative;
  border-top:1px solid #222
}

.timeline-header{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  color:#777;
  font-size:10px;
  padding:0 10px 7px;
  font-weight:500;
  letter-spacing:.3px;
  overflow:hidden;
  white-space:nowrap
}

#currentTime{
  flex-shrink:0;
  white-space:nowrap;
  min-width:66px
}

.timeline-header-ruler{
  display:flex;
  gap:16px;
  margin-left:10px;
  overflow:hidden;
  white-space:nowrap;
  color:#888;
  flex:1;
  min-width:0
}

.timeline-wrapper{
  display:flex;
  gap:6px;
  align-items:center;
  position:relative;
  padding:0 8px
}

/* MUTE FIRST / COVER SECOND */
.track-actions{
  display:flex;
  gap:5px;
  flex-shrink:0
}

.track-btn{
  background:#292929;
  color:#bbb;
  border-radius:7px;
  width:48px;
  height:72px;
  padding:4px 2px;
  font-size:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px
}

.track-btn.active{
  background:#353535;
  color:#fff
}

.track-btn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round
}

/* THUMBNAIL STRIP */
.timeline{
  height:72px;
  background:#000;
  border-radius:7px;
  overflow-x:auto;
  overflow-y:hidden;
  position:relative;
  scrollbar-width:none;
  flex:1;
  min-width:0;
  touch-action:pan-x
}

.timeline::-webkit-scrollbar{
  display:none
}

.thumbnails{
  height:100%;
  display:flex;
  width:max-content;
  align-items:center;
  position:relative
}

.thumbnail{
  height:72px;
  width:78px;
  flex:0 0 78px;
  object-fit:cover;
  border-right:1px solid #111;
  display:block;
  pointer-events:none
}

/* WHITE PLUS AT END */
.add-clip-btn{
  height:72px;
  width:48px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  flex:0 0 48px;
  cursor:pointer;
  border-radius:6px;
  margin-left:3px
}

/* PLAYHEAD */
.playhead{
  position:absolute;
  top:-4px;
  bottom:-4px;
  width:2px;
  background:#fff;
  left:0;
  z-index:30;
  pointer-events:none
}

.playhead::before{
  content:"";
  position:absolute;
  top:-4px;
  left:50%;
  transform:translateX(-50%);
  width:9px;
  height:9px;
  background:#fff;
  border-radius:50%
}

/* WHITE LINE */
.timeline-line{
  height:2px;
  background:#fff;
  margin:7px 8px 0;
  border-radius:2px;
  position:relative
}

.timeline-line::before{
  content:"";
  position:absolute;
  left:0;
  top:-4px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff
}

/* ADD AUDIO / TEXT */
.timeline-extra{
  padding:6px 8px 0;
  display:flex;
  gap:6px
}

.extra-row{
  height:30px;
  background:#262626;
  border-radius:6px;
  display:flex;
  align-items:center;
  padding:0 10px;
  color:#888;
  font-size:11px;
  gap:5px;
  flex:1
}

.extra-row .plus{
  color:#fff;
  font-size:15px
}

/* EDITOR TOOLBAR */
.editor-toolbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:74px;
  background:#1c1c1c;
  border-top:1px solid #222;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  overflow-x:auto;
  padding:6px 2px 10px;
  z-index:900;
  scrollbar-width:none
}

.editor-toolbar::-webkit-scrollbar{
  display:none
}

.editor-tool{
  min-width:62px;
  flex:0 0 62px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:9px;
  padding:0
}

.editor-tool svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round
}

input[type="file"]{
  display:none
}

.message{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:2000;
  white-space:nowrap
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">

  <div class="home-grid">

    <button class="new-video" onclick="openVideoPicker()">
      <span style="font-size:28px;line-height:1;">＋</span>
      NEW VIDEO
    </button>

    <button class="card ai-card" onclick="showMessage('AI Generator')">

        <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>
      </svg>
      AI Generator
    </button>

    <button class="card photo-card" onclick="openPhotoPicker()">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9" r="1.5"/>
        <path d="M3 17l5-5 4 4 3-3 6 5"/>
      </svg>
      Edit Photo
    </button>

    <button class="card space-card" onclick="showMessage('Space')">
      <svg viewBox="0 0 24 24">
        <path d="M4 15c3.5-1 6.5-4 7.5-7.5"/>
        <path d="M7 18c4.5-.5 8.5-4.5 9-9"/>
        <path d="M12 21c4.5-1 8-4.5 9-9"/>
      </svg>
      Space

  <div class="projects">
    <div class="projects-title">Projects</div>
    <div class="project-box">No projects yet</div>
  </div>

</div>

<!-- HOME NAV -->
<div class="home-bottom-nav" id="homeBottomNav">

  <button class="nav-item active">
    <svg viewBox="0 0 24 24">
      <path d="M4 11l8-7 8 7"/>
      <path d="M6 10v10h12V10"/>
    </svg>
    Edit
  </button>

  <button class="nav-item">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 8h10"/>
      <path d="M7 12h6"/>
      <path d="M7 16h8"/>
    </svg>
    Templates
  </button>

  <button class="nav-item">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/>
    </svg>
    Me
  </button>

</div>

<!-- EDITOR -->
<div id="editor">

  <div class="editor-top">

    <button class="top-btn" onclick="goHome()">✕</button>

    <div class="editor-title">ObeSplit</div>

    <!-- FIXED: exportVideo() -->
    <button class="export-btn" onclick="exportVideo()">
      Export
    </button>

  </div>

  <div class="preview-area">

    <video id="video" playsinline preload="metadata"></video>

    <div class="video-placeholder" id="videoPlaceholder">
      Select a video
    </div>

  </div>

  <!-- CONTROLS -->
  <div class="controls">

    <button class="control-btn" onclick="toggleFullscreen()">
      ⤢
    </button>

    <button class="control-btn" onclick="togglePlay()" id="playIcon">
      ▶
    </button>

    <button class="control-btn" onclick="undo()">
      ↩
    </button>

    <button class="control-btn" onclick="redo()">
      ↪
    </button>

  </div>

  <!-- TIMELINE -->
  <div class="timeline-area">

    <div class="timeline-header">

      <span id="currentTime">
        00:00 / 00:00
      </span>

      <div class="timeline-header-ruler" id="ruler">
        00:00 • 00:01 • 00:02 • 00:03 • 00:04 • 00:05 • 00:06 • 00:07 • 00:08 • 00:09
      </div>

    </div>

    <div class="timeline-wrapper">

      <!-- MUTE FIRST -->
      <div class="track-actions">

        <button class="track-btn" onclick="toggleMute()" id="timelineMuteBtn">

          <svg viewBox="0 0 24 24">
            <path d="M4 10v4h4l5 4V6l-5 4H4z"/>

        <!-- COVER SECOND -->

  type="file"

>

  type="file"
  id="photoInput"
  accept="image/*"
  onchange="loadPhoto(event)"
>

<script>

const video=document.getElementById("video");
const timeline=document.getElementById("timelineContainer");
const thumbnails=document.getElementById("thumbnails");
const playhead=document.getElementById("playhead");
const playIcon=document.getElementById("playIcon");
const home=document.getElementById("home");
const editor=document.getElementById("editor");
const homeBottomNav=document.getElementById("homeBottomNav");
const videoPlaceholder=document.getElementById("videoPlaceholder");
const currentTime=document.getElementById("currentTime");

let videoURL=null;
let isPickingFile=false;
let thumbnailJob=0;
let isSeekingTimeline=false;

/* -----------------------------
   FILE PICKERS
----------------------------- */

function openVideoPicker(){

  isPickingFile=true;

  homeBottomNav.style.display="none";

  document.getElementById("videoInput").click();
}

function openPhotoPicker(){

  isPickingFile=true;

  homeBottomNav.style.display="none";

  document.getElementById("photoInput").click();
}


/* -----------------------------
   FILE PICKER FOCUS
----------------------------- */

window.addEventListener("focus",function(){

  if(isPickingFile){

    setTimeout(function(){

      const editorVisible=
        editor.style.display==="block";

      if(!editorVisible){

        homeBottomNav.style.display="flex";

      }

      isPickingFile=false;

    },400);
  }

});


/* -----------------------------
   LOAD VIDEO
----------------------------- */

function loadVideo(event){

  isPickingFile=false;

  const file=event.target.files[0];

  if(!file){

    homeBottomNav.style.display="flex";

    return;
  }

  thumbnailJob++;

  if(videoURL){

    URL.revokeObjectURL(videoURL);

  }

  video.pause();

  video.currentTime=0;

  videoURL=URL.createObjectURL(file);

  video.src=videoURL;

  video.load();

  home.style.display="none";

  homeBottomNav.style.display="none";

  editor.style.display="block";

  videoPlaceholder.style.display="none";

  playIcon.textContent="▶";

  currentTime.textContent="00:00 / 00:00";

  playhead.style.left="0px";

  timeline.scrollLeft=0;

  video.onloadedmetadata=function(){

    if(!isFinite(video.duration)){

      showMessage("Could not read video");

      return;
    }

    currentTime.textContent=
      "00:00 / "+formatTime(video.duration);

    generateRuler(video.duration);

    generateThumbnails();

  };

}


/* -----------------------------
   RULER
----------------------------- */

function generateRuler(duration){

  const ruler=document.getElementById("ruler");

  ruler.innerHTML="";

  const total=Math.ceil(duration);

  for(let i=0;i<=total;i++){

    const span=document.createElement("span");

    span.textContent=formatTime(i);

    ruler.appendChild(span);

    if(i<total){

      const dot=document.createElement("span");

      dot.textContent=" • ";

      dot.style.opacity="0.4";

      ruler.appendChild(dot);

    }

  }

}


/* -----------------------------
   THUMBNAILS
----------------------------- */

async function generateThumbnails(){

  const job=thumbnailJob;

  const container=document.getElementById("thumbnails");

  container.innerHTML="";

  /* Put playhead back */
  container.appendChild(playhead);

  const duration=video.duration;

  if(
    !duration ||
    !isFinite(duration) ||
    !videoURL
  ){

    return;
  }

  const count=12;

  const tempVideo=document.createElement("video");

  tempVideo.src=videoURL;
  tempVideo.muted=true;
  tempVideo.playsInline=true;
  tempVideo.preload="auto";

  try{

    await waitForVideoMetadata(tempVideo);

    if(job!==thumbnailJob){
      return;
    }

    const canvas=document.createElement("canvas");

    canvas.width=120;
    canvas.height=80;

    const ctx=canvas.getContext("2d");

    if(!ctx){
      return;
    }

    for(let i=0;i<count;i++){

      if(job!==thumbnailJob){
        return;
      }

      let time=(duration/count)*i;

      /*
        Keep the last thumbnail safely inside
        the video duration.
      */
      if(time>=duration){
        time=Math.max(0,duration-0.05);
      }

      await seekVideo(tempVideo,time);

      if(job!==thumbnailJob){
        return;
      }

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      try{

        ctx.drawImage(
          tempVideo,
          0,
          0,
          canvas.width,
          canvas.height
        );

      }catch(error){

        continue;

      }

      const img=document.createElement("img");

      img.className="thumbnail";

      img.src=canvas.toDataURL("image/jpeg",0.82);

      container.appendChild(img);

    }

    if(job!==thumbnailJob){
      return;
    }

    /*
      Add button after the video thumbnails.
    */
    const addBtn=document.createElement("button");

    addBtn.className="add-clip-btn";

    addBtn.type="button";

    addBtn.innerHTML="+";

    addBtn.onclick=function(){

      openVideoPicker();

    };

    container.appendChild(addBtn);

    playhead.style.left="0px";

  }catch(error){

    console.error("Thumbnail error:",error);

    if(job===thumbnailJob){

      showMessage("Timeline preview unavailable");

    }

  }finally{

    tempVideo.pause();

    tempVideo.removeAttribute("src");

    tempVideo.load();

  }

}


/* -----------------------------
   WAIT FOR VIDEO METADATA
----------------------------- */

function waitForVideoMetadata(tempVideo){

  return new Promise(function(resolve,reject){

    if(tempVideo.readyState>=1){

      resolve();

      return;
    }

    let finished=false;

    const timer=setTimeout(function(){

      if(finished)return;

      finished=true;

      reject(new Error("Metadata timeout"));

    },8000);

    tempVideo.onloadedmetadata=function(){

      if(finished)return;

      finished=true;

      clearTimeout(timer);

      resolve();

    };

    tempVideo
