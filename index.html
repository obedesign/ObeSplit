<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

button{
  border:0;
  outline:0;
  color:white;
  font-family:inherit;
  cursor:pointer;
}

.screen{
  width:100%;
  height:100vh;
  overflow-y:auto;
  background:#000;
}

/* ================= HOME ================= */

#home{
  display:block;
  max-width:700px;
  margin:auto;
  padding:20px 18px 100px;
}

.logo{
  font-size:32px;
  font-weight:900;
  margin:10px 0 5px;
  letter-spacing:-1px;
}

.subtitle{
  color:#999;
  font-size:17px;
  margin-bottom:28px;
}

.new-video{
  width:100%;
  height:105px;
  border-radius:25px;
  background:#18e58b;
  color:#000;
  font-size:27px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 30px rgba(24,229,139,.15);
}

.new-video:active{
  transform:scale(.98);
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:20px;
}

.home-card{
  min-height:150px;
  background:#111;
  border:1px solid #252525;
  border-radius:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:18px;
  gap:12px;
}

.home-card:active{
  background:#1c1c1c;
  transform:scale(.98);
}

.card-icon{
  font-size:45px;
}

.projects{
  margin-top:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.projects h2{
  margin:0;
  font-size:28px;
}

.menu{
  font-size:30px;
  background:none;
}

.bottom-nav{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:82px;
  background:#080808;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.nav-item{
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
}

.nav-icon{
  font-size:27px;
}

.nav-item.active{
  color:#fff;
}

/* ================= EDITOR ================= */

#editor{
  display:none;
  width:100%;
  height:100vh;
  background:#111;
  overflow:hidden;
}

.editor-top{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:15px;
  background:#151515;
}

.top-btn{
  background:none;
  font-size:29px;
  width:42px;
  height:42px;
}

.search{
  font-size:27px;
}

.spacer{
  flex:1;
}

.export{
  background:#14cde5;
  color:#001015;
  font-weight:800;
  padding:13px 18px;
  border-radius:12px;
  font-size:17px;
}

/* VIDEO */

.preview-area{
  height:45vh;
  min-height:300px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#videoPreview{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  background:#000;
  object-fit:contain;
}

.empty-preview{
  color:#555;
  font-size:16px;
}

/* CONTROLS */

.preview-controls{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#151515;
}

.control-left,
.control-right{
  display:flex;
  align-items:center;
  gap:25px;
}

.control-btn{
  background:none;
  font-size:26px;
}

.play{
  font-size:32px;
}

/* TIMELINE */

.timeline{
  height:235px;
  background:#1a1a1a;
  overflow:hidden;
  position:relative;
}

.time-row{
  height:35px;
  display:flex;
  align-items:center;
  color:#aaa;
  font-size:12px;
  padding-left:10px;
  white-space:nowrap;
}

.time-row span{
  margin-right:32px;
}

.timeline-body{
  height:200px;
  overflow-x:auto;
  overflow-y:hidden;
  position:relative;
  padding-left:20px;
}

.timeline-content{
  min-width:700px;
  position:relative;
  padding-top:10px;
}

.video-track{
  height:65px;
  background:#252525;
  border-radius:4px;
  display:flex;
  align-items:center;
  overflow:hidden;
  position:relative;
  border:2px solid #333;
}

.video-thumbnail{
  height:61px;
  width:90px;
  object-fit:cover;
  flex:none;
  background:#000;
}

.audio-track,
.text-track{
  height:43px;
  margin-top:8px;
  background:#242424;
  border-radius:4px;
  color:#777;
  display:flex;
  align-items:center;
  padding-left:15px;
  font-size:14px;
}

.add{
  margin-right:8px;
  font-size:20px;
  color:#aaa;
}

.playhead{
  position:absolute;
  top:0;
  left:25px;
  width:2px;
  height:190px;
  background:#fff;
  z-index:10;
}

.playhead:before{
  content:"";
  position:absolute;
  top:0;
  left:-5px;
  width:12px;
  height:12px;
  background:#fff;
  border-radius:50%;
}

/* SIDE TOOLS */

.clip-tools{
  position:absolute;
  left:10px;
  bottom:5px;
  display:flex;
  gap:8px;
}

.clip-tool{
  width:95px;
  height:70px;
  background:#202020;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:12px;
}

.clip-tool span{
  font-size:25px;
}

/* BOTTOM TOOLBAR */

.editor-toolbar{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:86px;
  background:#181818;
  border-top:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-around;
  overflow-x:auto;
  z-index:30;
}

.editor-tool{
  min-width:70px;
  height:75px;
  background:none;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:12px;
}

.editor-tool span{
  font-size:27px;
}

.editor-tool:active{
  background:#292929;
  border-radius:10px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:100;
  align-items:flex-end;
}

.modal-box{
  width:100%;
  background:#1b1b1b;
  border-radius:25px 25px 0 0;
  padding:25px;
}

.modal-box h3{
  margin-top:0;
}

.modal-button{
  width:100%;
  height:55px;
  margin-top:10px;
  background:#292929;
  border-radius:12px;
  font-size:16px;
}

/* MOBILE */

@media(max-width:500px){

  #home{
    padding:18px 14px 95px;
  }

  .logo{
    font-size:28px;
  }

  .new-video{
    height:100px;
    font-size:24px;
  }

  .home-grid{
    gap:12px;
  }

  .home-card{
    min-height:135px;
  }

  .preview-area{
    height:40vh;
    min-height:260px;
  }

  .timeline{
    height:225px;
  }

  .editor-toolbar{
    height:82px;
  }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div id="home" class="screen">

  <div class="logo">Create. Edit. Split.</div>

  <div class="subtitle">
    Powerful video editing made simple.
  </div>

  <button class="new-video" onclick="openVideoPicker()">
    ＋ NEW VIDEO
  </button>

  <div class="home-grid">

    <button class="home-card" onclick="openVideoPicker()">
      <div class="card-icon">🎬</div>
      <div>Edit Video</div>
    </button>

    <button class="home-card" onclick="openPhotoPicker()">
      <div class="card-icon">🖼️</div>
      <div>Edit Photo</div>
    </button>

    <button class="home-card" onclick="showMessage('Templates are coming soon.')">
      <div class="card-icon">✨</div>
      <div>Templates</div>
    </button>

    <button class="home-card" onclick="showMessage('Space is coming soon.')">
      <div class="card-icon">☁️</div>
      <div>Space</div>
    </button>

  </div>

  <div class="projects">
    <h2>Projects</h2>
    <button class="menu">☰</button>
  </div>

</div>


<!-- ================= EDITOR ================= -->

<div id="editor">

  <div class="editor-top">

    <button class="top-btn" onclick="goHome()">×</button>

    <button class="top-btn search">⌕</button>

    <div class="spacer"></div>

    <button class="export" onclick="exportVideo()">
      Export
    </button>

  </div>


  <!-- VIDEO PREVIEW -->

  <div class="preview-area">

    <div class="empty-preview" id="emptyPreview">
      Select a video to begin
    </div>

    <video
      id="videoPreview"
      controls="false"
      playsinline
      preload="metadata"
    ></video>

  </div>


  <!-- PREVIEW CONTROLS -->

  <div class="preview-controls">

    <div class="control-left">

      <button class="control-btn" onclick="toggleFullscreen()">
        ⛶
      </button>

    </div>

    <button class="control-btn play" onclick="togglePlay()">
      ▶
    </button>

    <div class="control-right">

      <button class="control-btn" onclick="undoAction()">
        ↶
      </button>

      <button class="control-btn" onclick="redoAction()">
        ↷
      </button>

    </div>

  </div>


  <!-- TIMELINE -->

  <div class="timeline">

    <div class="time-row">
      <span>00:00</span>
      <span>00:01</span>
      <span>00:02</span>
      <span>00:03</span>
      <span>00:04</span>
      <span>00:05</span>
      <span>00:06</span>
      <span>00:07</span>
    </div>

    <div class="timeline-body">

      <div class="timeline-content">

        <div class="playhead"></div>

        <div class="video-track" id="videoTrack">
        </div>

        <div class="audio-track">
          <span class="add">＋</span>
          Add audio
        </div>

        <div class="text-track">
          <span class="add">＋</span>
          Add text
        </div>

      </div>

    </div>

  </div>


  <!-- CLIP TOOLS -->

  <div class="clip-tools">

    <button class="clip-tool" onclick="muteVideo()">
      <span>🔊</span>
      Mute clip
    </button>

    <button class="clip-tool" onclick="showMessage('Cover editor opened.')">
      <span>✎</span>
      Cover
    </button>

  </div>


  <!-- BOTTOM TOOLS -->

  <div class="editor-toolbar">

    <button class="editor-tool" onclick="editTool()">
      <span>✂</span>
      Edit
    </button>

    <button class="editor-tool" onclick="showMessage('Audio tools opened.')">
      <span>♪</span>
      Audio
    </button>

    <button class="editor-tool" onclick="showMessage('Text tools opened.')">
      <span>T</span>
      Text
    </button>

    <button class="editor-tool" onclick="showMessage('Effects opened.')">
      <span>☆</span>
      Effects
    </button>

    <button class="editor-tool" onclick="showMessage('Overlay opened.')">
      <span>▧</span>
      Overlay
    </button>

    <button class="editor-tool" onclick="showMessage('Captions opened.')">
      <span>▤</span>
      Captions
    </button>

    <button class="editor-tool" onclick="showMessage('Filters opened.')">
      <span>◌</span>
      Filters
    </button>

  </div>

</div>


<!-- FILE INPUTS -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  style="display:none"
  onchange="loadVideo(event)"
>

<input
  type="file"
  id="photoInput"
  accept="image/*"
  style="display:none"
  onchange="loadPhoto(event)"
>


<script>

let currentVideoURL = null;
let video = document.getElementById("videoPreview");


/* ================= FILE PICKERS ================= */

function openVideoPicker(){

  document.getElementById("videoInput").click();

}


function openPhotoPicker(){

  document.getElementById("photoInput").click();

}


/* ================= LOAD VIDEO ================= */

function loadVideo(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  if(currentVideoURL){
    URL.revokeObjectURL(currentVideoURL);
  }

  currentVideoURL = URL.createObjectURL(file);

  video.src = currentVideoURL;

  document.getElementById("home").style.display = "none";

  document.getElementById("editor").style.display = "block";

  document.getElementById("emptyPreview").style.display = "none";

  createTimelineThumbnail();

}


/* ================= TIMELINE ================= */

function createTimelineThumbnail(){

  const track = document.getElementById("videoTrack");

  track.innerHTML = "";

  for(let i=0;i<8;i++){

    const img = document.createElement("img");

    img.className = "video-thumbnail";

    img.src = currentVideoURL;

    track.appendChild(img);

  }

}


/* ================= PLAY ================= */

function togglePlay(){

  if(!video.src){
    return;
  }

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

}


/* ================= MUTE ================= */

function muteVideo(){

  video.muted = !video.muted;

  showMessage(
    video.muted ? "Video muted" : "Video sound restored"
  );

}


/* ================= FULLSCREEN ================= */

function toggleFullscreen(){

  const area = document.querySelector(".preview-area");

  if(!document.fullscreenElement){

    if(area.requestFullscreen){
      area.requestFullscreen();
    }

  }else{

    document.exitFullscreen();

  }

}


/* ================= HOME ================= */

function goHome(){

  video.pause();

  document.getElementById("editor").style.display = "none";

  document.getElementById("home").style.display = "block";

}


/* ================= PHOTO ================= */

function loadPhoto(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  showMessage("Photo selected. Photo editing will be added next.");

}


/* ================= BUTTON ACTIONS ================= */

function editTool(){

  showMessage("Edit tools opened.");

}


function undoAction(){

  showMessage("Undo");

}


function redoAction(){

  showMessage("Redo");

}


function exportVideo(){

  showMessage(
    "Export is ready for the next stage of development."
  );

}


/* ================= MESSAGE ================= */

function showMessage(message){

  const box = document.createElement("div");

  box.innerText = message;

  box.style.position = "fixed";
  box.style.left = "50%";
  box.style.bottom = "100px";
  box.style.transform = "translateX(-50%)";
  box.style.background = "#222";
  box.style.color = "#fff";
  box.style.padding = "13px 20px";
  box.style.borderRadius = "12px";
  box.style.zIndex = "9999";
  box.style.fontSize = "14px";
  box.style.boxShadow = "0 5px 20px rgba(0,0,0,.5)";

  document.body.appendChild(box);

  setTimeout(function(){

    box.remove();

  },1800);

}


/* ================= VIDEO TIME ================= */

video.addEventListener("timeupdate",function(){

  const duration = video.duration;

  if(!duration || !isFinite(duration)){
    return;
  }

  const progress = video.currentTime / duration;

  const playhead = document.querySelector(".playhead");

  const timeline = document.querySelector(".timeline-content");

  if(timeline){

    const width = timeline.scrollWidth - 30;

    playhead.style.left =
      (25 + progress * width) + "px";

  }

});

</script>

</body>
</html>
