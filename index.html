<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ObeSplit - CapCut Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0e0e0e;
      color: #ffffff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      height: 45px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #282828;
      font-size: 14px;
      font-weight: bold;
    }
    .export-btn {
      background: #00FFCC;
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Video Preview Screen */
    .preview-container {
      flex: 1;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .video-placeholder {
      color: #555;
      font-size: 14px;
    }

    /* Timeline Track Area (Now positioned right below preview) */
    .timeline {
      background: #121212;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #282828;
    }
    .track-row {
      height: 40px;
      background: #1f1f1f;
      border-radius: 6px;
      border: 1px dashed #333;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 12px;
      color: #888;
    }

    /* Action Toolbar (Now positioned at the very bottom) */
    .toolbar {
      height: 60px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 1px solid #282828;
    }
    .tool-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .tool-btn:hover {
      color: #00FFCC;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <span>ObeSplit Editor</span>
    <button class="export-btn">Export</button>
  </div>

  <!-- Preview Area -->
  <div class="preview-container">
    <div class="video-placeholder">Video Preview Player</div>
  </div>

  <!-- Timeline Tracks (Moved Up) -->
  <div class="timeline">
    <div class="track-row">Video Track 1</div>
    <div class="track-row">Audio Track 2</div>
  </div>

  <!-- Action Toolbar (Moved Down to bottom) -->
  <div class="toolbar">
    <button class="tool-btn">✂️ Split</button>
    <button class="tool-btn">➕ Add Clip</button>
    <button class="tool-btn">🎵 Audio</button>
    <button class="tool-btn">💬 Text</button>
    <button class="tool-btn">✨ Effects</button>
  </div>

</body>
</html>
