<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ObeSplit</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:Inter,system-ui,Arial,sans-serif;
}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
}

body{
  display:flex;
  justify-content:center;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

input[type=range]{
  accent-color:#18E58B;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
  -ms-overflow-style:none;
}

#app{
  width:100%;
  max-width:440px;
  min-height:100vh;
  background:#121212;
  color:#fff;
  position:relative;
  overflow:hidden;
}

#previewWrap{
  min-height:280px;
}

#previewBox{
  width:62%;
  aspect-ratio:9/16;
  transition:.2s;
}

#video,
#photoPreview{
  background:#000;
}

#textLayer{
  z-index:20;
}

.edit-text{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#fff;
  font-size:24px;
  font-weight:700;
  text-align:center;
  white-space:nowrap;
  text-shadow:0 2px 8px #000;
}

#gridOverlay{
  position:absolute;
  inset:0;
  z-index:15;
  pointer-events:none;
  display:none;
  background:
    linear-gradient(to right,
      transparent 32.9%,
      rgba(255,255,255,.35) 33%,
      transparent 33.2%,
      transparent 66.4%,
      rgba(255,255,255,.35) 66.6%,
      transparent 66.8%),
    linear-gradient(to bottom,
      transparent 32.9%,
      rgba(255,255,255,.35) 33%,
      transparent 33.2%,
      transparent 66.4%,
      rgba(255,255,255,.35) 66.6%,
      transparent 66.8%);
}

#timeline{
  min-height:225px;
}

#trackViewport{
  flex:1;
  height:60px;
  overflow-x:auto;
  overflow-y:hidden;
  touch-action:pan-x;
}

#track{
  height:52px;
  min-width:100%;
  position:relative;
  background:#000;
  border:1px solid #222;
  border-radius:8px;
}

#trackContent{
  height:52px;
  position:relative;
  min-width:100%;
}

#thumbStrip{
  height:52px;
  display:flex;
}

.clip{
  height:52px;
  position:relative;
  flex-shrink:0;
  overflow:hidden;
  border-right:2px solid #111;
  background:#222;
  touch-action:none;
}

.clip img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  pointer-events:none;
}

.clip.selected{
  outline:2px solid #18E58B;
  outline-offset:-2px;
}

.clip-label{
  position:absolute;
  bottom:3px;
  left:4px;
  padding:2px 4px;
  background:rgba(0,0,0,.7);
  border-radius:3px;
  font-size:8px;
}

#timelinePlayhead{
  position:absolute;
  top:-5px;
  bottom:-5px;
  width:2px;
  background:#fff;
  z-index:30;
  pointer-events:none;
  left:0;
}

#timelinePlayhead:before{
  content:"";
  position:absolute;
  top:-2px;
  left:-4px;
  width:10px;
  height:10px;
  background:#fff;
  transform:rotate(45deg);
}

.key-marker{
  position:absolute;
  top:5px;
  width:8px;
  height:8px;
  background:#18E58B;
  transform:rotate(45deg);
  z-index:25;
}

.tool-sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:69px;
  z-index:70;
  background:#1a1a1a;
  border-top:1px solid #333;
  padding:13px;
  max-height:230px;
  overflow-y:auto;
}

.tool-option{
  min-height:44px;
  padding:8px;
  border-radius:10px;
  background:#252525;
  border:1px solid #333;
  font-size:11px;
}

.tool-option.active{
  background:#18E58B;
  color:#000;
}

.small-toggle{
  width:44px;
  height:24px;
  border-radius:20px;
  padding:2px;
  display:flex;
}

.small-toggle span{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#fff;
}

.small-toggle.on{
  background:#18E58B;
  justify-content:flex-end;
}

.small-toggle.off{
  background:#3a3a3a;
  justify-content:flex-start;
}

#exportPanel{
  z-index:100;
}

.setting-option.active{
  background:#18E58B!important;
  color:#000!important;
  font-weight:700;
}

#toast{
  position:absolute;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#262626;
  color:#fff;
  padding:9px 14px;
  border-radius:10px;
  font-size:12px;
  z-index:200;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
}

.filter-normal{filter:none}
.filter-warm{filter:sepia(.25) saturate(1.25) contrast(1.05)}
.filter-cool{filter:saturate(.9) hue-rotate(12deg)}
.filter-contrast{filter:contrast(1.3)}
.filter-fade{filter:brightness(1.1) saturate(.75)}

#moreSettingsBox{
  display:none;
}

#moreSettingsBox.show{
  display:block;
}
</style>
</head>

<body>

<div id="app">

<!-- TOP BAR -->
<div class="flex items-center justify-between px-3 py-3 border-b border-[#1e1e1e]">

  <div class="flex gap-4 items-center">

    <button id="closeEditor" class="w-8 h-8 flex items-center justify-center">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <button id="searchBtn" class="w-8 h-8 flex items-center justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <path d="M16 16l5 5"/>
      </svg>
    </button>

  </div>

  <div class="flex gap-2 items-center">

    <button id="aiBtn"
      class="bg-[#2a2a2a] border border-[#333] px-3 py-2 rounded-xl text-xs font-semibold flex gap-2 items-center">

      AI UHD

      <svg width="10" height="10" viewBox="0 0 24 24" fill="#18E58B">
        <path d="M12 2L2 12l10 10 10-10L12 2z"/>
      </svg>

    </button>

    <button id="exportBtn"
      class="bg-[#18E58B] text-black px-5 h-9 rounded-xl font-bold text-sm">
      Export
    </button>

  </div>
</div>


<!-- PREVIEW -->
<div id="previewWrap"
  class="flex justify-center bg-[#0a0a0a] p-3">

  <div id="previewBox"
    class="relative bg-black overflow-hidden rounded-sm">

    <video id="video"
      class="w-full h-full object-cover"
      playsinline
      preload="metadata">
    </video>

    <img id="photoPreview"
      class="hidden absolute inset-0 w-full h-full object-cover">

    <div id="gridOverlay"></div>

    <div id="textLayer"
      class="absolute inset-0 pointer-events-none">
    </div>

    <canvas id="exportCanvas" class="hidden"></canvas>

  </div>
</div>


<!-- PREVIEW CONTROLS -->
<div class="flex justify-between items-center px-4 py-3 border-y border-[#1e1e1e]">

  <button id="fullscreenBtn">

    <svg width="20" height="20" viewBox="0 0 24 24"
      fill="none" stroke="white" stroke-width="1.6">
      <path d="M9 3H3v6M15 3h6v6M3 21h6v-6M21 21h-6v-6"/>
    </svg>

  </button>

  <button id="playBtn"
    class="w-9 h-9 flex items-center justify-center bg-white/10 rounded-full">

    <svg id="playI" width="18" height="18"
      viewBox="0 0 24 24" fill="white">
      <path d="M8 5.5L18 12L8 18.5V5.5Z"/>
    </svg>

    <svg id="pauseI" class="hidden"
      width="18" height="18" viewBox="0 0 24 24" fill="white">
      <rect x="6" y="5" width="4" height="14" rx="1"/>
      <rect x="14" y="5" width="4" height="14" rx="1"/>
    </svg>

  </button>

  <div class="flex gap-4 items-center">

    <button id="previewFitBtn">
      <svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M8 3v5M3 8h5M16 3v5M21 8h-5M3 16h5M8 21v-5M21 16h-5M16 21v-5"/>
      </svg>
    </button>

    <button id="undoBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <path d="M9 8H5V4"/>
        <path d="M5 8a8 8 0 0113-3"/>
      </svg>
    </button>

    <button id="redoBtn">
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="1.7">
        <path d="M15 8h4V4"/>
        <path d="M19 8a8 8 0 00-13-3"/>
      </svg>
    </button>

    <button id="kfBtn"
      class="w-8 h-8 bg-[#2a2a2a] rounded-lg flex items-center justify-center border border-[#333]">

      <svg width="14" height="14" viewBox="0 0 24 24" fill="white">
        <path d="M12 2L2 12l10 10 10-10L12 2z"/>
      </svg>

    </button>

  </div>
</div>


<!-- TIME -->
<div class="flex justify-between px-3 py-2 text-[11px] text-gray-400">
  <span id="timeLabel">00:00 / 00:00</span>
  <span id="ruler">00:00 • 00:01 • 00:02 • 00:03</span>
</div>


<!-- TIMELINE -->
<div id="timeline" class="bg-[#181818] relative overflow-hidden">

  <div class="flex px-2 pt-2 gap-2">

    <div class="flex gap-2 shrink-0">

      <button id="muteBtn"
        class="bg-[#222] w-[68px] h-[52px] rounded-xl flex flex-col items-center justify-center gap-1 text-[10px]">

        <svg width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M16 9l5 6M21 9l-5 6"/>
        </svg>

        <span id="muteText">Mute clip</span>

      </button>

      <button id="coverBtn"
        class="bg-[#2a2a2a] w-[68px] h-[52px] rounded-xl flex flex-col items-center justify-center gap-1 text-[10px]">

        <svg width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M21 15l-4-4-6 6-2-2-4 4"/>
        </svg>

        Cover

      </button>

    </div>

    <div id="trackViewport" class="no-scrollbar">

      <div id="track">

        <div id="trackContent">

          <div id="thumbStrip"></div>

          <div id="timelinePlayhead"></div>

          <div id="kfMarkers"></div>

        </div>

        <button id="addMediaBtn"
          class="absolute right-1 top-1/2 -translate-y-1/2 w-8 h-8 bg-white rounded-lg flex items-center justify-center text-black font-bold text-xl z-40">
          +
        </button>

      </div>

    </div>

  </div>

  <!-- TIMELINE ZOOM -->
  <div class="px-2 pt-2 flex items-center gap-2">

    <span class="text-[10px] text-gray-500">Zoom</span>

    <input id="timelineZoom"
      type="range"
      min="20"
      max="100"
      value="40"
      class="flex-1">

    <span id="zoomValue"
      class="text-[10px] text-gray-500 w-9 text-right">
      40px/s
    </span>

  </div>

  <div class="px-2 pt-3 flex gap-2">

    <div class="w-[144px] shrink-0"></div>

    <button id="addAudio"
      class="flex-1 h-9 bg-[#232323] rounded-md text-left px-3 text-[13px] text-[#999]">
      + Add audio
    </button>

  </div>

  <div class="px-2 pt-2 pb-4 flex gap-2">

    <div class="w-[144px] shrink-0"></div>

    <button id="addText"
      class="flex-1 h-9 bg-[#232323] rounded-md text-left px-3 text-[13px] text-[#999]">
      + Add text
    </button>

  </div>

</div>


<!-- BOTTOM TOOLS -->
<div class="border-t border-[#1e1e1e] bg-[#121212]">

  <div id="bottom"
    class="flex gap-1 overflow-x-auto no-scrollbar px-2 py-3">

    <button data-tool="edit"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 20h4L19 9l-4-4L4 16v4z"/>
        <path d="M13 6l4 4"/>
      </svg>
      Edit
    </button>

    <button data-tool="audio"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M9 18V6l10-2v12"/>
        <circle cx="7" cy="18" r="2"/>
        <circle cx="17" cy="16" r="2"/>
      </svg>
      Audio
    </button>

    <button data-tool="text"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16M12 7v10"/>
      </svg>
      Text
    </button>

    <button data-tool="effects"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 2l2 5 5 1-5 1-2 5-2-5-5-1 5-1 2-5z"/>
      </svg>
      Effects
    </button>

    <button data-tool="overlay"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      Overlay
    </button>

    <button data-tool="captions"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M6 9h6M6 13h6M14 9h6"/>
      </svg>
      Captions
    </button>

    <button data-tool="filters"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M4 6h16M8 12h8M10 18h4"/>
      </svg>
      Filters
    </button>

    <button data-tool="bg"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M7 17l4-5 3 3 2-2 3 4"/>
      </svg>
      Background
    </button>

    <button data-tool="ratio"
      class="min-w-[64px] flex flex-col items-center gap-1 text-[11px]">
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="4" y="6" width="16" height="12" rx="1"/>
      </svg>
      Aspect Ratio
    </button>

  </div>
</div>


<!-- TOOL SHEET -->
<div id="toolSheet" class="tool-sheet hidden">

  <div class="flex justify-between items-center mb-3">

    <span id="toolTitle" class="font-semibold text-sm">
      Edit
    </span>

    <button id="closeToolSheet">
      <svg width="18" height="18" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

  </div>

  <div id="toolOptions" class="grid grid-cols-3 gap-2"></div>

</div>


<!-- EXPORT SETTINGS -->
<div id="exportPanel"
  class="hidden absolute inset-0 bg-[#0e0e0e]/90 backdrop-blur">

  <div class="absolute inset-0 top-[52px] bg-[#121212] rounded-t-[20px] overflow-y-auto no-scrollbar p-4 pb-10">

    <div class="flex justify-between items-center mb-4">

      <h2 class="font-semibold">
        Export Settings
      </h2>

      <button id="closeExportPanel"
        class="w-8 h-8 bg-[#2a2a2a] rounded-full flex items-center justify-center">

        <svg width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>

      </button>

    </div>

    <div class="flex bg-[#1E1E1E] rounded-full p-1 mb-5 w-fit">

      <button id="tabVideo"
        class="px-6 h-8 rounded-full bg-white text-black text-sm font-medium">
        Video
      </button>

      <button id="tabGif"
        class="px-6 h-8 rounded-full text-gray-400 text-sm">
        GIF
      </button>

    </div>

    <div class="bg-[#1E1E1E] rounded-2xl p-4 flex justify-between items-center mb-4">

      <div class="flex items-center gap-2">

        <span class="text-sm font-medium">
          AI Ultra HD
        </span>

        <svg width="12" height="12" viewBox="0 0 24 24" fill="#18E58B">
          <path d="M12 2L2 12l10 10 10-10L12 2z"/>
        </svg>

      </div>

      <button id="aiToggle" class="small-toggle on">
        <span></span>
      </button>

    </div>

    <div class="mb-5">

      <div class="text-[13px] text-gray-400 mb-3">
        Resolution
      </div>

      <div class="grid grid-cols-4 gap-2">

        <button class="res setting-option bg-[#2a2a2a] py-3 rounded-xl text-xs" data-r="480p">480p</button>

        <button class="res setting-option bg-[#2a2a2a] py-3 rounded-xl text-xs" data-r="720p">720p</button>

        <button class="res setting-option active bg-[#18E58B] text-black py-3 rounded-xl text-xs font-bold" data-r="1080p">1080p</button>

        <button class="res setting-option bg-[#2a2a2a] py-3 rounded-xl text-xs" data-r="2K/4K">2K/4K</button>

      </div>

    </div>

    <div class="mb-5">

      <div class="text-[13px] text-gray-400 mb-3">
        Frame Rate
      </div>

      <div class="flex gap-2 flex-wrap">

        <button class="fps setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-f="24">24 FPS</button>

        <button class="fps setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-f="25">25 FPS</button>

        <button class="fps setting-option active px-4 h-9 rounded-full bg-[#18E58B] text-black text-xs font-bold" data-f="30">30 FPS</button>

        <button class="fps setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-f="50">50 FPS</button>

        <button class="fps setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-f="60">60 FPS</button>

      </div>

    </div>

    <div class="mb-5">

      <div class="text-[13px] text-gray-400 mb-3">
        Bitrate (Mbps)
      </div>

      <div class="flex gap-2 flex-wrap mb-3">

        <button class="br setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-b="5">5 Mbps</button>

        <button class="br setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-b="10">10 Mbps</button>

        <button class="br setting-option active px-4 h-9 rounded-full bg-[#18E58B] text-black text-xs font-bold" data-b="20">20 Mbps</button>

        <button class="br setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-b="50">50 Mbps</button>

        <button class="br setting-option px-4 h-9 rounded-full bg-[#2a2a2a] text-xs" data-b="100">100 Mbps</button>

      </div>

      <input id="brRange"
        type="range"
        min="5"
        max="100"
        step="5"
        value="20"
        class="w-full">

    </div>

    <div class="bg-[#2a2a2a] rounded-2xl p-4 flex justify-between items-center mb-4">

      <span class="text-sm">
        Watermark
      </span>

      <div class="flex gap-2 items-center">

        <span id="wmText" class="text-xs text-gray-400">
          No watermark
        </span>

        <button id="wmToggle" class="small-toggle off">
          <span></span>
        </button>

      </div>

    </div>

    <div class="bg-[#2a2a2a] rounded-2xl p-4 flex justify-between mb-4">

      <span class="text-xs text-gray-400">
        Estimated file size
      </span>

      <span id="estSize" class="text-sm font-medium">
        ~ 0.0 MB
      </span>

    </div>

    <button id="moreSettings"
      class="w-full bg-[#2a2a2a] rounded-2xl p-4 flex justify-between">

      <span class="text-sm">
        More export settings
      </span>

      <span id="moreArrow">›</span>

    </button>

    <div id="moreSettingsBox"
      class="bg-[#202020] rounded-2xl mt-2 p-4 text-xs text-gray-400">

      <div class="flex justify-between mb-3">
        <span>Format</span>
        <span id="formatValue" class="text-white">WebM</span>
      </div>

      <div class="flex justify-between mb-3">
        <span>Audio</span>
        <span class="text-white">Included</span>
      </div>
