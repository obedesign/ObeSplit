<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0e0e0e;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

/* =========================
   HOME
========================= */

#home{
  min-height:100vh;
  background:#000;
  padding:18px;
  padding-bottom:95px;
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  grid-template-rows:155px 155px;
  gap:12px;
  max-width:520px;
  margin:0 auto;
}

.new-video{
  grid-column:1 / 3;
  height:72px;
  background:#18e58b;
  color:#000;
  border-radius:18px;
  font-size:21px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.card{
  border-radius:18px;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:600;
}

.card svg{
  width:38px;
  height:38px;
  margin-bottom:10px;
}

.ai-card{
  grid-column:1;
  grid-row:1;
  margin-top:84px;
}

.photo-card{
  grid-column:2;
  grid-row:1 / 3;
  background:#18e58b;
  color:#000;
}

.space-card{
  grid-column:1;
  grid-row:2;
  margin-top:0;
}

.projects{
  max-width:520px;
  margin:24px auto 0;
}

.projects-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
}

.project-box{
  height:95px;
  background:#111;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:14px;
}

.home-bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#080808;
  border-top:1px solid #202020;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px;
}

.nav-item.active{
  color:#fff;
}

.nav-item svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   EDITOR
========================= */

#editor{
  display:none;
  min-height:100vh;
  background:#121212;
  padding-bottom:74px;
}

.editor-top{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#121212;
}

.top-left{
  display:flex;
  align-items:center;
  gap:22px;
}

.top-btn{
  background:none;
  color:#fff;
  font-size:38px;
  font-weight:200;
  line-height:1;
  padding:0;
}

.search-btn{
  background:none;
  color:#fff;
  width:32px;
  height:32px;
  padding:3px;
}

.search-btn svg{
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
}

.editor-title{
  display:none;
}

/* GREEN EXPORT */
.export-btn{
  background:#18e58b;
  color:#000;
  border-radius:9px;
  padding:9px 15px;
  font-size:14px;
  font-weight:700;
}


/* =========================
   VIDEO PREVIEW
========================= */

.preview-area{
  height:54vh;
  min-height:340px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.video-placeholder{
  color:#555;
  font-size:14px;
}


/* =========================
   VIDEO CONTROLS
========================= */

.controls{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:#121212;
}

.control-left{
  display:flex;
  align-items:center;
}

.control-right{
  display:flex;
  align-items:center;
  gap:25px;
}

.control-btn{
  background:none;
  color:#fff;
  width:32px;
  height:32px;
  padding:3px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.control-btn svg{
  width:100%;
  height:100%;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.play-btn svg{
  fill:currentColor;
  stroke:none;
}


/* =========================
   TIMELINE
========================= */

.timeline-area{
  background:#1c1c1c;
  padding:5px 0 7px;
  position:relative;
  border-top:1px solid #222;
}

.timeline-header{
  height:38px;
  display:flex;
  align-items:center;
  color:#888;
  font-size:10px;
  padding:0 10px;
  overflow:hidden;
  white-space:nowrap;
}

#currentTime{
  flex-shrink:0;
  min-width:82px;
  white-space:nowrap;
  color:#aaa;
}

.timeline-header-ruler{
  display:flex;
  gap:15px;
  margin-left:10px;
  overflow:hidden;
  white-space:nowrap;
  color:#888;
  flex:1;
  min-width:0;
}


/* TIMELINE BODY */

.timeline-wrapper{
  display:flex;
  gap:7px;
  align-items:center;
  position:relative;
  padding:0 10px;
}


/* MUTE + COVER */

.track-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.track-btn{
  background:#292929;
  color:#aaa;
  border-radius:8px;
  width:68px;
  height:82px;
  padding:5px 2px;
  font-size:9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.track-btn.active{
  background:#292929;
  color:#fff;
}

.track-btn svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* VIDEO TRACK */

.timeline{
  height:82px;
  background:#000;
  border-radius:3px;
  overflow-x:auto;
  overflow-y:hidden;
  position:relative;
  scrollbar-width:none;
  flex:1;
  min-width:0;
}

.timeline::-webkit-scrollbar{
  display:none;
}

.thumbnails{
  height:100%;
  display:flex;
  width:max-content;
  align-items:center;
  position:relative;
}

.thumbnail{
  height:82px;
  width:82px;
  flex:0 0 82px;
  object-fit:cover;
  border-right:1px solid #111;
}


/* WHITE PLUS */

.add-clip-btn{
  height:50px;
  width:50px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  flex:0 0 50px;
  cursor:pointer;
  border-radius:7px;
  margin-left:5px;
}


/* PLAYHEAD */

.playhead{
  position:absolute;
  top:-8px;
  bottom:-8px;
  width:3px;
  background:#fff;
  left:0;
  z-index:30;
  pointer-events:none;
}

.playhead::before{
  content:"";
  position:absolute;
  top:-2px;
  left:50%;
  transform:translateX(-50%);
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff;
}


/* WHITE LINE */

.timeline-line{
  height:3px;
  background:#fff;
  margin:8px 10px 0;
  border-radius:3px;
  position:relative;
}

.timeline-line::before{
  content:"";
  position:absolute;
  left:0;
  top:-4px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#fff;
}


/* AUDIO / TEXT */

.timeline-extra{
  padding:8px 10px 0;
  display:flex;
  gap:8px;
}

.extra-row{
  height:40px;
  background:#252525;
  border-radius:7px;
  display:flex;
  align-items:center;
  padding:0 12px;
  color:#999;
  font-size:12px;
  gap:7px;
  flex:1;
}

.extra-row .plus{
  color:#fff;
  font-size:20px;
}


/* =========================
   BOTTOM TOOLBAR
========================= */

.editor-toolbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:82px;
  background:#1c1c1c;
  border-top:1px solid #222;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  overflow-x:auto;
  padding:5px 7px 8px;
  z-index:900;
  scrollbar-width:none;
}

.editor-toolbar::-webkit-scrollbar{
  display:none;
}

.editor-tool{
  min-width:76px;
  flex:0 0 76px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px;
  padding:0;
}

.editor-tool svg{
  width:27px;
  height:27px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* =========================
   INPUTS / MESSAGE
========================= */

input[type="file"]{
  display:none;
}

.message{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:2000;
}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

  <div class="home-grid">

    <button class="new-video" onclick="openVideoPicker()">
      <span style="font-size:28px;line-height:1;">＋</span>
      NEW VIDEO
    </button>

    <button class="card ai-card" onclick="showMessage('AI Generator')">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
        <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/>
      </svg>
      AI Generator
    </button>

    <button class="card photo-card" onclick="openPhotoPicker()">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9" r="1.5"/>
        <path d="M3 17l5-5 4 4 3-3 6 5"/>
      </svg>
      Edit Photo
    </button>

    <button class="card space-card" onclick="showMessage('Space')">
      <svg viewBox="0 0 24 24">
        <path d="M4 15c3.5-1 6.5-4 7.5-7.5"/>
        <path d="M7 18c4.5-.5 8.5-4.5 9-9"/>
        <path d="M12 21c4.5-1 8-4.5 9-9"/>
      </svg>
      Space
    </button>

  </div>

  <div class="projects">
    <div class="projects-title">Projects</div>
    <div class="project-box">No projects yet</div>
  </div>

</div>


<!-- HOME NAV -->

<div class="home-bottom-nav" id="homeBottomNav">

  <button class="nav-item active">
    <svg viewBox="0 0 24 24">
      <path d="M4 11l8-7 8 7"/>
      <path d="M6 10v10h12V10"/>
    </svg>
    Edit
  </button>

  <button class="nav-item">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 8h10"/>
      <path d="M7 12h6"/>
      <path d="M7 16h8"/>
    </svg>
    Templates
  </button>

  <button class="nav-item">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/>
    </svg>
    Me
  </button>

</div>


<!-- =========================
     EDITOR
========================= -->

<div id="editor">

  <!-- TOP BAR -->

  <div class="editor-top">

    <div class="top-left">

      <button class="top-btn" onclick="goHome()">
        ×
      </button>

      <button class="search-btn" onclick="showMessage('Search')">

        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <path d="M16.5 16.5L21 21"/>
        </svg>

      </button>

    </div>

    <button class="export-btn" onclick="exportVideo()">
      Export
    </button>

  </div>


  <!-- PREVIEW -->

  <div class="preview-area">

    <video
      id="video"
      playsinline
      preload="metadata">
    </video>

    <div
      class="video-placeholder"
      id="videoPlaceholder">
      Select a video
    </div>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <div class="control-left">

      <button
        class="control-btn"
        onclick="showMessage('Fullscreen')">

        <svg viewBox="0 0 24 24">
          <path d="M8 3H3v5"/>
          <path d="M3 3l6 6"/>
          <path d="M16 3h5v5"/>
          <path d="M21 3l-6 6"/>
          <path d="M8 21H3v-5"/>
          <path d="M3 21l6-6"/>
          <path d="M16 21h5v-5"/>
          <path d="M21 21l-6-6"/>
        </svg>

      </button>

    </div>


    <div class="control-right">

      <!-- NORMAL WHITE PLAY ICON -->

      <button
        class="control-btn play-btn"
        onclick="togglePlay()"
        id="playIcon">

        <svg
          id="playSvg"
          viewBox="0 0 24 24">

          <path d="M7 4l13 8-13 8z"/>

        </svg>

      </button>


      <button
        class="control-btn"
        onclick="undo()">

        <svg viewBox="0 0 24 24">
          <path d="M9 7L4 12l5 5"/>
          <path d="M4 12h10a6 6 0 0 1 6 6"/>
        </svg>

      </button>


      <button
        class="control-btn"
        onclick="redo()">

        <svg viewBox="0 0 24 24">
          <path d="M15 7l5 5-5 5"/>
          <path d="M20 12H10a6 6 0 0 0-6 6"/>
        </svg>

      </button>

    </div>

  </div>


  <!-- TIMELINE -->

  <div class="timeline-area">

    <div class="timeline-header">

      <span id="currentTime">
        00:00 / 00:00
      </span>

      <div
        class="timeline-header-ruler"
        id="ruler">

        00:00 • 00:01 • 00:02 • 00:03 • 00:04 • 00:05

      </div>

    </div>


    <div class="timeline-wrapper">


      <!-- MUTE / COVER -->

      <div class="track-actions">

        <button
          class="track-btn"
          onclick="toggleMute()"
          id="timelineMuteBtn">

          <svg viewBox="0 0 24 24">
            <path d="M4 10v4h4l5 4V6l-5 4H4z"/>
            <path d="M16 9l4 6m0-6l-4 6"/>
          </svg>

          Mute clip

        </button>


        <button
          class="track-btn active"
          onclick="showMessage('Cover')">

          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="8.5" cy="9" r="1.5"/>
            <path d="M3 17l5-5 4 4 3-3 6 5"/>
          </svg>

          Cover

        </button>

      </div>


      <!-- VIDEO TRACK -->

      <div
        class="timeline"
        id="timelineContainer">

        <div
          class="thumbnails"
          id="thumbnails">

          <div
            class="playhead"
            id="playhead">
          </div>

        </div>

      </div>

    </div>


    <!-- WHITE TIMELINE LINE -->

    <div class="timeline-line"></div>


    <!-- AUDIO / TEXT -->

    <div class="timeline-extra">

      <div
        class="extra-row"
        onclick="showMessage('Add Audio')">

        <span class="plus">＋</span>
        Add audio

      </div>


      <div
        class="extra-row"
        onclick="showMessage('Add Text')">

        <span class="plus">＋</span>
        Add text

      </div>

    </div>

  </div>


  <!-- BOTTOM TOOLS -->

  <div class="editor-toolbar">


    <!-- EDIT -->

    <button
      class="editor-tool"
      onclick="showMessage('Edit')">

      <svg viewBox="0 0 24 24">
        <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/>
        <path d="M13 6l3 3"/>
      </svg>

      Edit

    </button>


    <!-- AUDIO -->

    <button
      class="editor-tool"
      onclick="showMessage('Audio')">

      <svg viewBox="0 0 24 24">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>

      Audio

    </button>


    <!-- TEXT -->

    <button
      class="editor-tool"
      onclick="showMessage('Text')">

      <svg viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M8 6v12"/>
        <path d="M6 18h4"/>
      </svg>

      Text

    </button>


    <!-- EFFECTS -->

    <button
      class="editor-tool"
      onclick="showMessage('Effects')">

      <svg viewBox="0 0 24 24">
        <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"/>
      </svg>

      Effects

    </button>


    <!-- OVERLAY -->

    <button
      class="editor-tool"
      onclick="showMessage('Overlay')">

      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18"/>
        <path d="M9 3v18"/>
      </svg>

      Overlay

    </button>


    <!-- CAPTIONS -->

    <button
      class="editor-tool"
      onclick="showMessage('Captions')">

      <svg viewBox="0 0 24 24">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M6 9h4M6 13h10"/>
      </svg>

      Captions

    </button>


    <!-- FILTERS -->

    <button
      class="editor-tool"
      onclick="showMessage('Filters')">

      <svg viewBox="0 0 24 24">
        <path d="M4 6h16"/>
        <path d="M7 12h10"/>
        <path d="M10 18h4"/>
        <circle cx="8" cy="6" r="2"/>
        <circle cx="15" cy="12" r="2"/>
        <circle cx="12" cy="18" r="2"/>
      </svg>

      Filters

    </button>


    <!-- ASPECT RATIO
         INTENTIONALLY OFF SCREEN
         AND AVAILABLE BY SWIPING -->

    <button
      class="editor-tool"
      onclick="showMessage('Aspect Ratio')">

      <svg viewBox="0 0 24 24">
        <rect x="4" y="6" width="16" height="12" rx="2"/>
        <path d="M8 9h3M8 9v3"/>
        <path d="M16 15h-3M16 15v-3"/>
      </svg>

      Aspect Ratio

    </button>


  </div>

</div>


<!-- INPUTS -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  onchange="loadVideo(event)">

<input
  type="file"
  id="photoInput"
  accept="image/*"
  onchange="loadPhoto(event)">


<div
  class="message"
  id="message">
</div>


<script>

const video=document.getElementById("video");

let videoURL=null;
let isPickingFile=false;


/* =========================
   FILE PICKER
========================= */

function openVideoPicker(){

  isPickingFile=true;

  document.getElementById("homeBottomNav").style.display="none";

  document.getElementById("videoInput").click();

}


function openPhotoPicker(){

  isPickingFile=true;

  document.getElementById("homeBottomNav").style.display="none";

  document.getElementById("photoInput").click();

}


window.addEventListener("focus",function(){

  if(isPickingFile){

    setTimeout(function(){

      if(
        document.getElementById("editor").style.display!=="block"
      ){

        document.getElementById("homeBottomNav").style.display="flex";

      }

      isPickingFile=false;

    },300);

  }

});


/* =========================
   LOAD VIDEO
========================= */

function loadVideo(event){

  isPickingFile=false;

  const file=event.target.files[0];

  if(!file){

    document.getElementById("homeBottomNav").style.display="flex";

    return;

  }


  if(videoURL){

    URL.revokeObjectURL(videoURL);

  }


  videoURL=URL.createObjectURL(file);

  video.src=videoURL;


  document.getElementById("home").style.display="none";

  document.getElementById("homeBottomNav").style.display="none";

  document.getElementById("editor").style.display="block";

  document.getElementById("videoPlaceholder").style.display="none";


  video.onloadedmetadata=function(){

    document.getElementById("currentTime").textContent=
      "00:00 / "+formatTime(video.duration);

    generateRuler(video.duration);

    generateThumbnails();

  };

}


/* =========================
   RULER
========================= */

function generateRuler(duration){

  const ruler=document.getElementById("ruler");

  ruler.innerHTML="";

  const total=Math.ceil(duration);


  for(let i=0;i<=total;i++){

    const span=document.createElement("span");

    span.textContent=formatTime(i);

    ruler.appendChild(span);


    if(i<total){

      const dot=document.createElement("span");

      dot.textContent=" • ";

      dot.style.opacity="0.4";

      ruler.appendChild(dot);

    }

  }

}


/* =========================
   THUMBNAILS
========================= */

async function generateThumbnails(){

  const container=
    document.getElementById("thumbnails");

  const existingPlayhead=
    document.getElementById("playhead");


  container.innerHTML="";

  container.appendChild(existingPlayhead);


  const duration=video.duration;


  if(!duration || isNaN(duration)){

    return;

  }


  const count=12;


  const tempVideo=document.createElement("video");

  tempVideo.src=videoURL;

  tempVideo.muted=true;

  tempVideo.playsInline=true;

  tempVideo.preload="auto";


  await new Promise((resolve)=>{

    tempVideo.onloadedmetadata=resolve;
