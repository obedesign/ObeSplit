<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ObeSplit</title>
<script src="https://cdn.tailwindcss.com"></script>
<style> *{font-family:system-ui} </style>
</head>
<body class="bg-black">

<!-- ========== 1. HOME ========== -->
<div id="home" class="max-w-[400px] mx-auto min-h-screen bg-[#0A0A0A] p-6">
  <h1 class="text-white text-[24px] font-black mb-6">ObeSplit</h1>
  <div onclick="fileIn.click()" class="bg-[#7C3AED] rounded-[24px] py-14 text-center">
    <div class="text-[60px]">📹</div>
    <div class="text-white font-bold mt-2">+ New Video</div>
  </div>
</div>

<!-- ========== 2. EDITOR ========== -->
<div id="editor" class="hidden h-screen flex-col bg-[#111]">

  <!-- Top Bar -->
  <div class="h-[50px] flex justify-between items-center px-4">
    <button onclick="goHome()" class="text-white text-xl">✕</button>
    <button class="bg-cyan-300 text-black px-5 py-2 rounded-full font-bold text-sm">Export</button>
  </div>

  <!-- Preview -->
  <div class="flex-1 bg-black flex items-center justify-center relative">
    <video id="vid" class="w-full h-full object-contain" playsinline></video>
    <div id="ph" class="absolute text-white/70 text-center">
      <p class="font-bold text-xl tracking-widest">PHOTO/VIDEO</p>
      <p>Obeedit</p>
    </div>
  </div>

  <!-- ========== 3. TIMELINE - EDIT ONLY THIS LATER ========== -->
  <div class="bg-[#181818] border-t border-zinc-800">
    <div class="h-[30px] flex justify-between items-center px-3 text-[11px] text-zinc-400">
      <span id="time">00:00 / 00:20</span>
      <span>00:00 00:01 00:02 00:03</span>
    </div>
    <div class="h-[130px] flex p-2 gap-2">
      <div class="w-[65px] bg-[#222] rounded-xl flex flex-col items-center justify-center">
        <span>🔊</span><span class="text-[8px] text-zinc-400">Mute clip</span>
      </div>
      <div class="flex-1 space-y-2">
        <div class="h-[40px] bg-[#2a2a2a] rounded-xl flex items-center px-3 text-zinc-400 text-xs">clip <span class="ml-auto bg-white text-black w-6 h-6 rounded flex items-center justify-center">+</span></div>
        <div class="h-[30px] bg-[#222] rounded-xl px-3 flex items-center text-xs text-zinc-300">+ Add audio</div>
        <div class="h-[30px] bg-[#222] rounded-xl px-3 flex items-center text-xs text-zinc-300">+ Add text</div>
      </div>
    </div>
  </div>

  <!-- ========== 4. BOTTOM TOOLS ========== -->
  <div class="h-[70px] bg-[#121212] flex justify-around items-center border-t border-zinc-800">
    <span class="text-white text-center text-[11px]">✂️<br>Edit</span>
    <span class="text-white text-center text-[11px]">🎵<br>Audio</span>
    <span class="text-white text-center text-[11px]">T<br>Text</span>
    <span class="text-zinc-500 text-center text-[11px]">✨<br>Effects</span>
    <span class="text-zinc-500 text-center text-[11px]">🖼️<br>Overlay</span>
    <span class="text-zinc-500 text-center text-[11px]">💬<br>Captions</span>
    <span class="text-zinc-500 text-center text-[11px]">🎨<br>Filters</span>
  </div>

</div>

<input type="file" id="fileIn" hidden accept="video/*,image/*">

<script>
const fileIn=document.getElementById('fileIn'), vid=document.getElementById('vid'), home=document.getElementById('home'), editor=document.getElementById('editor'), ph=document.getElementById('ph'), time=document.getElementById('time');
fileIn.onchange=e=>{
  vid.src=URL.createObjectURL(e.target.files[0]);
  home.classList.add('hidden'); editor.classList.remove('hidden'); editor.classList.add('flex');
  ph.style.display='none'; vid.play();
};
function goHome(){ editor.classList.add('hidden'); home.classList.remove('hidden'); vid.pause(); vid.src=''; ph.style.display='block'; }
vid.ontimeupdate=()=>{ time.textContent=`00:0${Math.floor(vid.currentTime)} / 00:20`; };
</script>

</body>
</html>
