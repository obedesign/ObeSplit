<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit - Working</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button{border:0;font-family:inherit;cursor:pointer}
#home{min-height:100vh;background:#000;padding:18px;padding-bottom:95px}
.home-grid{display:grid;grid-template-columns:1fr 1.35fr;grid-template-rows:155px 155px;gap:12px;max-width:520px;margin:0 auto}
.new-video{grid-column:1 / 3;height:72px;background:#18e58b;color:#000;border-radius:18px;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.card{border-radius:18px;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.photo-card{grid-column:2;grid-row:1 / 3;background:#18e58b;color:#000}
.projects{max-width:520px;margin:24px auto 0}
.project-box{height:95px;background:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#777}
.home-bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#080808;border-top:1px solid #202020;display:flex;justify-content:space-around;align-items:center;z-index:1000}
.nav-item{background:none;color:#777;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px}.nav-item.active{color:#fff}

#editor{display:none;min-height:100vh;background:#121212;padding-bottom:74px;flex-direction:column}
.editor-top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#121212;flex-shrink:0}
.top-btn{background:none;color:#fff;font-size:26px}
.export-btn{background:#18e58b;color:#000;border-radius:8px;padding:8px 14px;font-weight:700}
.preview-area{height:52vh;min-height:320px;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#video{width:100%;height:100%;object-fit:contain;display:block}
#canvasPreview{display:none}
#textLayer{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.text-item{position:absolute;pointer-events:auto;cursor:move;font-weight:700;text-shadow:2px 2px 4px #000;user-select:none;padding:4px 8px;border:1px dashed transparent}
.text-item.selected{border-color:#18e58b}
.controls{height:48px;display:flex;align-items:center;justify-content:center;gap:32px;padding:0 16px;background:#121212;flex-shrink:0}
.control-btn{background:none;color:#fff;font-size:20px;opacity:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.timeline-area{background:#1c1c1c;padding:8px 0 6px;border-top:1px solid #222;flex-shrink:0}
.timeline-header{display:flex;justify-content:space-between;align-items:center;color:#aaa;font-size:11px;padding:0 10px 7px}
#currentTime{color:#fff;font-weight:700;min-width:80px;margin-right:15px}
.timeline-header-ruler{display:flex;gap:10px;margin-left:10px;color:#999;overflow:hidden;flex:1;font-size:10px}
.timeline-wrapper{display:flex;gap:6px;align-items:center;padding:0 8px}
.track-actions{display:flex;gap:5px;flex-shrink:0}
.track-btn{background:#3a3a3a;color:#fff;border-radius:8px;width:56px;height:72px;font-size:8px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.track-btn.active{background:#18e58b;color:#000}
.timeline{height:72px;background:#000;border-radius:7px;overflow-x:auto;flex:1;position:relative}
.thumbnails{height:100%;display:flex;width:max-content;align-items:center;position:relative}
.thumbnail{height:72px;width:78px;object-fit:cover;border-right:1px solid #111}
.add-clip-btn{height:72px;width:48px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:6px;margin-left:3px}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:0;z-index:30}
.timeline-line{height:2px;background:#fff;margin:7px 8px 0;border-radius:2px}
.timeline-extra{padding:6px 8px 0;display:flex;gap:6px}
.extra-row{height:30px;background:#262626;border-radius:6px;display:flex;align-items:center;padding:0 10px;color:#bbb;font-size:11px;gap:5px;flex:1}
.editor-toolbar{position:fixed;left:0;right:0;bottom:0;height:74px;background:#1c1c1c;border-top:1px solid #222;display:flex;overflow-x:auto;padding:6px 2px;z-index:900}
.editor-tool{min-width:62px;flex:0 0 62px;background:none;color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px}
.editor-tool.active{color:#18e58b}

/* TOOL PANEL */
.tool-panel{position:fixed;left:0;right:0;bottom:74px;background:#222;border-top:1px solid #333;padding:14px;display:none;z-index:950;max-height:45vh;overflow-y:auto}
.tool-panel.show{display:block}
.panel-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.panel-btn{background:#333;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;flex:1;min-width:80px}
.panel-btn.primary{background:#18e58b;color:#000;font-weight:700}
.slider{width:100%;margin:8px 0}
.message{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;display:none;z-index:2000}
input[type=file]{display:none}
</style>
</head>
<body>

<div id="home">
  <div class="home-grid">
    <button class="new-video" onclick="openVideoPicker()">＋ NEW VIDEO</button>
    <button class="card" onclick="showMessage('AI soon')">AI Generator</button>
    <button class="card photo-card" onclick="openPhotoPicker()">Edit Photo</button>
    <button class="card" onclick="showMessage('Space soon')">Space</button>
  </div>
  <div class="projects"><div style="font-weight:700;margin:24px 0 14px">Projects</div><div class="project-box">No projects yet</div></div>
</div>
<div class="home-bottom-nav" id="homeBottomNav"><button class="nav-item active">Edit</button><button class="nav-item">Templates</button><button class="nav-item">Me</button></div>

<div id="editor">
  <div class="editor-top"><button class="top-btn" onclick="goHome()">✕</button><button class="export-btn" onclick="exportVideo()">Export</button></div>
  <div class="preview-area" id="previewArea">
    <video id="video" playsinline preload="metadata"></video>
    <canvas id="canvasPreview"></canvas>
    <div id="textLayer"></div>
  </div>
  <div class="controls"><button class="control-btn" onclick="togglePlay()" id="playIcon">▶</button><button class="control-btn" onclick="undo()">↩</button><button class="control-btn" onclick="redo()">↪</button><button class="control-btn" onclick="setFilter('none')">⟲</button></div>
  <div class="timeline-area">
    <div class="timeline-header"><span id="currentTime">00:00 / 00:00</span><div class="timeline-header-ruler" id="ruler"></div></div>
    <div class="timeline-wrapper">
      <div class="track-actions">
        <button class="track-btn" id="muteBtn" onclick="toggleMute()">🔊 Mute</button>
        <button class="track-btn" onclick="captureCover()">🖼 Cover</button>
      </div>
      <div class="timeline" id="timelineContainer"><div class="thumbnails" id="thumbnails"><div class="playhead" id="playhead"></div></div></div>
    </div>
    <div class="timeline-line"></div>
    <div class="timeline-extra"><div class="extra-row" onclick="addAudio()">＋ Add audio</div><div class="extra-row" onclick="addText()">＋ Add text</div></div>
  </div>
  <div class="editor-toolbar">
    <button class="editor-tool" id="toolEdit" onclick="openPanel('edit')">✂ Edit</button>
    <button class="editor-tool" id="toolAudio" onclick="openPanel('audio')">♫ Audio</button>
    <button class="editor-tool" id="toolText" onclick="openPanel('text')">T Text</button>
    <button class="editor-tool" onclick="openPanel('filters')">◍ Filters</button>
    <button class="editor-tool" onclick="openPanel('overlay')">▭ Overlay</button>
    <button class="editor-tool" onclick="openPanel('captions')">☰ Captions</button>
    <button class="editor-tool" onclick="openPanel('ratio')">⤢ Ratio</button>
  </div>

  <!-- PANELS -->
  <div class="tool-panel" id="panel-edit"><b>Edit</b><div class="panel-row"><button class="panel-btn" onclick="splitClip()">Split at Playhead</button><button class="panel-btn" onclick="deleteText()">Delete Text</button><button class="panel-btn primary" onclick="trimStart()">Set Start</button><button class="panel-btn primary" onclick="trimEnd()">Set End</button></div><label>Speed <span id="speedVal">1x</span></label><input type="range" class="slider" min="0.25" max="3" step="0.25" value="1" oninput="changeSpeed(this.value)"></div>
  <div class="tool-panel" id="panel-audio"><b>Audio</b><label>Volume <span id="volVal">100%</span></label><input type="range" class="slider" min="0" max="100" value="100" oninput="changeVolume(this.value)"><div class="panel-row"><button class="panel-btn" onclick="addAudio()">Add Music</button><button class="panel-btn" onclick="toggleMute()">Mute/Unmute</button></div><audio id="bgAudio" controls style="width:100%;margin-top:10px;display:none"></audio></div>
  <div class="tool-panel" id="panel-text"><b>Text</b><div class="panel-row"><button class="panel-btn primary" onclick="addText()">＋ Add Text</button><button class="panel-btn" onclick="changeTextColor('#fff')">White</button><button class="panel-btn" onclick="changeTextColor('#18e58b')">Green</button><button class="panel-btn" onclick="changeTextColor('#ff3b30')">Red</button></div><div class="panel-row"><button class="panel-btn" onclick="changeTextSize(1)">A+</button><button class="panel-btn" onclick="changeTextSize(-1)">A-</button><button class="panel-btn" onclick="deleteText()">Delete</button></div></div>
  <div class="tool-panel" id="panel-filters"><b>Filters</b><div class="panel-row"><button class="panel-btn" onclick="setFilter('none')">Normal</button><button class="panel-btn" onclick="setFilter('grayscale(100%)')">B&W</button><button class="panel-btn" onclick="setFilter('sepia(100%)')">Sepia</button><button class="panel-btn" onclick="setFilter('brightness(1.3) contrast(1.2)')">Bright</button><button class="panel-btn" onclick="setFilter('contrast(1.5)')">Contrast</button><button class="panel-btn" onclick="setFilter('blur(2px)')">Blur</button></div></div>
  <div class="tool-panel" id="panel-overlay"><b>Overlay</b><div class="panel-row"><button class="panel-btn primary" onclick="document.getElementById('overlayInput').click()">Add Image Overlay</button><button class="panel-btn" onclick="clearOverlay()">Clear Overlay</button></div><img id="overlayPreview" style="width:100%;margin-top:10px;display:none;border-radius:8px;max-height:120px;object-fit:contain"></div>
  <div class="tool-panel" id="panel-captions"><b>Captions</b><div class="panel-row"><button class="panel-btn primary" onclick="addCaption()">＋ Add Caption at Time</button><button class="panel-btn" onclick="clearCaptions()">Clear</button></div><div id="captionList" style="margin-top:10px;font-size:11px;color:#aaa"></div></div>
  <div class="tool-panel" id="panel-ratio"><b>Aspect Ratio</b><div class="panel-row"><button class="panel-btn" onclick="setRatio('contain','16:9')">16:9</button><button class="panel-btn" onclick="setRatio('contain','9:16')">9:16</button><button class="panel-btn" onclick="setRatio('contain','1:1')">1:1</button><button class="panel-btn" onclick="setRatio('cover','9:16')">Fill 9:16</button></div></div>
</div>

<input type="file" id="videoInput" accept="video/*" onchange="loadVideo(event)">
<input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)">
<input type="file" id="audioInput" accept="audio/*" onchange="loadBgAudio(event)">
<input type="file" id="overlayInput" accept="image/*" onchange="loadOverlay(event)">
<div class="message" id="message"></div>

<script>
const video=document.getElementById("video");
const textLayer=document.getElementById("textLayer");
let videoURL=null, isPicking=false, selectedText=null;
let trimStartTime=0, trimEndTime=null;
let bgAudioUrl=null;

function openVideoPicker(){isPicking=true;document.getElementById("videoInput").click();}
function openPhotoPicker(){isPicking=true;document.getElementById("photoInput").click();}
window.addEventListener("focus",()=>{if(isPicking){setTimeout(()=>{if(document.getElementById("editor").style.display!=="flex"){document.getElementById("homeBottomNav").style.display="flex"}isPicking=false},400)}});
function loadVideo(e){isPicking=false;const f=e.target.files[0];if(!f){document.getElementById("homeBottomNav").style.display="flex";return;}if(videoURL)URL.revokeObjectURL(video
