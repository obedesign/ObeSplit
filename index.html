<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

/* ================= HOME ================= */

#home{
  min-height:100vh;
  background:#000;
  padding:18px;
  padding-bottom:95px;
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  grid-template-rows:155px 155px;
  gap:12px;
  max-width:520px;
  margin:0 auto;
}

.new-video{
  grid-column:1 / 3;
  height:72px;
  background:#18e58b;
  color:#000;
  border-radius:18px;
  font-size:21px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:2px;
}

.card{
  border-radius:18px;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:600;
}

.card svg{
  width:38px;
  height:38px;
  margin-bottom:10px;
}

.ai-card{
  grid-column:1;
  grid-row:1;
  margin-top:84px;
}

.photo-card{
  grid-column:2;
  grid-row:1 / 3;
  background:#18e58b;
  color:#000;
}

.space-card{
  grid-column:1;
  grid-row:2;
  margin-top:0;
}

.projects{
  max-width:520px;
  margin:24px auto 0;
}

.projects-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
}

.project-box{
  height:95px;
  background:#111;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:14px;
}

.home-bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#080808;
  border-top:1px solid #202020;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px;
}

.nav-item.active{
  color:#fff;
}

.nav-item svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* ================= EDITOR ================= */

#editor{
  display:none;
  min-height:100vh;
  background:#000;
}

.editor-top{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #171717;
}

.top-btn{
  background:none;
  color:#fff;
  font-size:25px;
  padding:5px;
}

.editor-title{
  font-size:15px;
  font-weight:700;
}

.export-btn{
  background:#18e58b;
  color:#000;
  border-radius:8px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700;
}

.preview-area{
  height:42vh;
  min-height:260px;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#video{
  max-width:100%;
  max-height:100%;
  display:block;
}

.video-placeholder{
  color:#555;
  font-size:14px;
}

.controls{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  border-top:1px solid #151515;
  border-bottom:1px solid #151515;
}

.control-btn{
  background:none;
  color:#fff;
  font-size:21px;
}


/* ================= TIMELINE ================= */

.timeline-area{
  background:#080808;
  padding:10px 10px 8px;
}

.timeline-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aaa;
  font-size:11px;
  margin-bottom:8px;
}


/* MAIN TIMELINE */

.timeline-wrapper{
  position:relative;
  width:100%;
  min-height:115px;
}


/* LEFT MUTE / COVER */

.timeline-side{
  position:absolute;
  left:0;
  top:0;
  width:142px;
  height:84px;
  display:flex;
  gap:7px;
  z-index:10;
  background:#080808;
}

.timeline-action{
  width:67px;
  height:78px;
  background:#151515;
  border-radius:7px;
  color:#ddd;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:10px;
  padding:0;
}

.timeline-action svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* VIDEO TRACK */

.timeline-track{
  position:relative;
  margin-left:0;
  width:100%;
  height:84px;
  overflow:hidden;
  background:#111;
  border-radius:7px;
}


/*
  Keep space on the left for Mute + Cover,
  while thumbnails continue behind the track.
*/

.timeline-scroll{
  position:absolute;
  left:142px;
  right:0;
  top:0;
  height:84px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
}

.timeline-scroll::-webkit-scrollbar{
  display:none;
}

.thumbnails{
  height:84px;
  display:flex;
  width:max-content;
}

.thumbnail{
  width:72px;
  height:84px;
  flex:0 0 72px;
  object-fit:cover;
  border-right:1px solid #222;
}


/* WHITE PLUS BUTTON */

.add-media{
  position:absolute;
  right:8px;
  top:21px;
  width:42px;
  height:42px;
  border-radius:7px;
  background:#fff;
  color:#000;
  font-size:29px;
  font-weight:300;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:25;
  line-height:1;
}

.add-media:active{
  transform:scale(.94);
}


/* SECOND TRACK PLUS */

.add-track{
  position:absolute;
  left:0;
  bottom:0;
  width:38px;
  height:28px;
  background:#fff;
  color:#000;
  border-radius:5px;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30;
}


/* VERY LONG WHITE PLAYHEAD */

.playhead{
  position:absolute;
  top:-24px;
  bottom:-24px;
  left:158px;
  width:3px;
  background:#fff;
  border-radius:4px;
  z-index:40;
  pointer-events:none;
}


/* SMALL GREEN POSITION MARKER */

.playhead::before{
  content:"";
  position:absolute;
  top:0;
  left:-3px;
  width:9px;
  height:9px;
  background:#18e58b;
  border-radius:50%;
}


/* ================= BOTTOM TOOLBAR ================= */

.editor-toolbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:#080808;
  border-top:1px solid #1b1b1b;
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  width:100%;
  min-width:0;
  gap:22px;
  padding:8px 16px;
  z-index:900;
  scrollbar-width:none;
  white-space:nowrap;
}

.editor-toolbar::-webkit-scrollbar{
  display:none;
}

.editor-tool{
  flex:0 0 auto;
  min-width:48px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:10px;
}

.editor-tool svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* FILE INPUTS */

input[type="file"]{
  display:none;
}


/* MESSAGE */

.message{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:2000;
}

</style>
</head>

<body>

<div id="editor">

<script>

const video =
  document.getElementById("video");

let videoURL = null;

let isPickingFile = false;


/* OPEN VIDEO PICKER */

function openVideoPicker(){

  isPickingFile = true;

  document
    .getElementById("homeBottomNav")
    .style.display = "none";

  document
    .getElementById("videoInput")
    .click();

}


/* OPEN PHOTO PICKER */

function openPhotoPicker(){

  isPickingFile = true;

  document
    .getElementById("homeBottomNav")
    .style.display = "none";

  document
    .getElementById("photoInput")
    .click();

}


/* FILE PICKER FOCUS */

window.addEventListener(
  "focus",
  function(){

    if(isPickingFile){

      setTimeout(
        function(){

          const editorDisplay =
            document
              .getElementById("editor")
              .style.display;

          if(editorDisplay !== "block"){

            document
              .getElementById("homeBottomNav")
              .style.display = "flex";

          }

          isPickingFile = false;

        },
        300
      );

    }

  }
);


/* LOAD VIDEO */

function loadVideo(event){

  isPickingFile = false;

  const file =
    event.target.files[0];


  if(!file){

    document
      .getElementById("homeBottomNav")
      .style.display = "flex";

    return;

  }


  if(videoURL){

    URL.revokeObjectURL(videoURL);

  }


  videoURL =
    URL.createObjectURL(file);

  video.src =
    videoURL;


  document
    .getElementById("home")
    .style.display =
    "none";


  document
    .getElementById("homeBottomNav")
    .style.display =
    "none";


  document
    .getElementById("editor")
    .style.display =
    "block";


  document
    .getElementById("videoPlaceholder")
    .style.display =
    "none";


  video.onloadedmetadata =
    function(){

      document
        .getElementById("duration")
        .textContent =
        formatTime(video.duration);

      generateThumbnails();

    };

}


/* GENERATE THUMBNAILS */

async function generateThumbnails(){

  const container =
    document.getElementById("thumbnails");

  container.innerHTML = "";


  const duration =
    video.duration;


  if(!duration || isNaN(duration))
    return;


  const count = 12;


  const tempVideo =
    document.createElement("video");


  tempVideo.src =
    videoURL;

  tempVideo.muted =
    true;

  tempVideo.playsInline =
    true;

  tempVideo.preload =
    "auto";


  await new Promise(
    (resolve)=>{

      tempVideo.onloadedmetadata =
        resolve;

    }
  );


  const canvas =
    document.createElement("canvas");


  canvas.width =
    120;

  canvas.height =
    84;


  const ctx =
    canvas.getContext("2d");


  for(
    let i=0;
    i<count;
    i++
  ){

    const time =
      (duration / count) * i;


    tempVideo.currentTime =
      time;


    await new Promise(
      (resolve)=>{

        tempVideo.onseeked =
          ()=>{

            setTimeout(
              resolve,
              50
            );

          };

      }
    );


    ctx.drawImage(
      tempVideo,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const img =
      document.createElement("img");


    img.className =
      "thumbnail";


    img.src =
      canvas.toDataURL();


    container.appendChild(img);

  }

}


/* PLAY / PAUSE */

function togglePlay(){

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

}


/* MUTE */

function toggleMute(){

  video.muted =
    !video.muted;


  const te
