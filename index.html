<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1"><title>ObeSplit PRO</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0F0F0F;color:#fff;font-family:system-ui;overflow:hidden;height:100dvh;display:flex;flex-direction:column}#top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #222}#stage{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}#phone{width:208px;height:370px;background:#111;position:relative;border-radius:12px;overflow:hidden;border:1px solid #333}video{width:100%;height:100%;object-fit:contain;background:#000}#overlay{position:absolute;left:20px;top:20px;width:90px;height:120px;border:1.5px dashed #fff;display:none;z-index:10;background:#000;touch-action:none;border-radius:6px;overflow:hidden}#overlay video{width:100%;height:100%;object-fit:cover}#playbar{height:56px;background:#1A1A1A;display:flex;align-items:center;gap:8px;padding:0 10px;border-top:1px solid #222;overflow-x:auto}#playbar button{background:#2A2A2A;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:20px;font-size:12px;white-space:nowrap}#timeline{height:86px;background:#1A1A1A;border-top:1px solid #222;position:relative;overflow:hidden}#strip{display:flex;gap:2px;padding:8px;height:70px;transition:transform 0.1s linear}#strip canvas,#strip div{width:52px;height:52px;background:#222;border-radius:4px;flex-shrink:0}#chip{display:inline-block;background:#A855F7;color:#fff;padding:4px 8px;border-radius:12px;font-size:10px;margin:2px}#watermark{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px;font-size:10px;z-index:5}</style></head><body><div id=top><span style=font-weight:700>ObeSplit</span><button onclick=exp() style=background:#A855F7;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:700>Export</button></div><div id=stage><div id=phone><video id=v playsinline controls></video><div id=overlay><video id=o autoplay muted loop playsinline></video></div><div class=watermark>Obeedit</div></div></div><div id=playbar><button onclick=pick()>📁 Video</button><button onclick=playPause()>▶️ Play</button><button onclick=toggleMute()>🔊 Mute</button><button onclick=split()>✂️ Split</button><button onclick=pickO()>🖼️ Overlay</button><button onclick="document.getElementById('overlay').style.display='none'">❌ Remove Overlay</button><div id=clips></div></div><div id=timeline><div id=strip></div><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;z-index:2"></div></div><script>const v=document.getElementById('v'),o=document.getElementById('o'),ov=document.getElementById('overlay'),strip=document.getElementById('strip'),clipsDiv=document.getElementById('clips');let clipCount=1,isMuted=false;function pick(){let i=document.createElement('input');i.type='file';i.accept='video/*';i.onchange=()=>{v.src=URL.createObjectURL(i.files[0]);v.muted=false;v.volume=1;genThumbs();};i.click()}function pickO(){let i=document.createElement('input');i.type='file';i.accept='video/*,image/*';i.onchange=()=>{let f=i.files[0];o.src=URL.createObjectURL(f);ov.style.display='block';};i.click()}function playPause(){if(v.paused){v.play();v.muted=false;}else v.pause();}function toggleMute(){isMuted=!isMuted;v.muted=isMuted;event.target.textContent=isMuted?'🔇 Unmute':'🔊 Mute';}function split(){clipCount++;clipsDiv.innerHTML+=`<span id=chip>CLIP ${clipCount}</span>`;let c=document.createElement('div');c.style.background='#A855F7';c.style.display='flex';c.style.alignItems='center';c.style.justifyContent='center';c.style.fontSize='10px';c.textContent='C'+clipCount;strip.appendChild(c);}function genThumbs(){strip.innerHTML='';for(let k=0;k<6;k++){let cv=document.createElement('canvas');cv.width=52;cv.height=52;let ctx=cv.getContext('2d');ctx.fillStyle='#222';ctx.fillRect(0,0,52,52);ctx.fillStyle='#555';ctx.fillText('🎞️',18,28);strip.appendChild(cv);}}v.addEventListener('timeupdate',()=>{if(v.duration){let pct=v.currentTime/v.duration;strip.style.transform=`translateX(-${pct*120}px)`;}});function exp(){if(!v.src){alert('Pick video first');return;}let a=document.createElement('a');a.href=v.src;a.download='ObeSplit-export.mp4';a.click();}let dragging=false,sx,sy,ox,oy;ov.addEventListener('touchstart',e=>{dragging=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;ox=ov.offsetLeft;oy=ov.offsetTop;});ov.addEventListener('touchmove',e=>{if(!dragging)return;e.preventDefault();ov.style.left=ox+(e.touches[0].clientX-sx)+'px';ov.style.top=oy+(e.touches[0].clientY-sy)+'px';},{passive:false});ov.addEventListener('touchend',()=>dragging=false);ov.addEventListener('mousedown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;ox=ov.offsetLeft;oy=ov.offsetTop;});window.addEventListener('mousemove',e=>{if(!dragging)return;ov.style.left=ox+(e.clientX-sx)+'px';ov.style.top=oy+(e.clientY-sy)+'px';});window.addEventListener('mouseup',()=>dragging=false);v.addEventListener('click',()=>{v.muted=false;v.volume=1;});</script></body></html>
