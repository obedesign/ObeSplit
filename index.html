      <button data-tool="audio" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><span>Audio</span></button>
      <button data-tool="text" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg></div><span>Text</span></button>
      <button data-tool="effects" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.2H22l-6.2 4.5 2.4 7.2L12 16.4 5.8 20.9l2.4-7.2L2 9.2h7.6z"/></svg></div><span>Effects</span></button>
      <button data-tool="overlay" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/></svg></div><span>Overlay</span></button>
      <button data-tool="captions" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M7 10h3M7 14h3M14 10h3M14 14h3"/></svg></div><span>Captions</span></button>
      <button data-tool="filters" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div><span>Filters</span></button>
      <button data-tool="sticker" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div><span>Sticker</span></button>
      <button data-tool="aspect" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></div><span>Aspect Ratio</span></button>
      <button data-tool="background" class="tool-btn min-w-[74px] flex flex-col items-center gap-1 py-1.5 text-[11px] text-[#999] shrink-0"><div class="w-7 h-7 flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9l6-3 6 3-6 3-6-3z"/><path d="M3 9v6l6 3 6-3V9"/></svg></div><span>Background</span></button>
    </div>
    <div id="toolPanel" class="hidden bg-[#1c1c1c] border-t border-[#2a2a2a] p-4 max-h-[45vh] overflow-auto no-scrollbar"><div class="flex justify-between mb-3"><span id="toolTitle" class="text-[13px] font-bold">Tool</span><button onclick="document.getElementById('toolPanel').classList.add('hidden')" class="text-[#777]">✕</button></div><div id="toolContent"></div></div>
  </div>

  <input type="file" id="mediaInput" accept="video/*,image/*" multiple class="hidden">
  <input type="file" id="audioInput" accept="audio/*" class="hidden">
  <audio id="bgAudio" class="hidden"></audio>
</div>

<script>
const video=document.getElementById('video'), photoPreview=document.getElementById('photoPreview'), mediaInput=document.getElementById('mediaInput'), clipsContainer=document.getElementById('clipsContainer'), addMediaBtn=document.getElementById('addMediaBtn'), timeLabel=document.getElementById('timeLabel'), ruler=document.getElementById('ruler'), playhead=document.getElementById('playhead'), timelineScroll=document.getElementById('timelineScroll'), playBtn=document.getElementById('playBtn'), playIcon=document.getElementById('playIcon'), pauseIcon=document.getElementById('pauseIcon'), exportBtn=document.getElementById('exportBtn'), exportPanel=document.getElementById('exportPanel'), aiUhdBtn=document.getElementById('aiUhdBtn');
let clips=[], totalDuration=0, globalTime=0, isPlaying=false, raf=null, currentRes='1080p', currentFps=30, currentBitrate=20, isAiUhd=true, isGif=false, watermark=false, selectedClipId=null;
const PX_PER_SEC=60;
function fmt(s){ if(!isFinite(s)) s=0; const m=Math.floor(s/60).toString().padStart(2,'0'); const sec=Math.floor(s%60).toString().padStart(2,'0'); return `${m}:${sec}` }
function updateRuler(){ ruler.innerHTML=''; const step=totalDuration>60?10:2; for(let t=0; t<=Math.ceil(totalDuration); t+=step){ const el=document.createElement('span'); el.textContent=fmt(t); ruler.appendChild(el);} }
function updateTimeLabel(){ timeLabel.textContent=`${fmt(globalTime)} / ${fmt(totalDuration)}` }
function calcTotal(){ totalDuration=clips.reduce((a,c)=>a+c.duration,0); updateRuler(); updateTimeLabel(); updateEstSize(); }
function getClipAtTime(time){ let acc=0; for(let i=0;i<clips.length;i++){ const c=clips[i]; if(time>=acc && time<acc+c.duration) return {clip:c,index:i,local:time-acc,start:acc}; acc+=c.duration; } if(clips.length) return {clip:clips[clips.length-1],index:clips.length-1,local:clips[clips.length-1].duration,start:totalDuration-clips[clips.length-1].duration}; return null; }
function showClip(clip,localTime){ if(!clip) return; selectedClipId=clip.id; document.querySelectorAll('.clip-item').forEach(el=>{ el.classList.toggle('selected', el.dataset.id===clip.id); }); if(clip.type.startsWith('video')){ photoPreview.classList.add('hidden'); video.classList.remove('hidden'); if(video.src!==clip.url) video.src=clip.url; if(Math.abs(video.currentTime-localTime)>0.4) video.currentTime=localTime; } else { video.classList.add('hidden'); video.pause(); photoPreview.classList.remove('hidden'); photoPreview.src=clip.url; } }
function renderClips(){ clipsContainer.innerHTML=''; clips.forEach((c)=>{ const wrap=document.createElement('div'); wrap.dataset.id=c.id; wrap.className='clip-item relative h-[52px] bg-black rounded-lg overflow-hidden flex shrink-0 cursor-pointer'; wrap.style.width=(c.duration*PX_PER_SEC)+'px'; wrap.style.minWidth='60px'; if(c.id===selectedClipId) wrap.classList.add('selected'); const thumbs=document.createElement('div'); thumbs.className='flex h-full w-full'; if(c.type.startsWith('video') && c.thumbs && c.thumbs.length){ c.thumbs.forEach(u=>{ const im=document.createElement('img'); im.src=u; im.className='h-full flex-1 object-cover pointer-events-none'; thumbs.appendChild(im); }); } else if(c.type.startsWith('image')){ const im=document.createElement('img'); im.src=c.url; im.className='h-full w-full object-cover pointer-events-none'; thumbs.appendChild(im); } else { const ph=document.createElement('div'); ph.className='w-full h-full bg-[#111]'; thumbs.appendChild(ph); } wrap.appendChild(thumbs); const dur=document.createElement('div'); dur.className='absolute bottom-0 right-0 bg-black/70 text-[9px] px-1 rounded-tl'; dur.textContent=fmt(c.duration); wrap.appendChild(dur); wrap.addEventListener('click',()=>{ let acc=0; for(let cl of clips){ if(cl.id===c.id) break; acc+=cl.duration; } seekGlobal(acc+0.01); }); clipsContainer.appendChild(wrap); }); calcTotal(); }
async function generateThumbsForClip(clip){ if(!clip.type.startsWith('video')) return; const v=document.createElement('video'); v.src=clip.url; v.muted=true; v.crossOrigin='anonymous'; v.playsInline=true; await new Promise(res=> v.onloadedmetadata=()=>res()); clip.duration=v.duration||3; const count=Math.max(1,Math.min(10,Math.floor(clip.duration))); clip.thumbs=[]; for(let i=0;i<count;i++){ const t=(i+0.5)*(clip.duration/count); await new Promise(res=>{ const onSeek=()=>{ v.removeEventListener('seeked',onSeek); res(); }; v.addEventListener('seeked',onSeek); v.currentTime=t; }); const can=document.createElement('canvas'); can.width=80; can.height=52; const ctx=can.getContext('2d'); try{ ctx.drawImage(v,0,0,80,52); }catch(e){ ctx.fillStyle='#111'; ctx.fillRect(0,0,80,52); } clip.thumbs.push(can.toDataURL()); } }async function addFiles(files){ for(let f of files){ const url=URL.createObjectURL(f); const id=Date.now()+Math.random().toString(36).slice(2); const clip={id,file:f,url,type:f.type,duration:f.type.startsWith('image')?3:1,thumbs:[],cover:null}; clips.push(clip); if(f.type.startsWith('video')){ await generateThumbsForClip(clip); } } renderClips(); if(totalDuration>0 && globalTime===0) seekGlobal(0.01); }
function seekGlobal(t){ globalTime=Math.max(0,Math.min(t,totalDuration)); const info=getClipAtTime(globalTime); if(info) showClip(info.clip,info.local); updateTimeLabel(); updatePlayhead(); }
function updatePlayhead(){ if(totalDuration===0){ playhead.style.left='160px'; return; } const baseOffset=160; const trackWidth=clipsContainer.scrollWidth; const ratio=totalDuration>0?globalTime/totalDuration:0; const x=baseOffset+ratio*trackWidth; playhead.style.left=x+'px'; }
function tick(){ if(!isPlaying) return; const info=getClipAtTime(globalTime); if(!info){ pause(); seekGlobal(0); return; } if(info.clip.type.startsWith('video')){ if(!video.paused) globalTime=info.start+video.currentTime; } else { globalTime+=1/60; } if(globalTime>=totalDuration){ pause(); seekGlobal(totalDuration); return; } const nextInfo=getClipAtTime(globalTime); if(nextInfo && nextInfo.clip.id!==info.clip.id){ showClip(nextInfo.clip,nextInfo.local); if(nextInfo.clip.type.startsWith('video')){ video.currentTime=nextInfo.local; video.play().catch(()=>{}); } } updateTimeLabel(); updatePlayhead(); raf=requestAnimationFrame(tick); }
function play(){ if(clips.length===0) return; if(globalTime>=totalDuration-0.02) seekGlobal(0); isPlaying=true; playIcon.classList.add('hidden'); pauseIcon.classList.remove('hidden'); const info=getClipAtTime(globalTime); if(info && info.clip.type.startsWith('video')){ video.currentTime=info.local; video.play().catch(()=>{}); } raf=requestAnimationFrame(tick); }
function pause(){ isPlaying=false; playIcon.classList.remove('hidden'); pauseIcon.classList.add('hidden'); video.pause(); if(raf) cancelAnimationFrame(raf); }
timelineScroll.addEventListener('pointerdown', (e)=>{ if(e.target.closest('button')) return; const rect=clipsContainer.getBoundingClientRect(); const move=(ev)=>{ const x=ev.clientX-rect.left+timelineScroll.scrollLeft; const ratio=x/Math.max(1,clipsContainer.scrollWidth); seekGlobal(ratio*totalDuration); }; const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); }; window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); move(e); });
addMediaBtn.addEventListener('click', ()=> mediaInput.click());
mediaInput.addEventListener('change', async (e)=>{ if(e.target.files.length) await addFiles(e.target.files); e.target.value=''; });
playBtn.addEventListener('click', ()=>{ isPlaying?pause():play(); });
document.getElementById('muteBtn').addEventListener('click', ()=>{ video.muted=!video.muted; document.getElementById('muteBtn').classList.toggle('bg-[#18E58B]', video.muted); });
document.getElementById('coverBtn').addEventListener('click', ()=>{ const info=getClipAtTime(globalTime); if(!info) return alert('Add media first'); const can=document.createElement('canvas'); can.width=720; can.height=1280; const ctx=can.getContext('2d'); if(info.clip.type.startsWith('video')) ctx.drawImage(video,0,0,can.width,can.height); else ctx.drawImage(photoPreview,0,0,can.width,can.height); info.clip.cover=can.toDataURL(); renderClips(); alert('Cover set'); });
document.getElementById('fitBtn').addEventListener('click', ()=>{ const box=document.getElementById('previewBox'); box.style.width=box.style.width==='100%'?'62%':'100%'; });
document.getElementById('undoBtn').addEventListener('click', ()=>{ const tl=document.getElementById('textLayer'); if(tl.lastChild) tl.removeChild(tl.lastChild); });
document.getElementById('redoBtn').addEventListener('click', ()=>{ video.style.filter=''; photoPreview.style.filter=''; document.getElementById('textLayer').innerHTML=''; });
document.getElementById('keyframeBtn').addEventListener('click', ()=>{ const marker=document.createElement('div'); marker.className='absolute top-1 w-2.5 h-2.5 bg-white rotate-45 rounded-[1px] border border-black'; marker.style.left=playhead.style.left; document.getElementById('keyframeMarkers').appendChild(marker); });
function openTool(id){ const p=document.getElementById('toolPanel'), c=document.getElementById('toolContent'), title=document.getElementById('toolTitle'); p.classList.remove('hidden'); title.textContent=id; const m={ edit:`<div class="flex gap-2 flex-wrap"><button onclick="video.playbackRate=0.5" class="bg-[#2a2a2a] px-4 py-2.5 rounded-full text-xs">0.5x</button><button onclick="video.playbackRate=1" class="bg-[#18E58B] text-black px-4 py-2.5 rounded-full text-xs font-bold">1x</button><button onclick="video.playbackRate=2" class="bg-[#2a2a2a] px-4 py-2.5 rounded-full text-xs">2x</button><button onclick="video.style.filter='';photoPreview.style.filter=''" class="bg-[#2a2a2a] px-4 py-2.5 rounded-full text-xs">Reset</button></div>`, audio:`<div><input id="vol" type="range" min="0" max="100" value="100" class="w-full accent-[#18E58B]" oninput="video.volume=this.value/100"><button onclick="document.getElementById('audioInput').click()" class="mt-3 w-full h-10 bg-[#242424] rounded-xl text-[13px]">+ Add Audio</button></div>`, text:`<div class="flex gap-2"><input id="textInp" placeholder="Enter text" class="bg-[#242424] px-4 py-3 rounded-xl flex-1 text-[13px] outline-none border border-[#333]"><button onclick="addTxt()" class="bg-[#18E58B] text-black px-6 py-3 rounded-xl font-bold">Add</button></div>`, effects:`<div class="grid grid-cols-3 gap-2"><button onclick="video.style.filter='';photoPreview.style.filter=''" class="bg-[#242424] py-3 rounded-xl text-xs">None</button><button onclick="video.style.filter='grayscale(1)';photoPreview.style.filter='grayscale(1)'" class="bg-[#242424] py-3 rounded-xl text-xs">B&W</button><button onclick="video.style.filter='sepia(1)';photoPreview.style.filter='sepia(1)'" class="bg-[#242424] py-3 rounded-xl text-xs">Sepia</button></div>`, overlay:`<div class="flex gap-2"><button onclick="document.getElementById('mediaInput').click()" class="flex-1 h-11 bg-[#18E58B] text-black rounded-xl text-xs font-bold">+ Add Overlay</button></div>`, captions:`<div><button onclick="autoCaption()" class="w-full h-11 bg-[#18E58B] text-black rounded-xl font-bold text-[13px]">Auto Captions</button></div>`, filters:`<div class="grid grid-cols-4 gap-2"><button onclick="video.style.filter='contrast(1.2) saturate(1.4)'" class="h-14 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 text-xs font-bold">Vivid</button><button onclick="video.style.filter=''" class="h-14 rounded-xl bg-[#242424] text-xs">Natural</button></div>`, sticker:`<div class="grid grid-cols-6 gap-2"><button onclick="addSticker('❤️')" class="h-12 bg-[#242424] rounded-xl">❤️</button><button onclick="addSticker('🔥')" class="h-12 bg-[#242424] rounded-xl">🔥</button><button onclick="addSticker('✨')" class="h-12 bg-[#242424] rounded-xl">✨</button></div>`, aspect:`<div class="flex gap-2 flex-wrap"><button onclick="setAspect('9/16','62%')" class="bg-[#242424] px-4 py-2.5 rounded-full text-xs">9:16</button><button onclick="setAspect('16/9','100%')" class="bg-[#242424] px-4 py-2.5 rounded-full text-xs">16:9</button><button onclick="setAspect('1/1','62%')" class="bg-[#242424] px-4 py-2.5 rounded-full text-xs">1:1</button></div>`, background:`<div class="flex gap-3"><button onclick="document.getElementById('previewWrap').style.background='#000'" class="w-10 h-10 rounded-full bg-black border border-[#333]"></button><button onclick="document.getElementById('previewWrap').style.background='#1a1a1a'" class="w-10 h-10 rounded-full bg-[#1a1a1a] border-2 border-white"></button><button onclick="document.getElementById('previewWrap').style.background='#18E58B'" class="w-10 h-10 rounded-full bg-[#18E58B]"></button></div>`, }; c.innerHTML=m[id]||''; }
document.querySelectorAll('.tool-btn').forEach(b=>{ b.addEventListener('click', ()=> openTool(b.dataset.tool)); });
window.addTxt=function(){ const v=document.getElementById('textInp')?.value; if(!v) return; const d=document.createElement('div'); d.textContent=v; d.className='absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 px-3 py-1.5 rounded-lg text-white font-bold'; d.contentEditable=true; document.getElementById('textLayer').appendChild(d); document.getElementById('textInp').value=''; };
window.autoCaption=()=>{ const d=document.createElement('div'); d.textContent='Caption '+fmt(globalTime); d.className='absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/60 px-3 py-1.5 rounded-lg text-white font-bold'; document.getElementById('textLayer').appendChild(d); };
window.addSticker=function(s){ const d=document.createElement('div'); d.textContent=s; d.className='absolute left-1/2 top-1/2 text-3xl -translate-x-1/2 -translate-y-1/2'; d.contentEditable=true; document.getElementById('textLayer').appendChild(d); };
window.setAspect=(ratio,w)=>{ const box=document.getElementById('previewBox'); box.style.aspectRatio=ratio; box.style.width=w; };
document.getElementById('addAudioBtn2').addEventListener('click', ()=> document.getElementById('audioInput').click());
document.getElementById('addTextBtn2').addEventListener('click', ()=> openTool('text'));
document.getElementById('audioInput').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f); document.getElementById('bgAudio').src=url; document.getElementById('bgAudio').play(); });
aiUhdBtn.addEventListener('click', ()=> exportPanel.classList.toggle('hidden'));
function bindGroup(sel){ document.querySelectorAll(sel).forEach(btn=>{ btn.addEventListener('click', ()=>{ document.querySelectorAll(sel).forEach(b=>{ b.classList.remove('bg-white','text-black','font-bold'); b.classList.add('bg-[#242424]'); }); btn.classList.remove('bg-[#242424]'); btn.classList.add('bg-white','text-black','font-bold'); }); }); }
bindGroup('.res-opt'); bindGroup('.fps-opt'); bindGroup('.br-opt');
document.getElementById('resGroup').addEventListener('click', e=>{ const b=e.target.closest('.res-opt'); if(b){ currentRes=b.dataset.res; } });
document.getElementById('fpsGroup').addEventListener('click', e=>{ const b=e.target.closest('.fps-opt'); if(b){ currentFps=parseInt(b.dataset.fps); } });
document.getElementById('brGroup').addEventListener('click', e=>{ const b=e.target.closest('.br-opt'); if(b){ currentBitrate=parseInt(b.dataset.br); document.getElementById('bitrateLabel').textContent=currentBitrate+' Mbps'; } });
exportBtn.addEventListener('click', async ()=>{ if(clips.length===0){ alert('Add media first using + button'); return; } const resMap={ '480p':[854,480], '720p':[1280,720], '1080p':[1920,1080], '4K':[3840,2160] }; const [w,h]=resMap[currentRes]||[1920,1080]; const canvas=document.getElementById('exportCanvas'); canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d'); const stream=canvas.captureStream(currentFps); let mime='video/webm;codecs=vp9'; if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm'; const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:currentBitrate*1000000}); const chunks=[]; recorder.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; recorder.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`ObeSplit_${currentRes}_${currentFps}fps.mp4`; a.click(); exportPanel.classList.add('hidden'); }; recorder.start(); let t=0; const drawLoop=setInterval(()=>{ const info=getClipAtTime(t); if(!info){ clearInterval(drawLoop); recorder.stop(); return; } ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h); if(info.clip.type.startsWith('video')){ try{ ctx.drawImage(video,0,0,w,h); }catch(e){} } else { try{ ctx.drawImage(photoPreview,0,0,w,h); }catch(e){} } t+=1/currentFps; if(t>=totalDuration){ clearInterval(drawLoop); recorder.stop(); } }, 1000/currentFps); });
document.getElementById('tabVideo').addEventListener('click', ()=>{ isGif=false; document.getElementById('tabVideo').className='flex-1 py-2 rounded-full bg-white text-black text-[13px] font-bold'; document.getElementById('tabGif').className='flex-1 py-2 rounded-full text-[#777] text-[13px]'; });
document.getElementById('tabGif').addEventListener('click', ()=>{ isGif=true; document.getElementById('tabGif').className='flex-1 py-2 rounded-full bg-white text-black text-[13px] font-bold'; document.getElementById('tabVideo').className='flex-1 py-2 rounded-full text-[#777] text-[13px]'; });
</script>
