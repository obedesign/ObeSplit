<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  font-family:inherit;
  cursor:pointer;
}

/* ================= HOME ================= */

#home{
  min-height:100vh;
  background:#000;
  padding:18px;
  padding-bottom:95px;
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  grid-template-rows:155px 155px;
  gap:12px;
  max-width:520px;
  margin:0 auto;
}

.new-video{
  grid-column:1 / 3;
  height:72px;
  background:#18e58b;
  color:#000;
  border-radius:18px;
  font-size:21px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:2px;
}

.card{
  border-radius:18px;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:15px;
  font-weight:600;
}

.card svg{
  width:38px;
  height:38px;
  margin-bottom:10px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.ai-card{
  grid-column:1;
  grid-row:1;
  margin-top:84px;
}

.photo-card{
  grid-column:2;
  grid-row:1 / 3;
  background:#18e58b;
  color:#000;
}

.space-card{
  grid-column:1;
  grid-row:2;
  margin-top:0;
}

.projects{
  max-width:520px;
  margin:24px auto 0;
}

.projects-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:14px;
}

.project-box{
  height:95px;
  background:#111;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:14px;
}

/* ================= HOME NAV ================= */

.home-bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  background:#080808;
  border-top:1px solid #202020;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.nav-item{
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:11px;
}

.nav-item.active{
  color:#fff;
}

.nav-item svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ================= EDITOR ================= */

#editor{
  display:none;
  min-height:100vh;
  background:#000;
  padding-bottom:78px;
}

.editor-top{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #171717;
}

.top-btn{
  background:none;
  color:#fff;
  font-size:25px;
  padding:5px;
}

.editor-title{
  font-size:15px;
  font-weight:700;
}

.export-btn{
  background:#18e58b;
  color:#000;
  border-radius:8px;
  padding:8px 14px;
  font-size:13px;
  font-weight:700;
}

/* ================= PREVIEW ================= */

.preview-area{
  height:42vh;
  min-height:260px;
  background:#050505;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

#video{
  max-width:100%;
  max-height:100%;
  display:block;
}

.video-placeholder{
  color:#555;
  font-size:14px;
}

/* ================= PLAYER CONTROLS ================= */

.controls{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:65px;
  border-top:1px solid #151515;
  border-bottom:1px solid #151515;
}

.control-btn{
  background:none;
  color:#fff;
  font-size:20px;
}

/* ================= TIMELINE ================= */

.timeline-area{
  background:#080808;
  padding:12px 16px 18px;
}

.timeline-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aaa;
  font-size:11px;
  margin-bottom:12px;
}

/* Main timeline row */

.timeline-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  padding-bottom:2px;
}

.timeline-row::-webkit-scrollbar{
  display:none;
}

/* MUTE AND COVER ICON BUTTONS */

.timeline-icon{
  width:43px;
  height:58px;
  min-width:43px;
  background:#111;
  border:1px solid #292929;
  border-radius:7px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

.timeline-icon:active{
  transform:scale(.94);
}

.timeline-icon svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* THUMBNAILS */

.timeline-thumbnails{
  height:58px;
  display:flex;
  flex:0 0 auto;
  overflow:hidden;
  border-radius:7px;
  background:#111;
}

.thumbnail{
  width:68px;
  height:58px;
  min-width:68px;
  object-fit:cover;
  display:block;
  border-right:1px solid #292929;
}

/* WHITE PLUS BUTTONS */

.plus-button{
  width:50px;
  height:58px;
  min-width:50px;
  background:#fff;
  color:#000;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:300;
  line-height:1;
  padding:0;
}

.plus-button:active{
  transform:scale(.94);
}

/* LONG WHITE LINE */

.timeline-line{
  position:relative;
  width:100%;
  height:26px;
  margin-top:7px;
}

.timeline-line::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:12px;
  height:2px;
  background:#fff;
  border-radius:3px;
}

/* WHITE PLAYHEAD */

#whitePlayhead{
  position:absolute;
  top:3px;
  left:0;
  width:2px;
  height:20px;
  background:#fff;
  z-index:5;
  pointer-events:none;
}

/* ================= BOTTOM TOOLBAR ================= */

.editor-toolbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:#080808;
  border-top:1px solid #1b1b1b;
  display:flex;
  flex-wrap:nowrap;
  overflow-x:auto;
  width:100%;
  min-width:0;
  gap:22px;
  padding:8px 16px;
  z-index:900;
  scrollbar-width:none;
  white-space:nowrap;
}

.editor-toolbar::-webkit-scrollbar{
  display:none;
}

.editor-tool{
  flex:0 0 auto;
  min-width:48px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:10px;
}

.editor-tool svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* FILE INPUT */

input[type="file"]{
  display:none;
}

/* MESSAGE */

.message{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:2000;
}
</style>
</head>

<body>

<!-- ================================================= -->
<!-- HOME -->
<!-- ================================================= -->

<div id="home">

</div>


<!-- ================================================= -->
<!-- HOME NAVIGATION -->
<!-- ================================================= -->

<div class="home-bottom-nav" id="homeBottomNav">

  <button class="nav-item active">

    <svg viewBox="0 0 24 24">
      <path d="M4 11l8-7 8 7"/>
      <path d="M6 10v10h12V10"/>
    </svg>

    Edit

  </button>


  <button class="nav-item">

    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="M7 8h10"/>
      <path d="M7 12h6"/>
      <path d="M7 16h8"/>
    </svg>

    Templates

  </button>


  <button class="nav-item">

    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/>
    </svg>

    Me

  </button>

</div>


<!-- ================================================= -->
<!-- EDITOR -->
<!-- ================================================= -->

<div id="editor">


  <!-- TOP -->

  <div class="editor-top">

    <button class="top-btn" onclick="goHome()">
      ×
    </button>


    <div class="editor-title">
      ObeSplit
    </div>


    <button class="export-btn" onclick="exportVideo()">
      Export
    </button>

  </div>


  <!-- VIDEO PREVIEW -->

  <div class="preview-area">

    <video
      id="video"
      playsinline

    </video>

    <div
      class="video-placeholder"

      Select a video
    </div>

  </div>


  <!-- PLAYER CONTROLS -->

  <div class="controls">

    <button
      class="control-btn"
      onclick="undo()">
      ↶
    </button>


    <button
      class="control-btn"
      onclick="togglePlay()"

    </button>


    <button

      ↷
    </button>

  </div>


  <!-- ================================================= -->
  <!-- TIMELINE -->
  <!-- ================================================= -->

  <div class="timeline-area">


    <!-- TIME -->

    <div class="timeline-header">

      <span id="currentTime">
        00:00
      </span>

      <span id="duration">
        00:00
      </span>

    </div>


    <!-- MUTE → COVER → THUMBNAILS → PLUS → PLUS -->

    <div class="timeline-row">


      <!-- MUTE -->

      <button
        class="timeline-icon"
        onclick="toggleMute()"
        title="Mute">

        <svg
          id="muteIcon"
          viewBox="0 0 24 24">

          <path d="M4 10v4h4l5 4V6l-5 4H4z"/>

          <path d="M17 9c1.5 1.5 1.5 4.5 0 6"/>

        </svg>

      </button>


      <!-- COVER -->

      <button
        class="timeline-icon"
        onclick="setCover()"
        title="Cover">

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="4"
            width="18"
            height="16"
            rx="2"/>

          <circle
            cx="8.5"
            cy="9"
            r="1.5"/>

          <path
            d="M3 17l5-5 4 4 3-3 6 5"/>

        </svg>

      </button>


      <!-- VIDEO THUMBNAILS -->

      <div
        class="timeline-thumbnails"
        id="thumbnails">
      </div>


      <!-- ADD VIDEO -->

      <button
        class="plus-button"
        onclick="openAddVideo()"
        title="Add video">

        +

      </button>


      <!-- ADD PHOTO -->

      <button
        class="plus-button"

        +

    </div>


    <!-- VERY LONG WHITE LINE -->

    <div class="timeline-line">

      <div id="whitePlayhead"></div>

    </div>


  </div>


  <!-- ================================================= -->
  <!-- EDITING TOOLBAR -->
  <!-- ================================================= -->

  <div class="editor-toolbar">


    <!-- EDIT -->

    <button
      class="editor-tool"
      onclick="showMessage('Edit')">

      <svg viewBox="0 0 24 24">
        <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/>
        <path d="M13 6l3 3"/>
      </svg>

      Edit

    </button>


    <!-- MUSIC -->

    <button
      class="editor-tool"
      onclick="showMessage('Music')">

      <svg viewBox="0 0 24 24">
        <path d="M9 18V5l10-2v13"/>
        <circle cx="6" cy="18" r="3"/>

      Music

    <!-- TEXT -->

    <button

      <svg viewBox="0 0 24 24">
        <path d="M5 5h14"/>
        <path d="M12 5v14"/>
      </svg>

      Text

    </button>


    <!-- STICKERS -->

    <button

      <svg viewBox="0 0 24 24">

        <path d="M8 15c2 2 6 2 8 0"/>

      Stickers

    </button>


    <!-- EFFECTS -->

    <button
      class="editor-tool"
      onclick="showMessage('Effects')">

      <svg viewBox="0 0 24 24">

    <!-- FILTERS -->

<!-- FILE INPUTS -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  onchange="loadVideo(event)">


<input
  type="file"
  id="photoInput"
  accept="image/*"
  onchange="loadPhoto(event)">


<input
  type="file"
  id="addVideoInput"
  accept="video/*"
  onchange="addVideo(event)">


<input
  type="file"
  id="addPhotoInput"
  accept="image/*"
  onchange="addPhoto(event)">


<div
  class="message"
  id="message">
</div>


<script>

/* ================================================= */
/* VARIABLES */
/* ================================================= */

const video =
  document.getElementById("video");

let videoURL = null;

let isPickingFile = false;

let aspectModes = [
  "9:16",
  "16:9",
  "1:1"
];

let aspectIndex = 0;


/* ================================================= */
/* OPEN VIDEO PICKER */
/* ================================================= */

function openVideoPicker(){

  isPickingFile = true;

  document
    .getElementById("homeBottomNav")
    .style.display = "none";

  document
    .getElementById("videoInput")
    .click();

}


/* ================================================= */
/* OPEN PHOTO PICKER */
/* ================================================= */

function openPhotoPicker(){

  isPickingFile = true;

  document
    .getElementById("homeBottomNav")
    .style.display = "none";

  document
    .getElementById("photoInput")
    .click();

}


/* ================================================= */
/* ADD VIDEO */
/* ================================================= */

function openAddVideo(){

  document
    .getElementById("addVideoInput")
    .click();

}


/* ================================================= */
/* ADD PHOTO */
/* ================================================= */

function openAddPhoto(){

  document
    .getElementById("addPhotoInput")
    .click();

}


/* ================================================= */
/* FILE PICKER FOCUS */
/* ================================================= */

window.addEventListener("focus",function(){

  if(isPickingFile){

    setTimeout(function(){

      const editorDisplay =
        document.getElementById("editor").style.display;

      if(editorDisplay !== "block"){

        document
          .getElementById("homeBottomNav")
          .style.display = "flex";

      }

      isPickingFile = false;

    },300);

  }

});


/* ================================================= */
/* LOAD VIDEO */
/* ================================================= */

function loadVideo(event){

  isPickingFile = false;

  const file =
    event.target.files[0];

  if(!file){

    document
      .getElementById("homeBottomNav")
      .style.display = "flex";

    return;

  }


  if(videoURL){

    URL.revokeObjectURL(videoURL);

  }


  videoURL =
    URL.createObjectURL(file);

  video.src =
    videoURL;


  document
    .getElementById("home")
    .style.display = "none";


  document
    .getElementById("homeBottomNav")
    .style.display = "none";


  document
    .getElementById("editor")
    .style.display = "block";


  document
    .getElementById("videoPlaceholder")
    .style.display = "none";


  video.onloadedmetadata =
    function(){

      document
        .getElementById("duration")
        .textContent =
        formatTime(video.duration);

      generateThumbnails();

    };

}


/* ================================================= */
/* GENERATE THUMBNAILS */
/* ================================================= */

async function generateThumbnails(){

  const container =
    document.getElementById("thumbnails");

  container.innerHTML = "";


  const duration =
    video.duration;

  if(!duration || isNaN(duration)){

    return;

  }


  const count = 8;


  const tempVideo =
    document.createElement("video");

  tempVideo.src =
    videoURL;

  tempVideo.muted =
    true;

  tempVideo.playsInline =
    true;

  tempVideo.preload =
    "auto";


  await new Promise(function(resolve){

    tempVideo.onloadedmetadata =
      resolve;

  });


  const canvas =
    document.createElement("c
