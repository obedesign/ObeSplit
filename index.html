<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  border:0;
  color:#fff;
  font-family:inherit;
  cursor:pointer;
}

:root{
  --green:#18e58b;
  --panel:#1d1d1d;
  --panel2:#252525;
  --muted:#9b9b9b;
}

/* =========================
   HOME
========================= */

#home{
  display:block;
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:18px 14px 92px;
  background:#000;
}

.home-grid{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  grid-template-rows:150px 150px;
  gap:12px;
}

.home-card{
  border-radius:14px;
  background:#1b1b1b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  color:#fff;
}

.home-card.green{
  background:var(--green);
  color:#000;
}

.new-video{
  grid-column:1 / 3;
  height:150px;
  border-radius:18px;
  font-size:22px;
  font-weight:700;
}

.new-video .plus{
  font-size:34px;
  line-height:1;
  margin-right:7px;
  vertical-align:-3px;
}

.ai-card{
  grid-column:1;
  grid-row:2;
}

.photo-card{
  grid-column:2;
  grid-row:2 / 4;
  min-height:312px;
}

.space-card{
  grid-column:1;
  grid-row:3;
  min-height:150px;
}

.card-icon{
  width:52px;
  height:52px;
  margin-bottom:10px;
}

.card-title{
  font-size:17px;
  font-weight:600;
}

.projects{
  margin-top:18px;
  padding:18px 16px;
  background:#171717;
  border-radius:15px;
  font-size:17px;
  font-weight:600;
}

/* HOME NAV */

#homeBottomNav{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  height:72px;
  background:#171717;
  border-top:1px solid #262626;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.home-nav-item{
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  color:#aaa;
  font-size:12px;
}

.home-nav-item.active{
  color:#fff;
}

.home-nav-icon{
  width:24px;
  height:24px;
}

/* =========================
   EDITOR
========================= */

#editor{
  display:none;
  width:100%;
  min-height:100vh;
  background:#111;
  overflow:hidden;
}

.editor-top{
  height:70px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.close-btn{
  width:42px;
  height:42px;
  background:none;
  font-size:43px;
  font-weight:200;
  line-height:38px;
  padding:0;
}

.export-btn{
  height:50px;
  padding:0 22px;
  border-radius:13px;
  background:var(--green);
  color:#000;
  font-size:17px;
  font-weight:700;
}

/* PREVIEW */

.preview-area{
  width:100%;
  min-height:340px;
  height:54vh;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

#videoPlaceholder{
  color:#777;
  font-size:15px;
}

/* PREVIEW CONTROLS */

.preview-controls{
  height:68px;
  background:#151515;
  display:flex;
  align-items:center;
  justify-content:space-around;
  border-bottom:1px solid #282828;
}

.preview-control{
  width:46px;
  height:46px;
  background:transparent;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  font-size:22px;
}

.preview-control.play{
  color:#fff;
  font-size:23px;
}

.preview-control:active{
  background:#252525;
}

/* =========================
   TIMELINE
========================= */

.timeline-area{
  background:#111;
  padding:10px 0 0;
}

.timeline-header{
  display:flex;
  align-items:center;
  height:48px;
  padding:0 15px;
  color:#aaa;
  font-size:13px;
}

.current-time{
  width:68px;
  line-height:19px;
  flex-shrink:0;
}

.ruler-wrap{
  flex:1;
  overflow:hidden;
}

.ruler{
  display:flex;
  align-items:center;
  gap:19px;
  white-space:nowrap;
  color:#aaa;
  height:100%;
  font-size:12px;
}

.ruler span{
  display:inline-block;
  min-width:22px;
}

/* TRACK */

.timeline-wrapper{
  width:100%;
  position:relative;
  display:flex;
  align-items:center;
  padding:0 13px;
}

.track-actions{
  width:174px;
  flex-shrink:0;
  display:flex;
  gap:7px;
  margin-right:8px;
}

.track-btn{
  width:82px;
  height:82px;
  background:#262626;
  border-radius:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#aaa;
  font-size:11px;
}

.track-btn svg{
  width:27px;
  height:27px;
}

.track-btn:active{
  background:#303030;
}

/* THUMBNAIL TRACK */

.timeline-container{
  flex:1;
  min-width:0;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  position:relative;
}

.timeline-container::-webkit-scrollbar{
  display:none;
}

.timeline{
  position:relative;
  min-width:100%;
  height:82px;
}

.thumbnails{
  height:82px;
  display:flex;
  align-items:stretch;
  width:max-content;
  position:relative;
}

.thumbnail{
  width:92px;
  height:82px;
  flex:none;
  object-fit:cover;
  display:block;
  border-right:1px solid #222;
}

.add-clip-btn{
  width:82px;
  height:82px;
  flex:none;
  background:#242424;
  color:#fff;
  font-size:32px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* REAL PLAYHEAD */

.playhead{
  position:absolute;
  top:-4px;
  bottom:-4px;
  left:0;
  width:2px;
  background:#fff;
  z-index:20;
  pointer-events:none;
}

.playhead::before{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
}

/* LONG WHITE LINE */

.timeline-line{
  height:4px;
  background:#fff;
  border-radius:5px;
  margin:9px 14px 10px;
}

/* AUDIO / TEXT */

.timeline-extra{
  display:flex;
  gap:9px;
  padding:0 13px 11px;
}

.extra-btn{
  height:49px;
  flex:1;
  border-radius:9px;
  background:#222;
  color:#aaa;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0 15px;
  gap:10px;
  font-size:15px;
}

.extra-plus{
  font-size:27px;
  color:#ddd;
  font-weight:300;
}

/* =========================
   EDITOR TOOLBAR
========================= */

.editor-toolbar{
  height:94px;
  background:#191919;
  border-top:1px solid #292929;
  display:flex;
  align-items:center;
  overflow-x:auto;
  scrollbar-width:none;
  padding:0 8px;
}

.editor-toolbar::-webkit-scrollbar{
  display:none;
}

.tool{
  min-width:82px;
  height:78px;
  background:transparent;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:12px;
  flex-shrink:0;
}

.tool svg{
  width:28px;
  height:28px;
  stroke:#aaa;
}

.tool:active{
  color:#fff;
}

.tool:active svg{
  stroke:#fff;
}

/* MESSAGE */

#message{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:110px;
  transform:translateX(-50%);
  display:none;
  background:#fff;
  color:#000;
  padding:11px 17px;
  border-radius:9px;
  font-size:14px;
  white-space:nowrap;
}

/* FILE INPUTS */

input[type="file"]{
  display:none;
}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

  <div class="home-grid">

    <button class="home-card green new-video" onclick="openVideoPicker()">
      <span><span class="plus">＋</span>NEW VIDEO</span>
    </button>

    <button class="home-card ai-card" onclick="showMessage('AI Generator')">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>
        <circle cx="12" cy="12" r="4"/>
        <path d="M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>
      </svg>
      <span class="card-title">AI Generator</span>

    <button class="home-card photo-card green" onclick="openPhotoPicker()">
      <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9" r="1.5"/>
        <path d="m4 17 5-5 3 3 2-2 6 6"/>
      </svg>
      <span class="card-title">Edit Photo</span>
    </button>

    <button class="home-card space-card" onclick="showMessage('Space')">

        <path d="M12 3c3 2 6 5 6 9 0 5-3 8-6 9-3-1-6-4-6-9 0-4 3-7 6-9Z"/>
        <path d="M8 12h8M12 8v8"/>
      </svg>
      <span class="card-title">Space</span>
    </button>

  </div>

  <div class="projects">Projects</div>

</div>

<!-- HOME NAV -->

<div id="homeBottomNav">

  <button class="home-nav-item active" onclick="showMessage('Edit')">
    <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="m4 20 4.5-1 10-10-3.5-3.5-10 10L4 20Z"/>
      <path d="m13.5 6.5 3.5 3.5"/>
    </svg>
    <span>Edit</span>
  </button>

  <button class="home-nav-item" onclick="showMessage('Templates')">
    <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <path d="M8 8h8M8 12h8M8 16h5"/>
    </svg>
    <span>Templates</span>
  </button>

  <button class="home-nav-item" onclick="showMessage('Me')">
    <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <circle cx="12" cy="8" r="3"/>
      <path d="M5 20c.7-3.5 3-5 7-5s6.3 1.5 7 5"/>
    </svg>
    <span>Me</span>
  </button>

</div>

<!-- =========================
     EDITOR
========================= -->

<div id="editor">

  <div class="editor-top">

    <button class="close-btn" onclick="goHome()">×</button>

    <button class="export-btn" onclick="exportVideo()">Export</button>

  </div>

  <!-- PREVIEW -->

  <div class="preview-area">

    <div id="videoPlaceholder">Select a video</div>

    <video id="video" playsinline preload="metadata"></video>

  </div>

  <!-- PREVIEW CONTROLS -->

  <div class="preview-controls">

    <!-- Fullscreen -->
    <button class="preview-control" onclick="toggleFullscreen()" aria-label="Fullscreen">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/>
      </svg>
    </button>

    <!-- NORMAL PLAY BUTTON -->
    <button class="preview-control play" id="playButton" onclick="togglePlay()" aria-label="Play">
      <svg id="playSvg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7L8 5Z"/>
      </svg>
    </button>

    <!-- SPEAKER ICON REMOVED -->

    <!-- Undo -->
    <button class="preview-control" onclick="undo()" aria-label="Undo">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="M9 7 4 12l5 5"/>
        <path d="M4 12h9a7 7 0 0 1 7 7"/>
      </svg>
    </button>

    <!-- Redo -->
    <button class="preview-control" onclick="redo()" aria-label="Redo">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="m15 7 5 5-5 5"/>
        <path d="M20 12h-9a7 7 0 0 0-7 7"/>
      </svg>
    </button>

  </div>

  <!-- TIMELINE -->

  <div class="timeline-area">

    <div class="timeline-header">

      <div class="current-time" id="currentTime">
        00:00<br>/ 00:00
      </div>

      <div class="ruler-wrap">
        <div class="ruler" id="ruler"></div>
      </div>

    </div>

    <div class="timeline-wrapper">

      <!-- MUTE + COVER -->
      <div class="track-actions">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">

        <button class="track-btn" onclick="showMessage('Cover')">

    <div class="timeline-extra">

      <button class="extra-btn" onclick="showMessage('Add audio')">

        <path d="m4 20 4.5-1 10-10-3.5-3.5-10 10L4 20Z"/>

      </svg>
      <span>Edit</span>
    </button>

    <button class="tool" onclick="showMessage('Audio')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
        <path d="M9 18V5l10-2v13"/>

    <button class="tool" onclick="showMessage('Text')">

  type="file"
  accept="video/*"
  onchange="loadVideo(event)"
>

<input
  id="photoInput"
  type="file"
  accept="image/*"
  onchange="loadPhoto(event)"
>

<script>
const video = document.getElementById("video");

let videoURL = null;
let isPickingFile = false;


/* =========================
   FILE PICKERS
========================= */

function openVideoPicker(){

  isPickingFile = true;

  document.getElementById("homeBottomNav").style.display = "none";

  document.getElementById("videoInput").click();
}


function openPhotoPicker(){

  isPickingFile = true;

  document.getElementById("homeBottomNav").style.display = "none";

  document.getElementById("photoInput").click();
}


/* Restore home navigation if picker is cancelled */

window.addEventListener("focus", function(){

  if(isPickingFile){

    setTimeout(function(){

      if(document.getElementById("editor").style.display !== "block"){

        document.getElementById("homeBottomNav").style.display = "flex";

      }

      isPickingFile = false;

    }, 500);

  }

});


/* =========================
   LOAD VIDEO
========================= */

function loadVideo(event){

  isPickingFile = false;

  const file = event.target.files[0];

  if(!file){

    document.getElementById("homeBottomNav").style.display = "flex";

    return;
  }

  if(videoURL){

    URL.revokeObjectURL(videoURL);

  }

  videoURL = URL.createObjectURL(file);

  video.src = videoURL;

  document.getElementById("home").style.display = "none";

  document.getElementById("homeBottomNav").style.display = "none";

  document.getElementById("editor").style.display = "block";

  document.getElementById("videoPlaceholder").style.display = "none";

  video.load();

  video.onloadedmetadata = function(){

    document.getElementById("currentTime").innerHTML =
      "00:00<br>/ " + formatTime(video.duration);

    generateRuler(video.duration);

    generateThumbnails();

  };

}


/* =========================
   RULER
========================= */

function generateRuler(duration){

  const ruler = document.getElementById("ruler");

  ruler.innerHTML = "";

  const total = Math.ceil(duration);

  for(let i = 0; i <= total; i++){

    const span = document.createElement("span");

    span.textContent = formatTime(i);

    ruler.appendChild(span);

  }

}


/* =========================
   THUMBNAILS
========================= */

async function generateThumbnails(){

  const container = document.getElementById("thumbnails");

  const playhead = document.getElementById("playhead");

  container.innerHTML = "";

  container.appendChild(playhead);

  const duration = video.duration;

  if(!duration || isNaN(duration)) return;

  const count = 12;

  const tempVideo = document.createElement("video");

  tempVideo.src = videoURL;

  tempVideo.muted = true;

  tempVideo.playsInline = true;

  tempVideo.preload = "auto";

  await new Promise(function(resolve){

    tempVideo.onloadedmetadata = resolve;

  });

  const canvas = document.createElement("canvas");

  canvas.width = 160;

  canvas.height = 100;

  const ctx = canvas.getContext("2d");

  for(let i = 0; i < count; i++){

    const time = Math.min(
      duration - 0.05,
      (duration / count) * i
    );

    await new Promise(function(resolve){

      tempVideo.onseeked = function(){

        resolve();

      };

      tempVideo.currentTime = Math.max(0, time);

    });

    try{

      ctx.drawImage(
        tempVideo,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const img = document.createElement("img");

      img.className = "thumbnail";

      img.src = canvas.toDataURL("image/jpeg",0.82);

      container.appendChild(img);

    }catch(error){

      console.log(error);

    }

  }

  const addBtn = document.createElement("button");

  addBtn.className = "add-clip-btn";

  addBtn.textContent = "+";

  addBtn.onclick = openVideoPicker;

  container.appendChild(addBtn);

  playhead.style.left = "0px";

}


/* =========================
   P
