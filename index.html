<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ObeSplit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

button{
  border:0;
  outline:0;
  color:#fff;
  background:none;
}

#home{
  width:100%;
  height:100vh;
  overflow-y:auto;
  padding:20px 18px 105px;
  max-width:700px;
  margin:auto;
}

/* ================= HOME ================= */

.new-video{
  width:100%;
  height:105px;
  border-radius:25px;
  background:#18e58b;
  color:#000;
  font-size:27px;
  font-weight:800;
}

/* NEW HOME GRID */

.home-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:150px 150px;
  gap:18px;
  margin-top:20px;
}

.home-card{
  background:#111;
  border:1px solid #252525;
  border-radius:25px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:18px;
  gap:12px;
}

.home-card.big{
  grid-column:2;
  grid-row:1 / span 2;
  background:#18e58b;
  color:#000;
  border:none;
}

.card-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-icon svg{
  width:42px;
  height:42px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.home-card.big .card-icon{
  width:65px;
  height:65px;
}

.home-card.big .card-icon svg{
  width:58px;
  height:58px;
}

.projects{
  margin-top:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.projects h2{
  margin:0;
  font-size:28px;
}

.projects button{
  font-size:30px;
}

/* HOME BOTTOM NAV */

.home-bottom-nav{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:78px;
  background:#111;
  border-top:1px solid #252525;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
}

.home-nav-item{
  min-width:80px;
  height:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#fff;
  font-size:12px;
}

.home-nav-item svg{
  width:25px;
  height:25px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}


/* ================= EDITOR ================= */

#editor{
  display:none;
  width:100%;
  height:100vh;
  background:#111;
  overflow:hidden;
}

.editor-top{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:15px;
  background:#151515;
}

.top-btn{
  font-size:30px;
  width:42px;
  height:42px;
}

.spacer{
  flex:1;
}

.export{
  background:#14cde5;
  color:#001015;
  font-weight:800;
  padding:13px 20px;
  border-radius:12px;
  font-size:17px;
}

/* VIDEO */

.preview-area{
  height:43vh;
  min-height:280px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
}

#videoPreview{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  background:#000;
}

/* CONTROL BAR */

.preview-controls{
  height:55px;
  background:#151515;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.control-btn{
  font-size:29px;
}

.play{
  font-size:34px;
}

/* TIMELINE */

.timeline{
  height:245px;
  background:#181818;
  overflow:hidden;
}

.time-row{
  height:38px;
  display:flex;
  align-items:center;
  gap:37px;
  padding-left:15px;
  color:#aaa;
  font-size:13px;
  white-space:nowrap;
}

.timeline-body{
  height:207px;
  overflow-x:auto;
  overflow-y:hidden;
  position:relative;
}

.timeline-content{
  min-width:900px;
  position:relative;
  padding:10px 20px;
}

/* VIDEO TRACK */

.video-track{
  height:70px;
  display:flex;
  overflow:hidden;
  border:2px solid #555;
  border-radius:5px;
  background:#000;
  position:relative;
}

.video-thumb{
  height:66px;
  width:90px;
  object-fit:cover;
  flex:none;
  border-right:1px solid #777;
  background:#222;
}

/* AUDIO */

.audio-track,
.text-track{
  height:44px;
  margin-top:9px;
  background:#242424;
  border-radius:5px;
  display:flex;
  align-items:center;
  padding-left:18px;
  color:#999;
  font-size:15px;
}

.add{
  font-size:25px;
  margin-right:12px;
  color:#aaa;
}

/* PLAYHEAD */

.playhead{
  position:absolute;
  top:0;
  left:20px;
  width:2px;
  height:195px;
  background:#fff;
  z-index:5;
  pointer-events:none;
}

.playhead:before{
  content:"";
  position:absolute;
  top:-1px;
  left:-5px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
}

/* CLIP TOOLS */

.clip-tools{
  position:absolute;
  left:15px;
  bottom:88px;
  display:flex;
  gap:8px;
  z-index:10;
}

.clip-tool{
  width:90px;
  height:65px;
  background:#222;
  border-radius:10px;
  font-size:12px;
}

.clip-tool span{
  display:block;
  font-size:24px;
  margin-bottom:3px;
}

/* BOTTOM */

.editor-toolbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:86px;
  background:#181818;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  overflow-x:auto;
  z-index:30;
}

.editor-tool{
  min-width:72px;
  height:82px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:6px;
  font-size:12px;
}

.editor-tool span{
  font-size:28px;
}

/* MESSAGE */

.message{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  background:#252525;
  padding:13px 20px;
  border-radius:12px;
  z-index:999;
  font-size:14px;
  white-space:nowrap;
}

@media(max-width:500px){

  .home-grid{
    grid-template-rows:145px 145px;
    gap:14px;
  }

  .home-card{
    border-radius:23px;
  }

  .new-video{
    height:105px;
  }

}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div id="home">

  <button class="new-video" onclick="openVideoPicker()">
    ＋ NEW VIDEO
  </button>

  <div class="home-grid">

    <!-- AI GENERATOR -->

    <button class="home-card"
      onclick="showMessage('AI Generator coming soon')">

      <div class="card-icon">

        <svg viewBox="0 0 48 48">
          <path d="M24 5l2.5 10.5L37 18l-10.5 2.5L24 31l-2.5-10.5L11 18l10.5-2.5L24 5z"/>
          <path d="M39 27l1.5 6L46 34.5l-5.5 1.5L39 42l-1.5-6L32 34.5l5.5-1.5L39 27z"/>
        </svg>

      </div>

      AI Generator

    </button>


    <!-- EDIT PHOTO - BIG -->

    <button class="home-card big"
      onclick="openPhotoPicker()">

      <div class="card-icon">

        <svg viewBox="0 0 48 48">
          <rect x="5" y="7" width="38" height="34" rx="5"/>
          <circle cx="16" cy="18" r="3"/>
          <path d="M7 36l11-11 8 8 5-6 10 9"/>
        </svg>

      </div>

      Edit Photo

    </button>


    <!-- SPACE -->

    <button class="home-card"
      onclick="showMessage('Space coming soon')">

      <div class="card-icon">

        <svg viewBox="0 0 48 48">
          <path d="M15 36h21a8 8 0 0 0 1-16 13 13 0 0 0-25-2 9 9 0 0 0 3 18z"/>
          <path d="M17 29l-4 4m18-4l4 4"/>
        </svg>

      </div>

      Space

    </button>

  </div>


  <div class="projects">

    <h2>Projects</h2>

    <button>☰</button>

  </div>

</div>


<!-- ================= HOME BOTTOM NAV ================= -->

<div class="home-bottom-nav" id="homeBottomNav">

  <button class="home-nav-item"
    onclick="showMessage('Edit')">

    <svg viewBox="0 0 24 24">
      <path d="M6 4l12 16"/>
      <path d="M18 4L6 20"/>
      <path d="M3 4h4v4H3z"/>
      <path d="M17 16h4v4h-4z"/>
    </svg>

    Edit

  </button>


  <button class="home-nav-item"
    onclick="showMessage('Templates')">

    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>

    Templates

  </button>


  <button class="home-nav-item"
    onclick="showMessage('Me')">

    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>
    </svg>

    Me

  </button>

</div>


<!-- ================= EDITOR ================= -->

<div id="editor">

  <div class="editor-top">

    <button class="top-btn" onclick="goHome()">×</button>

    <button class="top-btn">⌕</button>

    <div class="spacer"></div>

    <button class="export" onclick="exportVideo()">
      Export
    </button>

  </div>


  <div class="preview-area">

    <video
      id="videoPreview"
      playsinline
      preload="metadata">
    </video>

  </div>


  <div class="preview-controls">

    <button class="control-btn"
      onclick="toggleFullscreen()">
      ⛶
    </button>

    <button class="control-btn play"
      id="playButton"
      onclick="togglePlay()">
      ▶
    </button>

    <div>

      <button class="control-btn"
        onclick="undoAction()">
        ↶
      </button>

      <button class="control-btn"
        onclick="redoAction()">
        ↷
      </button>

    </div>

  </div>


  <div class="timeline">

    <div class="time-row">

      <span>00:00</span>
      <span>00:01</span>
      <span>00:02</span>
      <span>00:03</span>
      <span>00:04</span>
      <span>00:05</span>
      <span>00:06</span>
      <span>00:07</span>
      <span>00:08</span>

    </div>


    <div class="timeline-body">

      <div class="timeline-content">

        <div class="playhead" id="playhead"></div>

        <div
          class="video-track"
          id="videoTrack">
        </div>


        <div class="audio-track">

          <span class="add">＋</span>
          Add audio

        </div>


        <div class="text-track">

          <span class="add">＋</span>
          Add text

        </div>

      </div>

    </div>

  </div>


  <div class="clip-tools">

    <button
      class="clip-tool"
      onclick="muteVideo()">

      <span>🔊</span>
      Mute clip

    </button>


    <button
      class="clip-tool"
      onclick="splitVideo()">

      <span>✂</span>
      Split

    </button>


    <button
      class="clip-tool"
      onclick="showMessage('Cover editor opened')">

      <span>✎</span>
      Cover

    </button>

  </div>


  <div class="editor-toolbar">

    <button
      class="editor-tool"
      onclick="showMessage('Edit tools opened')">

      <span>✂</span>
      Edit

    </button>


    <button
      class="editor-tool"
      onclick="showMessage('Audio tools opened')">

      <span>♪</span>
      Audio

    </button>


    <button
      class="editor-tool"
      onclick="showMessage('Text tools opened')">

      <span>T</span>
      Text

    </button>


    <button
      class="editor-tool"
      onclick="showMessage('Effects opened')">

      <span>☆</span>
      Effects

    </button>


    <button
      class="editor-tool"
      onclick="showMessage('Overlay opened')">

      <span>▧</span>
      Overlay

    </button>


    <button
      class="editor-tool"
      onclick="showMessage('Captions opened')">

      <span>▤</span>
      Captions

    </button>


    <button
      class="editor-tool"
      onclick="showMessage('Filters opened')">

      <span>◌</span>
      Filters

    </button>

  </div>

</div>


<!-- FILE INPUTS -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  style="display:none"
  onchange="loadVideo(event)"
>

<input
  type="file"
  id="photoInput"
  accept="image/*"
  style="display:none"
  onchange="loadPhoto(event)"
>


<script>

let video =
  document.getElementById("videoPreview");

let videoURL = null;


/* OPEN VIDEO PICKER */

function openVideoPicker(){

  document
    .getElementById("videoInput")
    .click();

}


/* OPEN PHOTO PICKER */

function openPhotoPicker(){

  document
    .getElementById("photoInput")
    .click();

}


/* LOAD VIDEO */

function loadVideo(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  if(videoURL){
    URL.revokeObjectURL(videoURL);
  }

  videoURL =
    URL.createObjectURL(file);

  video.src = videoURL;

  document.getElementById("home").style.display =
    "none";

  document.getElementById("homeBottomNav").style.display =
    "none";

  document.getElementById("editor").style.display =
    "block";

  video.onloadedmetadata = function(){

    generateThumbnails();

  };

}


/* GENERATE REAL VIDEO THUMBNAILS */

function generateThumbnails(){

  const track =
    document.getElementById("videoTrack");

  track.innerHTML = "";

  const duration = video.duration;

  if(!duration || !isFinite(duration)){
    return;
  }

  const count = Math.min(
    Math.max(Math.ceil(duration),6),
    20
  );

  for(let i=0;i<count;i++){

    createThumbnail(
      i,
      count,
      duration,
      track
    );

  }

}


/* CREATE ONE THUMBNAIL */

function createThumbnail(
  index,
  count,
  duration,
  track
){

  const canvas =
    document.createElement("canvas");

  canvas.width = 180;
  canvas.height = 110;

  const ctx =
    canvas.getContext("2d");

  const tempVideo =
    document.createElement("video");

  tempVideo.src = videoURL;

  tempVideo.muted = true;

  tempVideo.playsInline = true;

  tempVideo.preload = "metadata";

  tempVideo.currentTime =
    (duration / count) * index;

  tempVideo.addEventListener(
    "seeked",
    function(){

      ctx.drawImage(
        tempVideo,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const img =
        document.createElement("img");

      img.className =
        "video-thumb";

      img.src =
        canvas.toDataURL("image/jpeg",0.75);

      img.onclick = function(){

        video.currentTime =
          (duration / count) * index;

      };

      track.appendChild(img);

      tempVideo.remove();

    },
    {once:true}
  );

}


/* PLAY / PAUSE */

function togglePlay(){

  if(video.paused){

    video.play();

    document.getElementById("playButton")
      .innerHTML = "❚❚";

  }else{

    video.pause();

    document.getElementById("playButton")
      .innerHTML = "▶";

  }

}


/* VIDEO TIME */

video.addEventListener(
  "timeupdate",
  function(){

    if(!video.duration){
      return;
    }

    const progress =
      video.currentTime /
      video.duration;

    const track =
      document.getElementById("videoTrack");

    const playhead =
      document.getElementById("playhead");

    const width =
      track.offsetWidth;

    playhead.style.left =
      (20 + progress * width) + "px";

  }
);


/* MUTE */

function muteVideo(){

  video.muted =
    !video.muted;

  showMessage(
    video.muted
      ? "Video muted"
      : "Sound restored"
  );

}


/* SPLIT */

function splitVideo(){

  if(!video.duration){

    showMessage("Select a video first");

    return;

  }

  const time =
    video.currentTime;

  showMessage(
    "Split point: " +
    formatTime(time)
  );

}


/* FORMAT TIME */

function formatTime(seconds){

  const mins =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    String(mins).padStart(2,"0")
    + ":" +
    String(secs).padStart(2,"0")
  );

}


/* FULLSCREEN */

function toggleFullscreen(){

  const area =
    document.querySelector(
      ".preview-area"
    );

  if(!document.fullscreenElement){

    if(area.requestFullscreen){
      area.requestFullscreen();
    }

  }else{

    document.exitFullscreen();

  }

}


/* BACK HOME */

function goHome(){

  video.pause();

  document.getElementById("editor")
    .style.display = "none";

  document.getElementById("home")
    .style.display = "block";

  document.getElementById("homeBottomNav")
    .style.display = "flex";

}


/* PHOTO */

function loadPhoto(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  showMessage(
    "Photo editing will be added next"
  );

}


/* UNDO */

function undoAction(){

  showMessage("Undo");

}


/* REDO */

function redoAction(){

  showMessage("Redo");

}


/* EXPORT */

function exportVideo(){

  showMessage(
    "Export system will be added next"
  );

}


/* MESSAGE */

function showMessage(text){

  const message =
    document.createElement("div");

  message.className =
    "message";

  message.innerText =
    text;

  document.body.appendChild(
    message
  );

  setTimeout(
    function(){

      message.remove();

    },
    1800
  );

}

</script>

</body>
</html>
