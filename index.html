<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ObeSplit Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#000}
.purple{background:#7A1EFF}
.glow{background:linear-gradient(90deg,#00F0FF,#FF00FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.icon-glow{filter:drop-shadow(0 0 12px rgba(0,240,255,.8)) drop-shadow(0 0 20px rgba(255,0,255,.5))}
</style>
</head>
<body class="max-w-[400px] mx-auto min-h-screen bg-black p-4 flex flex-col">

<!-- New video + -->
<div onclick="document.getElementById('file').click()" class="purple rounded-[14px] h-[130px] flex flex-col items-center justify-center mt-2 active:scale-95">
  <div class="text-[64px] icon-glow">📹</div>
  <div class="glow font-black text-[22px] mt-1">New video +</div>
</div>

<!-- Middle -->
<div class="flex gap-4 mt-5">
  <div class="flex flex-col gap-4">
    <div class="purple w-[110px] h-[110px] rounded-[14px] flex flex-col items-center justify-center">
      <div class="text-[42px] icon-glow">🌀</div>
      <div class="glow text-[12px] font-bold">Ai generator</div>
    </div>
    <div class="purple w-[110px] h-[110px] rounded-[14px] flex flex-col items-center justify-center">
      <div class="text-[38px] icon-glow">☁️</div>
      <div class="glow text-[12px] font-bold">Space</div>
    </div>
  </div>
  <div class="purple flex-1 rounded-[14px] flex flex-col items-center justify-center">
    <div class="text-[80px] icon-glow">📷</div>
    <div class="glow font-black text-[20px]">Edit photo</div>
  </div>
</div>

<!-- Projects -->
<div class="flex justify-between items-center mt-10 px-2">
  <div class="glow font-black text-[30px]">Projects</div>
  <div class="flex flex-col gap-1"><div class="w-8 h-2 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500"></div><div class="w-8 h-2 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500"></div><div class="w-8 h-2 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500"></div></div>
</div>

<div class="flex-1"></div>

<!-- Bottom Nav -->
<div class="h-[80px] flex justify-around items-end pb-3 border-t border-zinc-900 mt-6">
  <div class="text-center"><div class="text-[28px] icon-glow">🎬</div><div class="glow text-[14px] font-bold">Edit</div></div>
  <div class="text-center opacity-70"><div class="text-[26px]">🗂️</div><div class="glow text-[12px]">Templates</div></div>
  <div class="text-center opacity-70"><div class="text-[26px]">👤</div><div class="glow text-[12px]">Me</div></div>
</div>

<input type="file" id="file" hidden accept="video/*,image/*" onchange="alert('Go to editor!')">

</body>
</html>
