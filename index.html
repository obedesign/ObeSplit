<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ObeSplit</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
.glow{background:linear-gradient(90deg,#2EF2FF 0%,#A66CFF 50%,#FF6BFF 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:linear-gradient(135deg,#7A3AFF 0%,#5A20E0 100%);box-shadow:0 12px 30px rgba(122,58,255,.5),inset 0 1px 0 rgba(255,255,255,.25)}
#home{display:block} #editor{display:none}
.tool:active{transform:scale(0.88);background:#2A2A2A}
.clip-thumb{object-fit:cover;width:100%;height:100%}
</style>
</head>
<body class="bg-black m-0 overflow-hidden">

<!-- HOME -->
<div id="home" class="max-w-[430px] mx-auto min-h-screen bg-black px-4 pt-8 pb-28 overflow-y-auto h-screen">
<div onclick="pick()" class="card rounded-[28px] p-8 text-center cursor-pointer active:scale-[0.97] transition"><div class="text-[75px]">📹</div><div class="text-[30px] font-black glow mt-2">New video +</div></div>
<div class="grid grid-cols-5 gap-3 mt-4">
<div class="col-span-2 space-y-3"><div class="card rounded-[22px] h-[115px] flex flex-col items-center justify-center"><div class="text-[40px]">🤖</div><div class="text-[11px] font-bold glow">Ai generator</div></div><div class="card rounded-[22px] h-[115px] flex flex-col items-center justify-center"><div class="text-[36px]">🪐</div><div class="text-[11px] font-bold glow">Space</div></div></div>
<div class="col-span-3 card rounded-[22px] h-[242px] flex flex-col items-center justify-center"><div class="text-[90px]">📸</div><div class="text-[24px] font-bold glow">Edit photo</div></div>
</div>
<div class="flex justify-between items-center mt-9"><h2 class="text-[34px] font-black glow">Projects</h2><div class="opacity-60 text-xl">☰</div></div>
<div class="mt-4 text-zinc-500 text-sm">Tap New video + to start • Obeedit</div>
<div class="fixed bottom-0 left-0 right-0 bg-black border-t border-zinc-900"><div class="max-w-[430px] mx-auto flex justify-around py-3"><div class="text-center"><div class="text-[26px]">✂️</div><div class="text-xs font-bold glow">Edit</div></div><div class="text-center opacity-40"><div class="text-[26px]">📑</div><div class="text-xs">Templates</div></div><div class="text-center opacity-40"><div class="text-[26px]">👤</div><div class="text-xs">Me</div></div></div></div>
</div>

<!-- EDITOR - POLISHED LIKE YOUR SCREENSHOT -->
<div id="editor" class="h-screen w-screen bg-[#0F0F0F] flex flex-col">
<!-- Top bar -->
<div class="h-[52px] flex items-center justify-between px-4 bg-[#121212] border-b border-[#1F1F1F]">
<div class="flex items-center gap-6"><button onclick="goHome()" class="text-white text-[26px]">✕</button><span class="text-xl">🔍</span></div>
<div class="flex items-center gap-3"><div class="w-28 h-9 bg-[#232323] rounded-xl"></div><button onclick="exportV()" class="bg-[#2EF2FF] text-black font-black px-5 py-2.5 rounded-[12px] text-[14px] tracking-wide">Export</button></div>
</div>

<!-- Preview - YOUR SUNSET NOW SHOWS PERFECT -->
<div class="flex-1 bg-black relative flex items-center justify-center overflow-hidden">
<video id="vid" class="w-full h-full object-contain bg-black" playsinline muted></video>
<img id="imgPreview" class="w-full h-full object-contain hidden"/>
<div id="waterMark" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
<p class="text-white text-[36px] font-light tracking-widest" style="font-family:'Dancing Script';text-shadow:0 4px 20px rgba(0,0,0,.8)">PHOTO/VIDEO</p>
<p class="text-white text-[22px] -mt-2" style="font-family:'Dancing Script';text-shadow:0 2px 10px rgba(0,0,0,.8)">Obeedit</p>
</div>
<div id="txtOver" class="absolute font-black text-white text-[26px] hidden text-center px-6 drop-shadow-[0_2px_10px_rgba(0,0,0,.9)]"></div>
<button id="playBig" onclick="toggle()" class="absolute w-16 h-16 bg-white/20 backdrop-blur rounded-full flex items-center justify-center text-2xl">▶</button>
</div>

<!-- Transport -->
<div class="h-[46px] bg-[#121212] border-y border-[#232323] flex items-center justify-between px-4">
<div class="flex items-center gap-4"><button class="text-zinc-400 text-[18px]">⛶</button></div>
<button id="playBtn" onclick="toggle()" class="w-9 h-9 bg-white text-black rounded-full flex items-center justify-center text-[14px] font-black">▶</button
