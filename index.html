<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial,Helvetica,sans-serif}
button{border:0;font-family:inherit;cursor:pointer}

/* HOME */
#home{min-height:100vh;background:#000;padding:18px;padding-bottom:95px}
.home-grid{display:grid;grid-template-columns:1fr 1.35fr;grid-template-rows:155px 155px;gap:12px;max-width:520px;margin:0 auto}
.new-video{grid-column:1 / 3;height:72px;background:#18e58b;color:#000;border-radius:18px;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.card{border-radius:18px;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.card svg{width:38px;height:38px;margin-bottom:10px}
.ai-card{grid-column:1;grid-row:1;margin-top:84px}
.photo-card{grid-column:2;grid-row:1 / 3;background:#18e58b;color:#000}
.space-card{grid-column:1;grid-row:2;margin-top:0}
.projects{max-width:520px;margin:24px auto 0}
.projects-title{font-size:18px;font-weight:700;margin-bottom:14px}
.project-box{height:95px;background:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#777;font-size:14px}

.home-bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#080808;border-top:1px solid #202020;display:flex;justify-content:space-around;align-items:center;z-index:1000}
.nav-item{background:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px}
.nav-item.active{color:#fff}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* EDITOR */
#editor{display:none;min-height:100vh;background:#121212;padding-bottom:74px}
.editor-top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#121212}
.top-btn{background:none;color:#fff;font-size:26px;padding:5px}
.editor-title{display:none}
.export-btn{background:#18e58b;color:#000;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700}

.preview-area{height:54vh;min-height:340px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
#video{width:100%;height:100%;object-fit:contain;display:block}
.video-placeholder{color:#555;font-size:14px}

/* CONTROLS */
.controls{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:22px;
  padding:0 16px;
  background:#121212;
}
.control-btn{
  background:none;
  color:#fff;
  font-size:19px;
  opacity:.9;
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* CORRECTED TIMELINE WORKSPACE */
.timeline-area{
  background:#1c1c1c;
  padding:8px 0 12px;
  position:relative;
  border-top:1px solid #222;
  user-select:none;
}

.timeline-header{
  display:flex;
  align-items:center;
  color:#777;
  font-size:11px;
  padding:0 16px 8px;
  font-weight:500;
}

#currentTime{
  min-width:75px;
  font-weight:bold;
  color:#fff;
}

/* SCROLLABLE CONTAINER ENGINE */
.timeline-scroll-container{
  position:relative;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  cursor:grab;
}
.timeline-scroll-container::-webkit-scrollbar{display:none}

/* STATIC CENTER FIXED PLAYHEAD */
.center-playhead{
  position:absolute;
  top:30px;
  bottom:0;
  left:50%;
  width:2px;
  background:#fff;
  z-index:100;
  pointer-events:none;
  transform:translateX(-50%);
}
.center-playhead::before{
  content:"";
  position:absolute;
  top:-4px;
  left:50%;
  transform:translateX(-50%);
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
}

/* ALIGNED TRACK LANES CANVAS */
.tracks-canvas{
  display:flex;
  flex-direction:column;
  position:relative;
  width:max-content;
}

/* TIMELINE RULER */
.timeline-ruler{
  height:24px;
  position:relative;
  color:#888;
  font-size:10px;
}
.ruler-mark{
  position:absolute;
  transform:translateX(-50%);
  white-space:nowrap;
}

/* VIDEO/AUDIO/TEXT LANES GRID MAP */
.track-lane{
  height:72px;
  position:relative;
  margin-bottom:8px;
  background:rgba(255,255,255,0.02);
  border-radius:6px;
}
.track-lane.audio-lane, .track-lane.text-lane{
  height:34px;
}

/* UTILITY CLIPS GRID PLATFORM */
.clip-block{
  position:absolute;
  height:100%;
  background:#000;
  border-radius:6px;
  overflow:hidden;
  display:flex;
}
.thumbnail{
  height:100%;
  width:78px;
  object-fit:cover;
  border-right:1px solid #111;
  flex-shrink:0;
}

.extra-row-btn{
  position:absolute;
  height:100%;
  background:#262626;
  border-radius:6px;
  display:flex;
  align-items:center;
  padding:0 12px;
  color:#aaa;
  font-size:11px;
  gap:6px;
  cursor:pointer;
  border:1px dashed #444;
}
.extra-row-btn:hover{
  background:#333;
  color:#fff;
}

/* FIXED SIDEBAR ACTIONS DESIGNS */
.timeline-workspace-wrapper {
  display: flex;
  position: relative;
}
.sidebar-actions {
  width: 60px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 24px;
  background: #1c1c1c;
  z-index: 105;
  padding-left: 8px;
}
.sidebar-btn {
  height: 72px;
  background: #292929;
  color: #bbb;
  border-radius: 6px;
  font-size: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.sidebar-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}
.sidebar-btn.small-action {
  height: 34px;
}

/* EDITOR TOOLBAR */
.editor-toolbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:74px;
  background:#1c1c1c;
  border-top:1px solid #222;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  overflow-x:auto;
  padding:6px 2px 10px;
  z-index:900;
  scrollbar-width:none;
}
.editor-toolbar::-webkit-scrollbar{display:none}

.editor-tool{
  min-width:62px;
  flex:0 0 62px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:9px;
  padding:0;
}
.editor-tool svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}

input[type="file"]{display:none}
.message{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:10px 16px;
  border-radius:10px;
  font-size:12px;
  display:none;
  z-index:2000;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <div class="home-grid">
    <button class="new-video" onclick="openVideoPicker()">
      <span style="font-size:28px;line-height:1;">＋</span>
      NEW VIDEO
    </button>
    <button class="card ai-card" onclick="showMessage('AI Generator')">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></svg>
      AI Generator
    </button>
    <button class="card photo-card" onclick="openPhotoPicker()">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M3 17l5-5 4 4 3-3 6 5"/></svg>
      Edit Photo
    </button>
    <button class="card space-card" onclick="showMessage('Space')">
      <svg viewBox="0 0 24 24"><path d="M4 15c3.5-1 6.5-4 7.5-7.5"/><path d="M7 18c4.5-.5 8.5-4.5 9-9"/><path d="M12 21c4.5-1 8-4.5 9-9"/></svg>
      Space
    </button>
  </div>
  <div class="projects">
    <div class="projects-title">Projects</div>
    <div class="project-box">No projects yet</div>
  </div>
</div>

<!-- HOME NAV -->
<div class="home-bottom-nav" id="homeBottomNav">
  <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>Edit</button>
  <button class="nav-item"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10"/><path d="M7 12h6"/><path d="M7 16h8"/></svg>Templates</button>
  <button class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"/></svg>Me</button>
</div>

<!-- EDITOR -->
<div id="editor">
  <div class="editor-top">
    <button class="top-btn" onclick="goHome()">✕</button>
    <div class="editor-title">ObeSplit</div>
    <button class="export-btn" onclick="exportVideo()">Export</button>
  </div>

  <div class="preview-area">
    <video id="video" playsinline preload="metadata"></video>
    <div class="video-placeholder" id="videoPlaceholder">Select a video</div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="control-btn" onclick="showMessage('Fullscreen')">⤢</button>
    <button class="control-btn" onclick="togglePlay()" id="playIcon">▶</button>
    <button class="control-btn" onclick="undo()">↩</button>
    <button class="control-btn" onclick="redo()">↪</button>
  </div>

  <!-- TIMELINE STAGE WITH ACCURATE SCROLL LOGIC -->
  <div class="timeline-area">
    <div class="timeline-header">
      <span id="currentTime">00:00 / 00:00</span>
    </div>

    <div class="timeline-workspace-wrapper">
      <!-- FIXED LEFT BUTTON SECTIONS -->
      <div class="sidebar-actions">
        <button class="sidebar-btn" id="timelineMuteBtn" onclick="toggleMute()">
          <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M13 9l4 6m0-6l-4 6"/></svg>
          Mute
        </button>
        <button class="sidebar-btn small-action" onclick="showMessage('Add Audio')">Audio</button>
        <button class="sidebar-btn small-action" onclick="showMessage('Add Text')">Text</button>
      </div>

      <!-- CENTER STATIC PLAYHEAD -->
      <div class="center-playhead"></div>

      <!-- SCROLLABLE TRACK LAYERS -->
