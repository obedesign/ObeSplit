<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ObeSplit</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{-webkit-tap-highlight-color:transparent; font-family:Inter,sans-serif}
#editor{display:none}
</style>
</head>
<body class="bg-black m-0 p-0 overflow-hidden">

<!-- ==================== HOME FIRST - LIKE CAPCUT ==================== -->
<div id="home" class="max-w-[420px] mx-auto min-h-screen bg-[#0A0A0A] p-4 pb-20">
  <div class="text-white font-black text-[22px] mb-4">ObeSplit</div>
  <div onclick="fileIn.click()" class="bg-[#6F2CFF] rounded-[24px] p-12 text-center active:scale-95">
    <div class="text-[70px]">📹</div>
    <div class="text-white font-black text-[20px] mt-2">+ New video</div>
  </div>
  <div class="text-zinc-500 text-[12px] mt-8 text-center">Projects will show here</div>
</div>

<!-- ==================== EDITOR - CAPCUT CLONE ==================== -->
<div id="editor" class="h-[100dvh] w-screen bg-[#0F0F0F] flex flex-col overflow-hidden">

  <!-- Top bar -->
  <div class="h-[52px] min-h-[52px] bg-[#0F0F0F] flex items-center justify-between px-3">
    <button onclick="goHome()" class="text-white text-[20px]">✕</button>
    <div class="flex gap-2">
      <button class="bg-[#222] text-white px-4 py-2 rounded-full text-[12px]">Cover</button>
      <button onclick="doExport()" class="bg-[#2EF2FF] text-black px-5 py-2 rounded-full text-[13px] font-bold">Export</button>
    </div>
  </div>

  <!-- Preview - shows your sunset -->
  <div class="flex-1 min-h-0 bg-black relative flex items-center justify-center overflow-hidden">
    <video id="vid" class="w-full h-full object-contain bg-black" playsinline muted></video>
    <div id="vdText" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
      <p class="text-white text-[28px] font-black tracking-widest">PHOTO/VIDEO</p>
      <p class="text-white text-[18px]">Obeedit</p>
    </div>
    <button id="playBtn" onclick="toggle()" class="absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 text-white w-10 h-10 rounded-full flex items-center justify-center text-[14px]">▶</button>
  </div>

  <!-- ==================== TIMELINE START - Line 71 ==================== -->
  <!-- Time -->
  <div class="h-[36px] min-h-[36px] bg-[#0F0F0F] border-y border-[#232323] flex items-center justify-between px-3 text-[11px] text-zinc-300 font-mono">
    <span id="tTxt">00:00 / 00:20</span>
    <div class="flex gap-2 text-[10px] text-zinc-500"><span>00:00</span><span>00:01</span><span>00:02</span><span>00:03</span><span>00:04</span></div>
  </div>

  <!-- Tracks -->
  <div class="h-[140px] min-h-[140px] bg-[#0F0F0F] flex relative overflow-hidden">
    <div class="w-[74px] bg-[#181818] p-2 border-r border-[#232323]">
      <button onclick="doMute()" class="bg-[#262626] rounded-[12px] w-full py-3 flex flex-col items-center">
        <span id="micIcon" class="text-[16px]">🔊</span>
        <span class="text-[8px] text-zinc-400 leading-[9px] mt-1">Mute<br>clip</span>
      </button>
    </div>
    <div class="flex-1 p-2 space-y-2 overflow-hidden">
      <div id="track" class="h-[44px] bg-[#262626] rounded-[12px] flex items-center px-2 border border-[#333] relative">
        <div class="flex gap-[3px] w-[85%]"><div class="flex-1 h-[28px] bg-[#3A3A3A] rounded text-[10px] flex items-center justify-center text-zinc-400">clip</div><div class="flex-1 h-[28px] bg-[#444] rounded"></div></div>
        <div class="absolute right-2 w-7 h-7 bg-white rounded-md flex items-center justify-center text-black font-bold">+</div>
      </div>
      <div onclick="pickAudio()" class="h-[32px] bg-[#1A1A1A] rounded-[10px] flex items-center px-3 text-[12px] text-zinc-300 border border-[#232323]"><span class="text-[#2EF2FF] mr-2">+</span> Add audio</div>
      <div onclick="addText()" class="h-[32px] bg-[#1A1A1A] rounded-[10px] flex items-center px-3 text-[12px] text-zinc-300 border border-[#232323]"><span class="text-[#2EF2FF] mr-2">+</span> Add text</div>
    </div>
    <div id="playhead" class="absolute top-0 bottom-0 w-[2px] bg-white left-[50%]"><div class="w-2 h-2 bg-white rotate-45 -ml-[3px]"></div></div>
  </div>
  <!-- ==================== TIMELINE END ==================== -->

  <!-- Bottom tools - FIXED to show -->
  <div class="h-[72px] min-h-[72px] bg-[#121212] border-t border-[#232323] flex justify-around items-center px-1 pb-1">
    <button onclick="doSplit()" class="flex flex-col items-center"><span class="text-[20px]">✂️</span><span class="text-[10px] text-white">Edit</span></button>
    <button class="flex flex-col items-center"><span class="text-[18px]">🎵</span><span class="text-[10px] text-white">Audio</span></button>
    <button onclick="addText()" class="flex flex-col items-center"><span class="text-[16px] font-black">T</span><span class="text-[10px] text-white">Text</span></button>
    <button class="flex flex-col items-center"><span class="text-[18px]">✨</span><span class="text-[10px] text-zinc-400">Effects</span></button>
    <button class="flex flex-col items-center"><span class="text-[18px]">🖼️</span><span class="text-[10px] text-zinc-400">Overlay</span></button>
    <button class="flex flex-col items-center"><span class="text-[14px]">💬</span><span class="text-[10px] text-zinc-400">Captions</span></button>
    <button class="flex flex-col items-center"><span class="text-[14px]">🎨</span><span class="text-[10px] text-zinc-400">Filters</span></button>
  </div>
</div>

<input type="file" id="fileIn" accept="video/*,image/*" hidden>
<input type="file" id="audioIn" accept="audio/*" hidden>

<script>
const fileIn=document.getElementById('fileIn'), vid=document.getElementById('vid'), home=document.getElementById('home'), editor=document.getElementById('editor'), tTxt=document.getElementById('tTxt'), vdText=document.getElementById('vdText'), playBtn=document.getElementById('playBtn');

fileIn.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  vid.src=URL.createObjectURL(f); vid.load();
  home.style.display='none'; editor.style.display='flex';
  vdText.style.display='none'; vid.muted=false;
  vid.onloadeddata=()=>{vid.play(); playBtn.textContent='⏸';}
};

function goHome(){editor.style.display='none'; home.style.display='block'; vid.pause(); vid.src='';}
function toggle(){if(vid.paused){vid.play(); playBtn.textContent='⏸';}else{vid.pause(); playBtn.textContent='▶';}}
vid.ontimeupdate=()=>{
  const c=vid.currentTime||0, d=vid.duration||20;
  tTxt.textContent=`00:${String(Math.floor(c)).padStart(2,'0')} / 00:${String(Math.floor(d)).padStart(2,'0')}`;
  document.getElementById('playhead').style.left=(c/d*100)+'%';
  playBtn.textContent=vid.paused?'▶':'⏸';
}
function doMute(){vid.muted=!vid.muted; document.getElementById('micIcon').textContent=vid.muted?'🔇':'🔊';}
function doSplit(){alert('Split at '+tTxt.textContent);}
function addText(){const t=prompt('Text:'); if(!t) return; const el=document.createElement('div'); el.textContent=t; el.style.cssText='position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:white;font-size:28px;font-weight:900;text-shadow:2px 2px 4px black;'; vdText.parentElement.appendChild(el); vdText.style.display='none';}
function pickAudio(){document.getElementById('audioIn').click();}
function doExport(){const a=document.createElement('a'); a.href=vid.src; a.download='ObeSplit.mp4'; a.click();}
</script>
</body>
</html>
