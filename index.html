<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ObeSplit</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap');
body{font-family:'Inter',sans-serif;background:#000;margin:0}
.glow-text{
background:linear-gradient(90deg,#2EF2FF 0%,#A66CFF 50%,#FF6BFF 100%);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 10px rgba(102,102,255,0.5));
}
.card-purple{
background:#6F2CFF;
box-shadow: 0 8px 32px rgba(111,44,255,0.4), inset 0 1px 1px rgba(255,255,255,0.2);
}
.icon-3d{filter:drop-shadow(0 8px 12px rgba(0,0,0,0.5)) drop-shadow(0 0 20px rgba(46,242,255,0.3));}
</style>
</head>
<body class="bg-black text-white">
<div class="max-w-[390px] mx-auto min-h-screen px-4 pt-6 pb-28 relative">

<!-- TOP CARD: New video + -->
<div onclick="document.getElementById('videoInput').click()" class="card-purple rounded-[22px] p-6 text-center cursor-pointer active:scale-[0.98] transition">
<div class="flex justify-center">
<div class="text-[72px] icon-3d leading-none">📹</div>
</div>
<div class="mt-1 text-[28px] font-extrabold glow-text tracking-tight">New video +</div>
<input type="file" id="videoInput" accept="video/*" hidden>
</div>

<!-- MIDDLE GRID -->
<div class="grid grid-cols-5 gap-3 mt-4">

<!-- Left column: 2 small cards -->
<div class="col-span-2 flex flex-col gap-3">
<div class="card-purple rounded-[16px] p-4 h-[102px] flex flex-col justify-center items-center cursor-pointer">
<div class="text-[38px] icon-3d">🌀</div>
<div class="text-[11px] font-extrabold glow-text mt-1">Ai generator</div>
</div>
<div class="card-purple rounded-[16px] p-4 h-[102px] flex flex-col justify-center items-center cursor-pointer">
<div class="text-[36px] icon-3d">☁️</div>
<div class="text-[12px] font-extrabold glow-text mt-1">Space</div>
</div>
</div>

<!-- Right: Big Edit photo -->
<div class="col-span-3">
<div onclick="alert('Edit photo coming soon! Upload photo?')" class="card-purple rounded-[16px] h-[216px] flex flex-col justify-center items-center cursor-pointer">
<div class="text-[88px] icon-3d leading-none">📷</div>
<div class="text-[22px] font-extrabold glow-text mt-2">Edit photo</div>
</div>
</div>
</div>

<!-- Projects Row -->
<div class="flex justify-between items-center mt-8 px-2">
<h2 class="text-[32px] font-extrabold glow-text">Projects</h2>
<div class="flex flex-col gap-1.5">
<div class="w-9 h-2.5 rounded-full bg-gradient-to-r from-cyan-300 to-purple-500"></div>
<div class="w-9 h-2.5 rounded-full bg-gradient-to-r from-cyan-300 to-purple-500"></div>
<div class="w-9 h-2.5 rounded-full bg-gradient-to-r from-cyan-300 to-purple-500"></div>
</div>
</div>

<div id="projectsList" class="mt-4 px-2">
<p class="text-zinc-600 text-sm">No projects yet. Tap New video + to start.</p>
</div>

<!-- Video Preview (hidden until upload) -->
<div id="preview" class="hidden mt-6 bg-zinc-900 rounded-2xl p-3">
<video id="vid" class="w-full rounded-xl" controls></video>
<button onclick="document.getElementById('preview').classList.add('hidden')" class="w-full mt-3 bg-white text-black py-3 rounded-full font-bold">Close</button>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-xl border-t border-zinc-900">
<div class="max-w-[390px] mx-auto flex justify-around py-4 px-6">
<div class="flex flex-col items-center cursor-pointer">
<div class="text-[28px] icon-3d">🎬</div>
<div class="text-[14px] font-bold glow-text">Edit</div>
</div>
<div class="flex flex-col items-center cursor-pointer opacity-70">
<div class="text-[28px]">🗂️</div>
<div class="text-[14px] font-bold text-zinc-400">Templates</div>
</div>
<div class="flex flex-col items-center cursor-pointer opacity-70">
<div class="text-[28px]">👤</div>
<div class="text-[14px] font-bold text-zinc-400">Me</div>
</div>
</div>
</div>

</div>
<script>
document.getElementById('videoInput').addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file) return;
 const url=URL.createObjectURL(file);
 document.getElementById('vid').src=url;
 document.getElementById('preview').classList.remove('hidden');
 document.getElementById('projectsList').innerHTML=`<div class='bg-zinc-900 rounded-xl p-3 flex gap-3'><div class='w-16 h-16 bg-purple-600 rounded-lg flex items-center justify-center'>🎥</div><div><div class='font-bold'>${file.name.slice(0,20)}</div><div class='text-xs text-zinc-500'>Just now • ${Math.round(file.size/1024/1024)} MB</div></div></div>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
});
</script>
</body>
</html>
