<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ObeSplit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0e0e0e;color:#fff;font-family:Arial,Helvetica,sans-serif}
button{border:0;font-family:inherit;cursor:pointer}
#home{min-height:100vh;background:#000;padding:18px;padding-bottom:95px}
.home-grid{display:grid;grid-template-columns:1fr 1.35fr;grid-template-rows:155px 155px;gap:12px;max-width:520px;margin:0 auto}
.new-video{grid-column:1 / 3;height:72px;background:#18e58b;color:#000;border-radius:18px;font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.card{border-radius:18px;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.card svg{width:38px;height:38px;margin-bottom:10px}
.ai-card{grid-column:1;grid-row:1;margin-top:84px}
.photo-card{grid-column:2;grid-row:1 / 3;background:#18e58b;color:#000}
.space-card{grid-column:1;grid-row:2;margin-top:0}
.projects{max-width:520px;margin:24px auto 0}
.projects-title{font-size:18px;font-weight:700;margin-bottom:14px}
.project-box{height:95px;background:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#777;font-size:14px}
.home-bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#080808;border-top:1px solid #202020;display:flex;justify-content:space-around;align-items:center;z-index:1000}
.nav-item{background:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px}
.nav-item.active{color:#fff}
.nav-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#editor{display:none;min-height:100vh;background:#121212;padding-bottom:74px}
.editor-top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#121212}
.top-btn{background:none;color:#fff;font-size:26px;padding:5px}
.editor-title{display:none}
.export-btn{background:#18e58b;color:#000;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700}
.preview-area{height:54vh;min-height:340px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
#video{width:100%;height:100%;object-fit:contain;display:block}
.video-placeholder{color:#555;font-size:14px}
/* FIX 1: CONTROLS */
.controls{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:32px;
  padding:0 16px;
  background:#121212;
}
.control-btn{
  background:none;
  color:#fff;
  font-size:22px;
  opacity:1;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* FIX 2: TIMELINE HEADER */
.timeline-area{
  background:#1c1c1c;
  padding:8px 0 6px;
  position:relative;
  border-top:1px solid #222;
}
.timeline-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#aaa;
  font-size:11px;
  padding:0 10px 7px;
  font-weight:500;
  overflow:hidden;
  white-space:nowrap;
}
#currentTime{
  flex-shrink:0;
  white-space:nowrap;
  min-width:78px;
  color:#fff;
  font-weight:700;
  margin-right:15px;
}
.timeline-header-ruler{
  display:flex;
  gap:12px;
  margin-left:15px;
  overflow:hidden;
  white-space:nowrap;
  color:#999;
  flex:1;
  min-width:0;
}
.timeline-wrapper{
  display:flex;
  gap:6px;
  align-items:center;
  position:relative;
  padding:0 8px;
}
.track-actions{
  display:flex;
  gap:5px;
  flex-shrink:0;
}
/* FIX 3: TRACK BTN BRIGHT */
.track-btn{
  background:#3a3a3a;
  color:#fff;
  border-radius:8px;
  width:56px;
  height:72px;
  padding:4px 2px;
  font-size:9px;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  opacity:1;
}
.track-btn.active{
  background:#4a4a4a;
  color:#fff;
}
.track-btn svg{
  width:20px;
  height:20px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
}
.timeline{
  height:72px;
  background:#000;
  border-radius:7px;
  overflow-x:auto;
  overflow-y:hidden;
  position:relative;
  scrollbar-width:none;
  flex:1;
  min-width:0;
}
.timeline::-webkit-scrollbar{display:none}
.thumbnails{
  height:100%;
  display:flex;
  width:max-content;
  align-items:center;
  position:relative;
}
.thumbnail{
  height:72px;
  width:78px;
  flex:0 0 78px;
  object-fit:cover;
  border-right:1px solid #111;
}
.add-clip-btn{
  height:72px;
  width:48px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  flex:0 0 48px;
  cursor:pointer;
  border-radius:6px;
  margin-left:3px;
}
.playhead{
  position:absolute;
  top:-4px;
  bottom:-4px;
  width:2px;
  background:#fff;
  left:0;
  z-index:30;
  pointer-events:none;
}
.playhead::before{
  content:"";
  position:absolute;
  top:-4px;
  left:50%;
  transform:translateX(-50%);
  width:9px;
  height:9px;
  background:#fff;
  border-radius:50%;
}
.timeline-line{
  height:2px;
  background:#fff;
  margin:7px 8px 0;
  border-radius:2px;
  position:relative;
}
.timeline-line::before{
  content:"";
  position:absolute;
  left:0;
  top:-4px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff;
}
.timeline-extra{
  padding:6px 8px 0;
  display:flex;
  gap:6px;
}
.extra-row{
  height:30px;
  background:#262626;
  border-radius:6px;
  display:flex;
  align-items:center;
  padding:0 10px;
  color:#888;
  font-size:11px;
  gap:5px;
  flex:1;
}
.extra-row.plus{color:#fff;font-size:15px}
.editor-toolbar{
  position:fixed;
  left:0;right:0;bottom:0;
  height:74px;
  background:#1c1c1c;
  border-top:1px solid #222;
  display:flex;
  overflow-x:auto;
  padding:6px 2px 10px;
  z-index:900;
  scrollbar-width:none;
}
.editor-toolbar::-webkit-scrollbar{display:none}
.editor-tool{
  min-width:62px;
  flex:0 0 62px;
  background:none;
  color:#aaa;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:9px;
}
.editor-tool svg{
  width:21px;height:21px;
  fill:none;stroke:currentColor;stroke-width:1.6;
}
input[type="file"]{display:none}
.message{
  position:fixed;left:50%;bottom:90px;
  transform:translateX(-50%);
  background:#333;color:#fff;
  padding:10px 16px;border-radius:10px;
  font-size:12px;display:none;z-index:2000;
}
</style>
</head>
<body>
<div id="home">
  <div class="home-grid">
    <button class="new-video" onclick="openVideoPicker()"><span style="font-size:28px;line-height:1;">＋</span>NEW VIDEO</button>
    <button class="card ai-card" onclick="showMessage('AI Generator')">AI Generator</button>
    <button class="card photo-card" onclick="openPhotoPicker()">Edit Photo</button>
    <button class="card space-card" onclick="showMessage('Space')">Space</button>
  </div>
  <div class="projects"><div class="projects-title">Projects</div><div class="project-box">No projects yet</div></div>
</div>
<div class="home-bottom-nav" id="homeBottomNav">
  <button class="nav-item active">Edit</button><button class="nav-item">Templates</button><button class="nav-item">Me</button>
</div>
<div id="editor">
  <div class="editor-top"><button class="top-btn" onclick="goHome()">✕</button><div class="editor-title">ObeSplit</div><button class="export-btn" onclick="exportVideo()">Export</button></div>
  <div class="preview-area"><video id="video" playsinline preload="metadata"></video><div class="video-placeholder" id="videoPlaceholder">Select a video</div></div>
  <div class="controls"><button class="control-btn" onclick="showMessage('Fullscreen')">⤢</button><button class="control-btn" onclick="togglePlay()" id="playIcon">▶</button><button class="control-btn" onclick="undo()">↩</button><button class="control-btn" onclick="redo()">↪</button></div>
  <div class="timeline-area">
    <div class="timeline-header"><span id="currentTime">00:00 / 00:00</span><div class="timeline-header-ruler" id="ruler">00:00 • 00:01 • 00:02 • 00:03 • 00:04 • 00:05</div></div>
    <div class="timeline-wrapper">
      <div class="track-actions">
        <button class="track-btn" onclick="toggleMute()" id="timelineMuteBtn">🔊 Mute clip</button>
        <button class="track-btn active" onclick="showMessage('Cover')">✎ Cover</button>
      </div>
      <div class="timeline" id="timelineContainer"><div class="thumbnails" id="thumbnails"><div class="playhead" id="playhead"></div></div></div>
    </div>
    <div class="timeline-line"></div>
    <div class="timeline-extra"><div class="extra-row" onclick="showMessage('Add Audio')"><span class="plus">＋</span> Add audio</div><div class="extra-row" onclick="showMessage('Add Text')"><span class="plus">＋</span> Add text</div></div>
  </div>
  <div class="editor-toolbar">
    <button class="editor-tool" onclick="showMessage('Edit')">Edit</button><button class="editor-tool" onclick="showMessage('Audio')">Audio</button><button class="editor-tool" onclick="showMessage('Text')">Text</button><button class="editor-tool" onclick="showMessage('Effects')">Effects</button><button class="editor-tool" onclick="showMessage('Overlay')">Overlay</button><button class="editor-tool" onclick="showMessage('Captions')">Captions</button><button class="editor-tool" onclick="showMessage('Filters')">Filters</button><button class="editor-tool" onclick="showMessage('Aspect Ratio')">Aspect Ratio</button>
  </div>
</div>
<input type="file" id="videoInput" accept="video/*" onchange="loadVideo(event)">
<input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)">
<div class="message" id="message"></div>
<script>
const video=document.getElementById("video");
let videoURL=null;
let isPickingFile=false;
function openVideoPicker(){isPickingFile=true;document.getElementById("homeBottomNav").style.display="none";document.getElementById("videoInput").click();}
function openPhotoPicker(){isPickingFile=true;document.getElementById("homeBottomNav").style.display="none";document.getElementById("photoInput").click();}
window.addEventListener("focus",function(){if(isPickingFile){setTimeout(function(){if(document.getElementById("editor").style.display!=="block"){document.getElementById("homeBottomNav").style.display="flex";}isPickingFile=false;},300);}});
function loadVideo(event){isPickingFile=false;const file=event.target.files[0];if(!file){document.getElementById("homeBottomNav").style.display="flex";return;}if(videoURL){URL.revokeObjectURL(videoURL);}videoURL=URL.createObjectURL(file);video.src=videoURL;document.getElementById("home").style.display="none";document.getElementById("homeBottomNav").style.display="none";document.getElementById("editor").style.display="block";document.getElementById("videoPlaceholder").style.display="none";video.onloadedmetadata=function(){document.getElementById("currentTime").textContent="00:00 / "+formatTime(video.duration);generateRuler(video.duration);generateThumbnails();};}
function generateRuler(duration){const ruler=document.getElementById("ruler");ruler.innerHTML="";const total=Math.ceil(duration);for(let i=0;i<=total;i++){const span=document.createElement("span");span.textContent=formatTime(i);ruler.appendChild(span);if(i<total){const dot=document.createElement("span");dot.textContent=" • ";dot.style.opacity="0.4";ruler.appendChild(dot);}}}
async function generateThumbnails(){const container=document.getElementById("thumbnails");const existingPlayhead=document.getElementById("playhead");container.innerHTML="";container.appendChild(existingPlayhead);const duration=video.duration;if(!duration||isNaN(duration)){return;}const count=12;const tempVideo=document.createElement("video");tempVideo.src=videoURL;tempVideo.muted=true;tempVideo.playsInline=true;tempVideo.preload="auto";await new Promise((resolve)=>{tempVideo.onloadedmetadata=resolve;});const canvas=document.createElement("canvas");canvas.width=120;
