<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObeSplit - Video Editor</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* --- SCREEN 1: HOMEPAGE --- */
        #homepage { display: flex; flex-direction: column; height: 100%; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 20px; }
        .brand-title { font-size: 28px; font-weight: bold; background: linear-gradient(45deg, #00ffff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .menu-btn { font-size: 24px; color: #7f39fb; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .main-btn { grid-column: span 2; background: #7f39fb; border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; }
        .main-btn i { font-size: 50px; color: #a272fc; margin-bottom: 10px; }
        .main-btn h2 { font-size: 22px; color: #fff; }
        
        .side-btn { background: #1a1a1a; border-radius: 20px; padding: 25px 15px; text-align: center; border: 1px solid #333; }
        .side-btn.purple-theme { background: linear-gradient(135deg, #150030, #30005a); border: none; }
        .side-btn i { font-size: 30px; margin-bottom: 8px; color: #00ffff; }
        .side-btn p { font-size: 14px; font-weight: 500; }
        
        .projects-section h3 { font-size: 22px; margin-bottom: 15px; color: #fff; }
        .no-projects { color: #666; font-size: 14px; text-align: center; margin-top: 20px; }
        
        .nav-bar { margin-top: auto; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { text-align: center; color: #666; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: #00ffff; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        /* --- SCREEN 2: TIMELINE EDITOR --- */
        #editor-screen { display: flex; flex-direction: column; height: 100%; position: relative; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111; }
        .close-btn { font-size: 22px; cursor: pointer; }
        .export-btn { background: #00bfff; color: #000; padding: 6px 16px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; }
        
        .preview-window { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative; max-height: 45%; }
        .preview-window video { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .playback-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #141414; font-size: 12px; color: #aaa; }
        .play-btn { font-size: 22px; color: #fff; cursor: pointer; }
        
        .timeline-area { background: #181818; padding: 15px 0; overflow-x: auto; display: flex; flex-direction: column; position: relative; }
        .timeline-scaler { height: 20px; border-bottom: 1px solid #333; display: flex; padding-left: 50%; color: #555; font-size: 10px; gap: 40px; margin-bottom: 10px; }
        .playhead-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; z-index: 10; pointer-events: none; }
        
        .track-row { display: flex; align-items: center; margin-bottom: 8px; padding-left: 50%; min-height: 45px; }
        .track-label { width: 60px; position: absolute; left: 15px; background: #181818; z-index: 5; font-size: 11px; color: #aaa; display: flex; align-items: center; gap: 5px; }
        .media-block { background: #333; height: 40px; border-radius: 4px; border: 1px solid #555; display: flex; align-items: center; padding: 0 10px; font-size: 11px; white-space: nowrap; color: #fff; }
        
        .editor-footer-nav { margin-top: auto; display: flex; justify-content: space-around; padding: 12px 0; background: #111; border-top: 1px solid #222; overflow-x: auto; }
        .footer-tool { text-align: center; color: #ccc; font-size: 11px; padding: 0 10px; cursor: pointer; min-width: 60px; }
        .footer-tool i { font-size: 18px; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- Hidden native file inputs to trigger phone gallery -->
    <input type="file" id="video-picker" accept="video/*" class="hidden">
    <input type="file" id="photo-picker" accept="image/*" class="hidden">

    <!-- SCREEN 1: HOMEPAGE -->
    <div id="homepage">
        <div class="header">
            <h1 class="brand-title">ObeSplit</h1>
            <i class="fa-solid fa-bars menu-btn"></i>
        </div>

        <div class="grid-container">
            <div class="main-btn" id="btn-new-video">
                <i class="fa-solid fa-video"></i>
                <h2>New video +</h2>
            </div>
            <div class="side-btn purple-theme">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <p>Ai generator</p>
            </div>
            <div class="side-btn" id="btn-edit-photo" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <i class="fa-solid fa-camera" style="color: #a272fc; font-size: 40px;"></i>
                <p style="margin-top: 5px; font-weight: bold;">Edit photo</p>
            </div>
        </div>

        <div class="projects-section">
            <h3>Projects</h3>
            <div class="no-projects">No projects yet. Tap New video + to start.</div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active"><i class="fa-solid fa-clapperboard"></i>Edit</div>
            <div class="nav-item"><i class="fa-solid fa-folder-open"></i>Templates</div>
            <div class="nav-item"><i class="fa-solid fa-user"></i>Me</div>
        </div>
    </div>

    <!-- SCREEN 2: TIMELINE EDITOR -->
    <div id="editor-screen" class="hidden">
        <div class="editor-header">
            <i class="fa-solid fa-xmark close-btn" id="btn-close-editor"></i>
            <i class="fa-solid fa-magnifying-glass" style="color: #aaa;"></i>
            <button class="export-btn">Export</button>
        </div>

        <div class="preview-window">
            <video id="main-preview" playsinline></video>
        </div>

        <div class="playback-controls">
            <span id="current-time">00:00 / 00:00</span>
            <i class="fa-solid fa-play play-btn" id="btn-play"></i>
            <i class="fa-solid fa-arrow-rotate-left" style="font-size: 16px;"></i>
        </div>

        <div class="timeline-area">
            <div class="playhead-line"></div>
            <div class="timeline-scaler">
                <span>00:00</span><span>00:01</span><span>00:02</span><span>00:03</span><span>00:04</span>
            </div>
            
            <!-- Video/Photo Track -->
            <div class="track-row">
                <div class="track-label"><i class="fa-solid fa-video"></i> Media</div>
                <div class="media-block" id="timeline-media-clip">No clip loaded</div>
            </div>
            
            <!-- Audio Track -->
            <div class="track-row">
                <div class="track-label"><i class="fa-solid fa-music"></i> Audio</div>
                <div class="media-block" style="background: #1e3a2f; border-color: #2e5a44; width: 120px; opacity: 0.5;">+ Add audio</div>
            </div>

            <!-- Text Track -->
            <div class="track-row">
                <div class="track-label"><i class="fa-solid fa-font"></i> Text</div>
                <div class="media-block" style="background: #3a1e28; border-color: #5a2e3d; width: 100px; opacity: 0.5;">+ Add text</div>
            </div>
        </div>

        <div class="editor-footer-nav">
            <div class="footer-tool"><i class="fa-solid fa-scissors"></i>Edit</div>
            <div class="footer-tool"><i class="fa-solid fa-music"></i>Audio</div>
            <div class="footer-tool"><i class="fa-solid fa-font"></i>Text</div>
            <div class="footer-tool"><i class="fa-solid fa-wand-magic-sparkles"></i>Effects</div>
            <div class="footer-tool"><i class="fa-solid fa-layer-group"></i>Overlay</div>
            <div class="footer-tool"><i class="fa-solid fa-closed-captioning"></i>Captions</div>
            <div class="footer-tool"><i class="fa-solid fa-palette"></i>Filters</div>
        </div>
    </div>

    <script>
        // DOM Elements
        const homepage = document.getElementById('homepage');
        const editorScreen = document.getElementById('editor-screen');
        const btnNewVideo = document.getElementById('btn-new-video');
        const btnEditPhoto = document.getElementById('btn-edit-photo');
        const btnCloseEditor = document.getElementById('btn-close-editor');
        const videoPicker = document.getElementById('video-picker');
        const photoPicker = document.getElementById('photo-picker');
        const mainPreview = document.getElementById('main-preview');
        const btnPlay = document.getElementById('btn-play');
        const currentTimeDisplay = document.getElementById('current-time');
        const timelineMediaClip = document.getElementById('timeline-media-clip');

        // Go from Home to Gallery Selection (Video)
        btnNewVideo.addEventListener('click', () => {
            videoPicker.click();
        });

        // Go from Home to Gallery Selection (Photo)
